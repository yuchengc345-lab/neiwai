, "question": "有關心臟去纖維震顫器使用的敘述，下列何者錯誤？", "options": ["避免於氧氣帳內使用", "測試功能時，電擊板須對空進行放電", "放電時，不可碰觸病人或病床", "常見的合併症為皮膚灼傷"], "answer": 1, "explanation": "答案：測試功能時，電擊板須對空進行放電\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「測試功能時，電擊板須對空進行放電」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「測試功能時，電擊板須對空進行放電」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「避免於氧氣帳內使用、放電時，不可碰觸病人或病床」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-034", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心律不整之治療，下列何者正確？", "options": ["A-V block可採去纖維震顫術改善", "A-V block可使用頸動脈竇按摩方式改善", "APC不需要特別治療", "Af可口服Heparin以避免血栓形成"], "answer": 2, "explanation": "答案：APC不需要特別治療\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「APC不需要特別治療」；Heparin 題要抓 aPTT 監測與拮抗劑\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「APC不需要特別治療」之所以是答案，是因為它符合本題核心判斷。Heparin 常以 aPTT 監測抗凝效果，主要風險是出血；發生嚴重出血時常用 protamine sulfate 作為拮抗劑。 其他選項如「A-V block可採去纖維震顫術改善、A-V block可使用頸動脈竇按摩方式改善」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：抗凝藥題先分清楚：Heparin 看 aPTT，Warfarin 看 PT/INR。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-035", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關抗心律不整藥物，下列何者屬於鈉離子通道阻斷劑？", "options": ["Amioda-rone(Cordarone)", "Atropine", "Lidocaine(Xylocaine)", "Propra-nolol (Inderal)"], "answer": 2, "explanation": "答案：Lidocaine(Xylocaine)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「Lidocaine(Xylocaine)」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「Lidocaine(Xylocaine)」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「Amioda-rone(Cordarone)、Atropine」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-036", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關病人心電圖VT之相關處置，下列何者正確？", "options": ["有意識的情況下，實施去纖維震顫術，應選擇同步心臟電氣轉換術(synchronized cardioversion)", "無脈搏的情況下，實施去纖維震顫術前，應先注射麻醉鎮靜劑", "有脈搏的情況下，實施去纖維震顫術，可直接使用100焦耳", "心電圖從VT變Vf時，應停止實施去纖維震顫術，改心肺復甦術"], "answer": 0, "explanation": "答案：有意識的情況下，實施去纖維震顫術，應選擇同步心臟電氣轉換術(synchronized cardioversion)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「有意識的情況下，實施去纖維震顫術，應選擇同步心臟電氣轉換術(synchronized cardioversion)」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「有意識的情況下，實施去纖維震顫術，應選擇同步心臟電氣轉換術(synchronized cardioversion)」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「無脈搏的情況下，實施去纖維震顫術前，應先注射麻醉鎮靜劑、有脈搏的情況下，實施去纖維震顫術，可直接使用100焦耳」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-037", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟節律器之敘述，下列何者正確？", "options": ["裝設心臟節律器術後，出現持續打嗝是正常現象", "永久性心臟節律器的激搏器在體外，可方便更換電池", "裝設暫時性心臟節律器，心電圖上不會出現激搏波(pace spike)", "裝設永久性心律調節器後，4～6週內應避免提重物"], "answer": 3, "explanation": "答案：裝設永久性心律調節器後，4～6週內應避免提重物\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「裝設永久性心律調節器後，4～6週內應避免提重物」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「裝設永久性心律調節器後，4～6週內應避免提重物」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「裝設心臟節律器術後，出現持續打嗝是正常現象、永久性心臟節律器的激搏器在體外，可方便更換電池」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-038", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關裝置植入式自動心律轉換去顫器(AICD)病人居家護理指導之敘述，下列何者錯誤？", "options": ["AICD發出電擊時，若觸摸病人可能有觸電感", "發生打嗝不停的情形時，可以多飲水或重複憋氣", "術後4～6週內患肢避免提重物以及劇烈肩部運動", "可使用微波爐、電鍋等加熱電器用品，但應避免核磁共振檢查"], "answer": 1, "explanation": "答案：發生打嗝不停的情形時，可以多飲水或重複憋氣\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「發生打嗝不停的情形時，可以多飲水或重複憋氣」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「發生打嗝不停的情形時，可以多飲水或重複憋氣」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「AICD發出電擊時，若觸摸病人可能有觸電感、術後4～6週內患肢避免提重物以及劇烈肩部運動」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-039", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟節律器放置術後護理措施之敘述，下列何者不適宜？", "options": ["心電圖上出現心室激搏波(spike)時，應立即通知醫師", "每日評估植入處傷口有無發炎、血腫情形", "術後隔日，植入側的手臂宜避免抬高的關節運動", "術後第一小時應每15分鐘評估生命徵象"], "answer": 0, "explanation": "答案：心電圖上出現心室激搏波(spike)時，應立即通知醫師\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「心電圖上出現心室激搏波(spike)時，應立即通知醫師」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「心電圖上出現心室激搏波(spike)時，應立即通知醫師」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「每日評估植入處傷口有無發炎、血腫情形、術後隔日，植入側的手臂宜避免抬高的關節運動」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-040", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關裝置心臟節律器之護理指導，下列何者錯誤？", "options": ["心律變慢時，可能是電池快沒電的徵象", "每天需監測橈動脈至少1分鐘整", "持續打嗝時，可利用Valsalva 運動減緩打嗝", "術後6週內避免抬重物"], "answer": 2, "explanation": "答案：持續打嗝時，可利用Valsalva 運動減緩打嗝\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「持續打嗝時，可利用Valsalva 運動減緩打嗝」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「持續打嗝時，可利用Valsalva 運動減緩打嗝」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「心律變慢時，可能是電池快沒電的徵象、每天需監測橈動脈至少1分鐘整」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-041", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何者為永久性心臟節律器之適應症？", "options": ["完全房室傳導阻斷", "心房早期收縮", "心室早期收縮", "心房撲動"], "answer": 0, "explanation": "答案：完全房室傳導阻斷\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「完全房室傳導阻斷」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「完全房室傳導阻斷」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「心房早期收縮、心室早期收縮」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-042", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心律不整病人照護之敘述，下列何者錯誤？", "options": ["在施行整流術前，應給與Valium，以減少病人焦慮與不適", "裝置心臟節律器的病人，應隨身攜帶心臟節律器之識別卡", "心室上心搏過速(SVT)的病人，可教導伐氏操作法(Valsalva’s maneuver)", "服用 Warfarin的病人，需定期監測部分凝血活酶時間(PTT)"], "answer": 3, "explanation": "答案：服用 Warfarin的病人，需定期監測部分凝血活酶時間(PTT)\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「服用 Warfarin的病人，需定期監測部分凝血活酶時間(PTT)」；Warfarin 題要抓凝血監測與出血安全\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「服用 Warfarin的病人，需定期監測部分凝血活酶時間(PTT)」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「在施行整流術前，應給與Valium，以減少病人焦慮與不適、裝置心臟節律器的病人，應隨身攜帶心臟節律器之識別卡」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-043", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心房纖維顫動臨床處置之敘述，下列何者正確？", "options": ["可採頸動脈竇按摩，使心跳變慢", "可使用去纖維震顫術，使心跳恢復規則", "可裝設植入式自動心律轉換去顫器，改善心悸症狀", "可服用鈉離子通道阻斷劑，降低心跳"], "answer": 3, "explanation": "答案：可服用鈉離子通道阻斷劑，降低心跳\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「可服用鈉離子通道阻斷劑，降低心跳」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「可服用鈉離子通道阻斷劑，降低心跳」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「可採頸動脈竇按摩，使心跳變慢、可使用去纖維震顫術，使心跳恢復規則」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-044", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關抽菸會增加動脈粥狀硬化危險性之敘述，下列何者正確？", "options": ["刺激副交感神經，促使血管痙攣", "增加血小板凝集，加速血塊凝結", "抑制白血球生長，增加菌斑鈣化", "減少血紅素溶解，降低血中氧氣"], "answer": 1, "explanation": "答案：增加血小板凝集，加速血塊凝結\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「增加血小板凝集，加速血塊凝結」；化學治療題要抓骨髓抑制、感染風險與副作用處理\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「增加血小板凝集，加速血塊凝結」之所以是答案，是因為它符合本題核心判斷。化療常見骨髓抑制、噁心嘔吐、黏膜炎、掉髮與疲倦；護理上要監測血球數、感染與出血徵象，並教導口腔照護與避免感染暴露。 其他選項如「刺激副交感神經，促使血管痙攣、抑制白血球生長，增加菌斑鈣化」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：化療題看到發燒、白血球低或血小板低，要立刻想到感染與出血風險。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-045", "unit": "單元10 心臟血管系統疾病與護理1", "question": "病人進食大餐後感到胸痛，休息片刻後疼痛緩解，下列何者為其可能原因？", "options": ["心絞痛", "胃潰瘍", "消化不良", "心肌梗塞"], "answer": 0, "explanation": "答案：心絞痛\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「心絞痛」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「心絞痛」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「胃潰瘍、消化不良」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-046", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心絞痛病人胸痛之特性，下列何者錯誤？", "options": ["在胸骨後或心前區有壓迫感", "疼痛可能會輻射蔓延至左肩、上臂", "持續時間久，可能會超過30分鐘以上", "舌下含硝化甘油可緩解疼痛"], "answer": 2, "explanation": "答案：持續時間久，可能會超過30分鐘以上\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「持續時間久，可能會超過30分鐘以上」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「持續時間久，可能會超過30分鐘以上」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「在胸骨後或心前區有壓迫感、疼痛可能會輻射蔓延至左肩、上臂」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-047", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列病人描述何者不是穩定型心絞痛疼痛之典型特徵？", "options": ["用力解便後即感覺胸口疼痛", "痛的感覺好像是胸口壓了什麼東西一樣，一口氣吸不上來", "左邊與右邊兩邊胸口都很痛，肩膀也痛到抬不起來", "從吃完飯一直痛到晚上睡覺前才好一點，大概痛了3個多小時吧"], "answer": 3, "explanation": "答案：從吃完飯一直痛到晚上睡覺前才好一點，大概痛了3個多小時吧\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「從吃完飯一直痛到晚上睡覺前才好一點，大概痛了3個多小時吧」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「從吃完飯一直痛到晚上睡覺前才好一點，大概痛了3個多小時吧」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「用力解便後即感覺胸口疼痛、痛的感覺好像是胸口壓了什麼東西一樣，一口氣吸不上來」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-048", "unit": "單元10 心臟血管系統疾病與護理1", "question": "能降低冠狀動脈疾病病人心肌耗氧量的藥物，下列何者錯誤？", "options": ["乙型交感神經阻斷劑", "硝酸鹽類", "鈣離子阻斷劑", "低劑量阿斯匹靈"], "answer": 3, "explanation": "答案：低劑量阿斯匹靈\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「低劑量阿斯匹靈」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「低劑量阿斯匹靈」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「乙型交感神經阻斷劑、硝酸鹽類」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-049", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心絞痛病人接受股動脈經皮穿腔冠狀動脈血管成形術(PTCA)之術後護理，下列何者錯誤？", "options": ["監測雙側肢體之脈搏", "監測心電圖", "鼓勵病人多飲水", "鼓勵病人行下肢全關節主動運動"], "answer": 3, "explanation": "答案：鼓勵病人行下肢全關節主動運動\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「鼓勵病人行下肢全關節主動運動」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「鼓勵病人行下肢全關節主動運動」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「監測雙側肢體之脈搏、監測心電圖」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-050", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關病人接受經皮穿腔冠狀動脈血管成形術(PTCA)處置之敘述，下列何者錯誤？", "options": ["術前須禁食6～8小時", "術後須密切注意生命徵象變化", "術後須注意穿刺部位遠心端肢體之循環", "術後會立即拔除所有導管並在傷口加壓止血"], "answer": 3, "explanation": "答案：術後會立即拔除所有導管並在傷口加壓止血\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「術後會立即拔除所有導管並在傷口加壓止血」；Warfarin 題要抓凝血監測與出血安全\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「術後會立即拔除所有導管並在傷口加壓止血」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「術前須禁食6～8小時、術後須密切注意生命徵象變化」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-051", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關冠狀動脈繞道手術後，為維持正常心輸出量的處置，下列敘述何者錯誤？", "options": ["使用Dobutamine，可以增加心肌收縮力", "使用Furosemide(Lasix)，可以降低心臟之前負荷", "使用Nitroglycerine，可以增加心肌收縮力", "使用Nipride，可以同時降低心臟之前、後負荷"], "answer": 2, "explanation": "答案：使用Nitroglycerine，可以增加心肌收縮力\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「使用Nitroglycerine，可以增加心肌收縮力」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「使用Nitroglycerine，可以增加心肌收縮力」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「使用Dobutamine，可以增加心肌收縮力、使用Furosemide(Lasix)，可以降低心臟之前負荷」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-052", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心絞痛病人使用硝酸甘油之護理指導，下列何者錯誤？", "options": ["應含在舌下，不可吞服", "含服時必須採坐姿或臥姿以避免姿勢性低血壓", "為方便隨身攜帶可將藥物自瓶中取出用乾淨的紙包好保存", "含服後可能會有頭痛、面部潮紅等情形"], "answer": 2, "explanation": "答案：為方便隨身攜帶可將藥物自瓶中取出用乾淨的紙包好保存\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「為方便隨身攜帶可將藥物自瓶中取出用乾淨的紙包好保存」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「為方便隨身攜帶可將藥物自瓶中取出用乾淨的紙包好保存」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「應含在舌下，不可吞服、含服時必須採坐姿或臥姿以避免姿勢性低血壓」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-053", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心絞痛之常用藥物nitroglycerine(NTG)之護理指導，下列何者錯誤？", "options": ["疼痛時服用，連續5顆無效，才考慮就醫", "舌下含服時，舌頭會感到熱、辣", "平時應存放在遮光陰涼處，避免高溫", "使用皮膚貼片時，應每日更換貼片，並輪換部位"], "answer": 0, "explanation": "答案：疼痛時服用，連續5顆無效，才考慮就醫\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「疼痛時服用，連續5顆無效，才考慮就醫」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「疼痛時服用，連續5顆無效，才考慮就醫」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「舌下含服時，舌頭會感到熱、辣、平時應存放在遮光陰涼處，避免高溫」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-054", "unit": "單元10 心臟血管系統疾病與護理1", "question": "心絞痛病人使用β阻斷劑的主要目的，下列何者正確？", "options": ["促進尿液的排出", "增加心臟收縮力", "增加心跳的速率", "降低心肌需氧量"], "answer": 3, "explanation": "答案：降低心肌需氧量\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「降低心肌需氧量」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「降低心肌需氧量」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「促進尿液的排出、增加心臟收縮力」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-055", "unit": "單元10 心臟血管系統疾病與護理1", "question": "林先生因胸痛入院，診斷為缺血性心臟病，接受植入冠狀動脈支架3個。出院時，林先生表示病已經痊癒，不用再吃藥了。身為主護護理師，下列反應何者錯誤？", "options": ["鼓勵林先生說出心裡的想法，以不批判的態度傾聽", "了解林先生的想法，並針對其問題給予個別性指導", "指責其錯誤的想法，並恐嚇其若不繼續治療的後果", "告知血管內支架的作用，以及繼續服藥的重要性"], "answer": 2, "explanation": "答案：指責其錯誤的想法，並恐嚇其若不繼續治療的後果\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「指責其錯誤的想法，並恐嚇其若不繼續治療的後果」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「指責其錯誤的想法，並恐嚇其若不繼續治療的後果」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「鼓勵林先生說出心裡的想法，以不批判的態度傾聽、了解林先生的想法，並針對其問題給予個別性指導」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-056", "unit": "單元10 心臟血管系統疾病與護理1", "question": "李先生75歲由家人送至急診室，主訴有胸悶、噁心、呼吸困難情形，外觀臉色蒼白、情緒顯焦慮，下列護理措施何者不適宜？", "options": ["放置靜脈留置針", "行12導程心電圖檢查", "給與氧氣", "給與Lorazepam (Ativan)靜脈注射"], "answer": 3, "explanation": "答案：給與Lorazepam (Ativan)靜脈注射\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「給與Lorazepam (Ativan)靜脈注射」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「給與Lorazepam (Ativan)靜脈注射」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「放置靜脈留置針、行12導程心電圖檢查」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-057", "unit": "單元10 心臟血管系統疾病與護理1", "question": "急性心肌梗塞最典型的臨床表徵，下列何者正確？", "options": ["胸痛持續時間小於20分鐘", "血壓上升", "服用Nitroglycerin(NTG)可以緩解胸痛", "休息無法緩解胸痛"], "answer": 3, "explanation": "答案：休息無法緩解胸痛\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「休息無法緩解胸痛」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「休息無法緩解胸痛」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「胸痛持續時間小於20分鐘、血壓上升」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-058", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關冠狀動脈疾病病人接受鉈-201之檢查目的，下列何者正確？", "options": ["監測僧帽瓣及主動脈瓣的功能", "觀察心室收縮及舒張的情形", "確定心肌受傷的部位與範圍", "判定心臟電氣傳導的狀態"], "answer": 2, "explanation": "答案：確定心肌受傷的部位與範圍\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「確定心肌受傷的部位與範圍」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「確定心肌受傷的部位與範圍」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「監測僧帽瓣及主動脈瓣的功能、觀察心室收縮及舒張的情形」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-059", "unit": "單元10 心臟血管系統疾病與護理1", "question": "急性心肌梗塞病人之心電圖顯示在II、III與aVF導程出現T波倒置與ST段升高，下列何者為其最可能之梗塞部位？", "options": ["下壁", "前壁", "後壁", "側壁"], "answer": 0, "explanation": "答案：下壁\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「下壁」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「下壁」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「前壁、後壁」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-060", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關急性心肌梗塞的診斷檢查，下列敘述何者錯誤？", "options": ["血液中肌酸磷酸激酶(CPK)升高可以表示組織損傷", "心肌旋轉蛋白(Troponin I)對心肌受損具有特異性及敏感性", "心電圖出現Q波表示心肌受損在表層", "心電圖ST間段及T波的改變可以協助判斷心肌是缺氧、缺血或壞死"], "answer": 2, "explanation": "答案：心電圖出現Q波表示心肌受損在表層\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「心電圖出現Q波表示心肌受損在表層」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「心電圖出現Q波表示心肌受損在表層」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「血液中肌酸磷酸激酶(CPK)升高可以表示組織損傷、心肌旋轉蛋白(Troponin I)對心肌受損具有特異性及敏感性」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-061", "unit": "單元10 心臟血管系統疾病與護理1", "question": "急性心肌梗塞的診斷檢查，下列何者最具專一性？", "options": ["心肌鈣蛋白I(cardiac troponin I)", "鉈-201掃描(Tl-201)", "肌紅素(myoglobin)", "心電圖"], "answer": 0, "explanation": "答案：心肌鈣蛋白I(cardiac troponin I)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「心肌鈣蛋白I(cardiac troponin I)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「心肌鈣蛋白I(cardiac troponin I)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「鉈-201掃描(Tl-201)、肌紅素(myoglobin)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-062", "unit": "單元10 心臟血管系統疾病與護理1", "question": "急性心肌梗塞後，下列何種心肌酶指標最快恢復正常？", "options": ["肌球蛋白(myoglobin)", "肌酸磷酸激酶(CPK)", "肌鈣蛋白I(troponin-I)", "乳酸脫氫酶(LDH)"], "answer": 0, "explanation": "答案：肌球蛋白(myoglobin)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「肌球蛋白(myoglobin)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「肌球蛋白(myoglobin)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「肌酸磷酸激酶(CPK)、肌鈣蛋白I(troponin-I)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-063", "unit": "單元10 心臟血管系統疾病與護理1", "question": "心肌梗塞後病人所出現的心電圖變化，下列何者一旦出現最有可能永遠不會消失？", "options": ["T波倒置", "ST段升高", "不正常Q波", "QRS綜合波變窄"], "answer": 2, "explanation": "答案：不正常Q波\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「不正常Q波」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「不正常Q波」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「T波倒置、ST段升高」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-064", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關急性心肌梗塞病人採限鈉飲食之敘述，下列何者正確？", "options": ["可改善現存水腫問題，並提高心臟效能", "可預防因組織水腫所導致的血壓升高", "可避免水分滯留，以減少心臟工作負荷", "可產生利尿效果，並減少循環血量"], "answer": 2, "explanation": "答案：可避免水分滯留，以減少心臟工作負荷\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「可避免水分滯留，以減少心臟工作負荷」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「可避免水分滯留，以減少心臟工作負荷」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「可改善現存水腫問題，並提高心臟效能、可預防因組織水腫所導致的血壓升高」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-065", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關冠狀動脈疾病治療藥物之敘述，下列何者正確？", "options": ["心絞痛使用nitroglycerin(NTG)，必須密切監測心搏出量", "心絞痛使用propra-nolol(Inderal)，主要作用是擴張動脈，減輕心臟後負荷", "心肌梗塞使用morphine，可以減輕疼痛並且降低心臟前負荷", "心肌梗塞使用heparin，需要密切監測凝血酶原時間(PT)"], "answer": 2, "explanation": "答案：心肌梗塞使用morphine，可以減輕疼痛並且降低心臟前負荷\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「心肌梗塞使用morphine，可以減輕疼痛並且降低心臟前負荷」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「心肌梗塞使用morphine，可以減輕疼痛並且降低心臟前負荷」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「心絞痛使用nitroglycerin(NTG)，必須密切監測心搏出量、心絞痛使用propra-nolol(Inderal)，主要作用是擴張動脈，減輕心臟後負荷」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-066", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心肌梗塞使用aspirin之敘述，下列何者正確？", "options": ["緩解心肌梗塞造成的胸痛", "降低心肌需氧量", "避免血小板凝集而產生血栓", "溶解冠狀動脈內之血栓"], "answer": 2, "explanation": "答案：避免血小板凝集而產生血栓\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「避免血小板凝集而產生血栓」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「避免血小板凝集而產生血栓」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「緩解心肌梗塞造成的胸痛、降低心肌需氧量」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-067", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心肌梗塞急性期的治療，下列敘述何者正確？①從鼻套管給10 L/min氧氣②給予麻醉性止痛劑止痛，如morphine③給予血栓溶解劑治療④給予抗凝血劑治療⑤補充維生素K：", "options": ["①②③", "①④⑤", "②③④", "③④⑤"], "answer": 2, "explanation": "答案：②③④\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「②③④」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「②③④」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「①②③、①④⑤」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-068", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心肌梗塞後性生活的建議事項，下列敘述何者正確？①應該儘量避免以免再次發作②能量消耗大約與上下兩層樓相當③飽餐後或酒後比較適合性行為④性行為事後應預防性服用NTG⑤應在熟悉的環境與伴侶進行以避免過度緊張與刺激⑥環境的室溫勿太冷或太熱：", "options": ["①②③", "①④⑥", "②⑤⑥", "③④⑤"], "answer": 2, "explanation": "答案：②⑤⑥\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「②⑤⑥」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「②⑤⑥」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「①②③、①④⑥」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-069", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關第一期心臟復健，下列敘述何者錯誤？", "options": ["以新陳代謝當量(metabolic equivalent, MET)指標作為活動量的指引", "採漸進方式的增加活動量", "血壓上升不超過正常血壓值25 mmHg", "活動時增加的心跳速率至少要超過休息時的25%"], "answer": 3, "explanation": "答案：活動時增加的心跳速率至少要超過休息時的25%\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「活動時增加的心跳速率至少要超過休息時的25%」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「活動時增加的心跳速率至少要超過休息時的25%」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「以新陳代謝當量(metabolic equivalent, MET)指標作為活動量的指引、採漸進方式的增加活動量」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-070", "unit": "單元10 心臟血管系統疾病與護理1", "question": "心肌梗塞病人注射嗎啡的目的，下列何者錯誤？", "options": ["止痛", "降低前負荷", "支氣管擴張", "加快心跳速率"], "answer": 3, "explanation": "答案：加快心跳速率\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「加快心跳速率」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「加快心跳速率」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「止痛、降低前負荷」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-071", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心肌梗塞後病人身體活動之護理指導，下列何者正確？", "options": ["保持絕對臥床休息7天以降低心臟耗氧量", "儘量維持平躺姿勢以促進心臟功能之恢復", "儘量避免彎曲膝部交疊雙腳以免血栓形成", "出院後即可恢復原有之生活"], "answer": 2, "explanation": "答案：儘量避免彎曲膝部交疊雙腳以免血栓形成\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「儘量避免彎曲膝部交疊雙腳以免血栓形成」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「儘量避免彎曲膝部交疊雙腳以免血栓形成」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「保持絕對臥床休息7天以降低心臟耗氧量、儘量維持平躺姿勢以促進心臟功能之恢復」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-072", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關接受由股動脈穿刺執行經皮穿腔冠狀動脈血管成形術(PTCA)之 病人，治療後需臥床平躺6～8小時且不可彎屈膝蓋或髖部之目的，下列何者正確？", "options": ["預防血栓形成", "預防顯影劑滲入組織中", "預防頭痛", "預防姿勢性低血壓"], "answer": 0, "explanation": "答案：預防血栓形成\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「預防血栓形成」；Warfarin 題要抓凝血監測與出血安全\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「預防血栓形成」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「預防顯影劑滲入組織中、預防頭痛」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit10-073", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關急性心肌梗塞病人之護理措施，下列何者不適當？", "options": ["協助採半坐臥姿休息，以促進肺擴張及減少心臟負荷", "提供氧氣，改善呼吸困難、胸痛現象", "建議少量多餐，避免產氣、含咖啡因飲食", "教導規律進行等長運動，以維持肌肉耐力"], "answer": 3, "explanation": "答案：教導規律進行等長運動，以維持肌肉耐力\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「教導規律進行等長運動，以維持肌肉耐力」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「教導規律進行等長運動，以維持肌肉耐力」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「協助採半坐臥姿休息，以促進肺擴張及減少心臟負荷、提供氧氣，改善呼吸困難、胸痛現象」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit10-074", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心肌梗塞病人之實驗室檢查結果，下列何者錯誤？", "options": ["WBC會上升", "LDH1/LDH2＜1", "Troponin I上升可做為心肌壞死的標記", "CK-MB值上升表示心肌受損"], "answer": 1, "explanation": "答案：LDH1/LDH2＜1\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「LDH1/LDH2＜1」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「LDH1/LDH2＜1」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「WBC會上升、Troponin I上升可做為心肌壞死的標記」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-075", "unit": "單元10 心臟血管系統疾病與護理1", "question": "急性心肌梗塞病人可能會合併出現的症狀，下列何者錯誤？", "options": ["低度發燒", "滲透性利尿", "噁心、嘔吐", "呼吸短促"], "answer": 1, "explanation": "答案：滲透性利尿\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「滲透性利尿」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「滲透性利尿」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「低度發燒、噁心、嘔吐」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-076", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟復健計畫第一期之主要目的與內容，下列何者正確？", "options": ["主要為教育病人疾病相關知識與日常自我照顧之漸進性活動", "出院前皆需執行走上一層樓再走下來的活動", "走樓梯時須使用氧氣", "不適用於心肌梗塞病人"], "answer": 0, "explanation": "答案：主要為教育病人疾病相關知識與日常自我照顧之漸進性活動\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「主要為教育病人疾病相關知識與日常自我照顧之漸進性活動」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「主要為教育病人疾病相關知識與日常自我照顧之漸進性活動」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「出院前皆需執行走上一層樓再走下來的活動、走樓梯時須使用氧氣」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-077", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何者是Heparin之解毒劑？", "options": ["Protamine sulfate", "Streptokinase", "Vitamin B12", "Vitamin K1"], "answer": 0, "explanation": "答案：Protamine sulfate\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「Protamine sulfate」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「Protamine sulfate」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「Streptokinase、Vitamin B12」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-078", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟復健運動計畫中所指的1個代謝當量之敘述，下列何者正確？", "options": ["每公斤體重每分鐘消耗1.0mL氧氣量", "每公斤體重每分鐘消耗2.5mL氧氣量", "每公斤體重每分鐘消耗3.5mL氧氣量", "每公斤體重每分鐘消耗5.0mL氧氣量"], "answer": 2, "explanation": "答案：每公斤體重每分鐘消耗3.5mL氧氣量\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「每公斤體重每分鐘消耗3.5mL氧氣量」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「每公斤體重每分鐘消耗3.5mL氧氣量」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「每公斤體重每分鐘消耗1.0mL氧氣量、每公斤體重每分鐘消耗2.5mL氧氣量」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-079", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟復健(cardiac rehabilitation; CR)運動原則之敘述，下列何者錯誤？", "options": ["運動前應先暖身5～10分鐘", "為達到最大運動效果，可以摒住呼吸", "用餐後不宜立刻運動", "運動強度之最大心率以(220－年齡)×70～85%為原則"], "answer": 1, "explanation": "答案：為達到最大運動效果，可以摒住呼吸\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「為達到最大運動效果，可以摒住呼吸」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「為達到最大運動效果，可以摒住呼吸」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「運動前應先暖身5～10分鐘、用餐後不宜立刻運動」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-080", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心肌梗塞病人的護理，下列敘述何者錯誤？", "options": ["協助採取半坐臥姿，減少心肌耗氧量", "教導等長運動，增加活動耐力", "提供氧氣，增加心肌供氧量", "教導必要時可於性交前服用NTG，預防胸痛不適"], "answer": 1, "explanation": "答案：教導等長運動，增加活動耐力\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「教導等長運動，增加活動耐力」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「教導等長運動，增加活動耐力」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「協助採取半坐臥姿，減少心肌耗氧量、提供氧氣，增加心肌供氧量」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-081", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關急救藥物主要治療效果的敘述，下列何者錯誤？", "options": ["Amiodarone 主要用於治療病人持續出現心室纖維顫動或是無脈搏心室心搏過速", "Atropine 多用於心搏過緩或心臟收縮不全", "Dopamine 多用於治療低血壓", "Sodium Bicarbonate(NaHCO3)多用於治療鹼血症"], "answer": 3, "explanation": "答案：Sodium Bicarbonate(NaHCO3)多用於治療鹼血症\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「Sodium Bicarbonate(NaHCO3)多用於治療鹼血症」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「Sodium Bicarbonate(NaHCO3)多用於治療鹼血症」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「Amiodarone 主要用於治療病人持續出現心室纖維顫動或是無脈搏心室心搏過速、Atropine 多用於心搏過緩或心臟收縮不全」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-082", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何者是心肌梗塞最常見且會導致死亡的併發症？", "options": ["心因性休克", "心肌梗塞再度發生", "心律不整", "急性肺水腫"], "answer": 2, "explanation": "答案：心律不整\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「心律不整」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「心律不整」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「心因性休克、心肌梗塞再度發生」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-083", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟復健(cardiac rehabilitation; CR)活動時應注意事項的敘述，下列何者錯誤？", "options": ["活動時應以漸進性方式增加強度", "活動初期的心跳速率以其最大心跳的80%為原則", "活動時的心跳速率以不超過靜態休息時的20次/分鐘為原則", "活動後血壓上升以不超過正常血壓值25mmHg為原則"], "answer": 1, "explanation": "答案：活動初期的心跳速率以其最大心跳的80%為原則\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「活動初期的心跳速率以其最大心跳的80%為原則」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「活動初期的心跳速率以其最大心跳的80%為原則」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「活動時應以漸進性方式增加強度、活動時的心跳速率以不超過靜態休息時的20次/分鐘為原則」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-084", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何者為冠狀動脈性心臟病人服用Aspirin之主要目的？", "options": ["緩解發作時胸痛", "鬆弛血管平滑肌", "抑制血小板凝集", "減緩心跳速率"], "answer": 2, "explanation": "答案：抑制血小板凝集\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「抑制血小板凝集」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「抑制血小板凝集」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「緩解發作時胸痛、鬆弛血管平滑肌」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-001", "unit": "單元11 心臟血管系統疾病與護理2", "question": "張先生，64歲，因呼吸喘、下肢水腫至急診求治，診斷為心臟衰竭。護理師助張先生作身體檢查與評估時，下列何項檢查因心臟衰竭而可能會有陽性反應發現？", "options": ["墨菲氏徵象(Murphy’s sign)", "肝頸反流(hepatojugular reflux)", "逆流填充測驗(retrograde filling test)", "霍曼氏徵象(Homan’s sign)"], "answer": 1, "explanation": "答案：肝頸反流(hepatojugular reflux)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「肝頸反流(hepatojugular reflux)」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「肝頸反流(hepatojugular reflux)」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「墨菲氏徵象(Murphy’s sign)、逆流填充測驗(retrograde filling test)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-002", "unit": "單元11 心臟血管系統疾病與護理2", "question": "造成心臟衰竭的病因中，下列何者會增加心臟的前負荷？", "options": ["主動脈瓣狹窄", "心室中膈缺損", "肺高壓", "心包膜炎"], "answer": 1, "explanation": "答案：心室中膈缺損\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「心室中膈缺損」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「心室中膈缺損」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「主動脈瓣狹窄、肺高壓」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-003", "unit": "單元11 心臟血管系統疾病與護理2", "question": "針對心臟衰竭病人的評估結果，下列何者最需要護理師密切觀察？", "options": ["下肢水腫", "呼吸音出現囉音(rales)", "血壓146/88 mmHg", "微血管再填充試驗(capillary refill test)小於3秒"], "answer": 1, "explanation": "答案：呼吸音出現囉音(rales)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「呼吸音出現囉音(rales)」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「呼吸音出現囉音(rales)」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「下肢水腫、血壓146/88 mmHg」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-004", "unit": "單元11 心臟血管系統疾病與護理2", "question": "針對左心室射出率(EVEF)為12%，有端坐呼吸且雙側下肢水腫厲害的心臟衰竭病人之護理，下列何者較不適當？", "options": ["協助採半坐臥姿勢以維持呼吸順暢", "指導飲食限水、限鹽的方法", "抬高雙腳30度以上以利改善水腫", "監測並記錄體重變化及攝入與排出量"], "answer": 2, "explanation": "答案：抬高雙腳30度以上以利改善水腫\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「抬高雙腳30度以上以利改善水腫」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「抬高雙腳30度以上以利改善水腫」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「協助採半坐臥姿勢以維持呼吸順暢、指導飲食限水、限鹽的方法」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit11-005", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列何者為左心室衰竭早期常見的症狀？", "options": ["咳嗽", "頸靜脈怒張", "端坐呼吸", "陣發性夜間呼吸困難"], "answer": 0, "explanation": "答案：咳嗽\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「咳嗽」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「咳嗽」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「頸靜脈怒張、端坐呼吸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-006", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列何者為右心衰竭之早期臨床表徵？", "options": ["端坐呼吸", "下垂性水腫", "尿液減少", "肺水腫"], "answer": 1, "explanation": "答案：下垂性水腫\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「下垂性水腫」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「下垂性水腫」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「端坐呼吸、尿液減少」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-007", "unit": "單元11 心臟血管系統疾病與護理2", "question": "歲的王太太是退休公務員，平日在家日常生活活動都靠家人幫忙，休息時仍感呼吸喘，晚上常因呼吸不順無法入睡，根據美國紐約心臟學會(NYHA)的心臟功能分級標準，上述情況何者正確？", "options": ["第一級", "第二級", "第三級", "第四級"], "answer": 3, "explanation": "答案：第四級\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「第四級」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「第四級」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「第一級、第二級」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-008", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心臟衰竭臨床處置之敘述，下列何者錯誤？", "options": ["使用主動脈內氣球幫浦(IABP)，可以增加冠狀動脈血流且減少心臟後負荷", "毛地黃與Thiazide類利尿劑並用，可以避免發生毛地黃中毒", "低鹽飲食可以減少心臟前負荷", "使用Dobutamine可以增加心肌收縮力，提高心輸出量"], "answer": 1, "explanation": "答案：毛地黃與Thiazide類利尿劑並用，可以避免發生毛地黃中毒\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「毛地黃與Thiazide類利尿劑並用，可以避免發生毛地黃中毒」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「毛地黃與Thiazide類利尿劑並用，可以避免發生毛地黃中毒」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「使用主動脈內氣球幫浦(IABP)，可以增加冠狀動脈血流且減少心臟後負荷、低鹽飲食可以減少心臟前負荷」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-009", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列那些藥物可以增加心輸出量？①毛地黃②dobutamine③中劑量dopamine④硝化甘油⑤鈣離子阻斷劑：", "options": ["①②③", "①②④", "②③⑤", "③④⑤"], "answer": 0, "explanation": "答案：①②③\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「①②③」；Digoxin 題要連到心尖脈、心搏過慢、血鉀與中毒症狀\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「①②③」之所以是答案，是因為它符合本題核心判斷。給 Digoxin 前需評估心尖脈，若心搏過慢要暫緩並通知醫師；低血鉀會增加毒性風險，噁心、嘔吐、視覺異常與心律不整都是警訊。 其他選項如「①②④、②③⑤」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：記住 Digoxin：先量心尖脈，再看鉀離子與中毒表現。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-010", "unit": "單元11 心臟血管系統疾病與護理2", "question": "曾先生心臟衰竭住院，住院時出現臉色蒼白、冒冷汗、陣發性夜間呼吸困難及咳出大量帶有血絲的泡沫痰。請問曾先生出現那一種合併症？", "options": ["氣喘", "肺結核", "肺栓塞", "肺水腫"], "answer": 3, "explanation": "答案：肺水腫\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「肺水腫」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「肺水腫」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「氣喘、肺結核」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-011", "unit": "單元11 心臟血管系統疾病與護理2", "question": "心衰竭病人之心電圖持續出現明顯U波，在給予藥物時，應注意下列何種藥物可能有中毒的危險？", "options": ["利尿劑", "軟便劑", "血管擴張劑", "毛地黃製劑"], "answer": 3, "explanation": "答案：毛地黃製劑\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「毛地黃製劑」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「毛地黃製劑」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「利尿劑、軟便劑」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-012", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關降低心衰竭病人心臟後負荷之措施，下列何者正確？", "options": ["限制鈉的攝取", "採高坐臥姿休息", "監測每天輸出入量、體重及水腫情形", "依醫囑提供嗎啡製劑"], "answer": 3, "explanation": "答案：依醫囑提供嗎啡製劑\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「依醫囑提供嗎啡製劑」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「依醫囑提供嗎啡製劑」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「限制鈉的攝取、採高坐臥姿休息」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-013", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心臟衰竭病人的照護，下列何者正確？①採高坐臥姿勢可以減少心臟後負荷②限水限鹽分的攝取是為了減少前負荷③使用動脈血管擴張劑可以降低周邊血管阻力及後負荷④使用嗎啡可以改善呼吸喘但無法減輕心臟負荷：", "options": ["①③", "①④", "②③", "②④"], "answer": 2, "explanation": "答案：②③\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「②③」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「②③」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「①③、①④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-014", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關Dopamine作用的敘述，下列何者正確？①2μg/kg/min會增加心肌的自動性，因此可減少心室節律障礙②可治療低血容量性休克③5～10μg/kg/min主要作用是增加腎血流量④大於10μg/kg/min作用是末梢血管收縮：", "options": ["①③", "①④", "②③", "②④"], "answer": 3, "explanation": "答案：②④\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「②④」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「②④」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「①③、①④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-015", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心臟衰竭合併肺水腫病人之護理措施及其原理的敘述，下列何者正確？", "options": ["應採頭低腳高的姿勢，以增加回心血量", "應限制液體的攝入量，以減少心臟的後負荷", "必要時可以依醫囑給予嗎啡，以減輕前後負荷", "須限制給氧，以減輕心臟負擔"], "answer": 2, "explanation": "答案：必要時可以依醫囑給予嗎啡，以減輕前後負荷\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「必要時可以依醫囑給予嗎啡，以減輕前後負荷」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「必要時可以依醫囑給予嗎啡，以減輕前後負荷」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「應採頭低腳高的姿勢，以增加回心血量、應限制液體的攝入量，以減少心臟的後負荷」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-016", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心衰竭病人使用多巴胺(dopamine)之敘述，下列何者正確？", "options": ["初時應以高劑量迅速緩解病人症狀", "低劑量使用可增加腎臟血流量", "中劑量使用可使血管收縮血壓上升", "高劑量使用可增加心臟收縮力"], "answer": 1, "explanation": "答案：低劑量使用可增加腎臟血流量\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「低劑量使用可增加腎臟血流量」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「低劑量使用可增加腎臟血流量」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「初時應以高劑量迅速緩解病人症狀、中劑量使用可使血管收縮血壓上升」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-017", "unit": "單元11 心臟血管系統疾病與護理2", "question": "心臟衰竭病人使用Dopamine 6 μg/Kg/min，給予該劑量Dopamine之最主要目的為何？", "options": ["增加腎臟血流量", "促進周邊血管收縮", "使心肌收縮力增加", "降低腎絲球過濾率"], "answer": 2, "explanation": "答案：使心肌收縮力增加\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「使心肌收縮力增加」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「使心肌收縮力增加」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「增加腎臟血流量、促進周邊血管收縮」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-018", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關毛地黃中毒症狀，下列何者正確？①腹瀉②便祕③噁心嘔吐④黃色視覺⑤紅色視覺⑥心跳變快：", "options": ["①③④", "①⑤⑥", "②③⑤", "②④⑥"], "answer": 0, "explanation": "答案：①③④\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「①③④」；Digoxin 題要連到心尖脈、心搏過慢、血鉀與中毒症狀\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「①③④」之所以是答案，是因為它符合本題核心判斷。給 Digoxin 前需評估心尖脈，若心搏過慢要暫緩並通知醫師；低血鉀會增加毒性風險，噁心、嘔吐、視覺異常與心律不整都是警訊。 其他選項如「①⑤⑥、②③⑤」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：記住 Digoxin：先量心尖脈，再看鉀離子與中毒表現。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-019", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關毛地黃藥物使用注意事項，下列敘述何者正確？", "options": ["有腎臟疾病 者，為毛地黃中毒之高危險病人", "給藥前應測量脈搏1分鐘", "每分鐘脈搏低於60次，應暫停給藥", "心電圖T波升高表示低血鉀，容易造成毛地黃中毒"], "answer": 0, "explanation": "答案：有腎臟疾病 者，為毛地黃中毒之高危險病人\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「有腎臟疾病 者，為毛地黃中毒之高危險病人」；Digoxin 題要連到心尖脈、心搏過慢、血鉀與中毒症狀\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「有腎臟疾病 者，為毛地黃中毒之高危險病人」之所以是答案，是因為它符合本題核心判斷。給 Digoxin 前需評估心尖脈，若心搏過慢要暫緩並通知醫師；低血鉀會增加毒性風險，噁心、嘔吐、視覺異常與心律不整都是警訊。 其他選項如「給藥前應測量脈搏1分鐘、每分鐘脈搏低於60次，應暫停給藥」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：記住 Digoxin：先量心尖脈，再看鉀離子與中毒表現。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-020", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列何者是毛地黃中毒的症狀或徵象？", "options": ["嘴角抽動", "噁心、嘔吐", "心搏過速", "紅色視覺"], "answer": 1, "explanation": "答案：噁心、嘔吐\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「噁心、嘔吐」；Digoxin 題要連到心尖脈、心搏過慢、血鉀與中毒症狀\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「噁心、嘔吐」之所以是答案，是因為它符合本題核心判斷。給 Digoxin 前需評估心尖脈，若心搏過慢要暫緩並通知醫師；低血鉀會增加毒性風險，噁心、嘔吐、視覺異常與心律不整都是警訊。 其他選項如「嘴角抽動、心搏過速」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：記住 Digoxin：先量心尖脈，再看鉀離子與中毒表現。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-021", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關使用主動脈氣球幫浦(intra-aortic balloon pump; IABP)治療時之儀器應用與操作，下列何者正確？", "options": ["主動脈氣球幫浦之導管放置位置為升主動脈", "主動脈氣球在心室舒張、主動脈瓣關閉時充氣", "主動脈氣球充氣時，可以增加下肢靜脈血回流量", "主動脈氣球放氣時，可以增加冠狀動脈之血流量"], "answer": 1, "explanation": "答案：主動脈氣球在心室舒張、主動脈瓣關閉時充氣\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「主動脈氣球在心室舒張、主動脈瓣關閉時充氣」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「主動脈氣球在心室舒張、主動脈瓣關閉時充氣」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「主動脈氣球幫浦之導管放置位置為升主動脈、主動脈氣球充氣時，可以增加下肢靜脈血回流量」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-022", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關葉克膜體外維生系統(ECMO)的使用目的，下列何者最正確？", "options": ["如同人工呼吸器，可以幫助呼吸", "如同體外節律器，治療心律不整", "如同體外心肺循環，執行氣體交換", "如同人工腎臟，排除身體的毒素"], "answer": 2, "explanation": "答案：如同體外心肺循環，執行氣體交換\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「如同體外心肺循環，執行氣體交換」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「如同體外心肺循環，執行氣體交換」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「如同人工呼吸器，可以幫助呼吸、如同體外節律器，治療心律不整」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-023", "unit": "單元11 心臟血管系統疾病與護理2", "question": "使用葉克膜體外維生系統(ECMO)病人的護理措施，下列何者正確？", "options": ["運用ECMO管路給與藥物，以加速藥物進入體內速度", "每隔2小時捏擠ECMO管路，以防止凝血而阻塞管路", "嚴禁病人翻身，以防ECMO管路受到牽扯而導致滑脫", "維持ECMO管路密閉與無菌，以預防細菌感染的發生"], "answer": 3, "explanation": "答案：維持ECMO管路密閉與無菌，以預防細菌感染的發生\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「維持ECMO管路密閉與無菌，以預防細菌感染的發生」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「維持ECMO管路密閉與無菌，以預防細菌感染的發生」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「運用ECMO管路給與藥物，以加速藥物進入體內速度、每隔2小時捏擠ECMO管路，以防止凝血而阻塞管路」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-024", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心內膜炎周邊症狀之敘述，下列何者錯誤？", "options": ["指甲床上會出現裂紋般的出血(Splinter hemorrhage)", "手掌或腳底出現無痛性的紅斑，稱為賈尼威病灶(Janeway’s lesions)", "手指或腳趾出現疼痛性的紅色結節，稱為奧斯勒氏結節(Osler’s nodes)", "四肢末稍出現出血點，稱為羅氏斑(Roth’s spots)"], "answer": 3, "explanation": "答案：四肢末稍出現出血點，稱為羅氏斑(Roth’s spots)\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「四肢末稍出現出血點，稱為羅氏斑(Roth’s spots)」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「四肢末稍出現出血點，稱為羅氏斑(Roth’s spots)」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「指甲床上會出現裂紋般的出血(Splinter hemorrhage)、手掌或腳底出現無痛性的紅斑，稱為賈尼威病灶(Janeway’s lesions)」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-025", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心內膜炎之敘述，下列何者正確？", "options": ["大部分的心內膜炎是由自體免疫反應所致", "使用人工植入物如人工血管、人工節律器等，是引發心內膜炎的原因之一", "心內膜炎依據症狀嚴重程度分為急性與亞急性心內膜炎", "瓣膜異常是造成心內膜炎發生的原因之一"], "answer": 1, "explanation": "答案：使用人工植入物如人工血管、人工節律器等，是引發心內膜炎的原因之一\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「使用人工植入物如人工血管、人工節律器等，是引發心內膜炎的原因之一」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「使用人工植入物如人工血管、人工節律器等，是引發心內膜炎的原因之一」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「大部分的心內膜炎是由自體免疫反應所致、心內膜炎依據症狀嚴重程度分為急性與亞急性心內膜炎」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-026", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關感染性心內膜炎臨床表徵之敘述，下列何者錯誤？", "options": ["發燒型態為回歸熱", "出現心雜音", "常發生腦栓塞", "四肢出現羅氏斑(Roth’s spots)"], "answer": 3, "explanation": "答案：四肢出現羅氏斑(Roth’s spots)\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「四肢出現羅氏斑(Roth’s spots)」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「四肢出現羅氏斑(Roth’s spots)」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「發燒型態為回歸熱、出現心雜音」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-027", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心包膜炎與心包膜積水之護理評估，下列何者不相關？", "options": ["用聽診器之膜面評估心包膜摩擦音", "觀察呼氣時收縮壓之變化", "評讀胸部X光片心臟影像之變化", "評估呼吸型態"], "answer": 1, "explanation": "答案：觀察呼氣時收縮壓之變化\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「觀察呼氣時收縮壓之變化」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「觀察呼氣時收縮壓之變化」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「用聽診器之膜面評估心包膜摩擦音、評讀胸部X光片心臟影像之變化」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-028", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心包膜炎造成心包膜積水之相關症狀，下列何者正確？", "options": ["心輸出量增加", "聽診時心包膜摩擦音會更明顯", "嚴重時會出現頸靜脈怒張", "疼痛位置多為左側背部"], "answer": 2, "explanation": "答案：嚴重時會出現頸靜脈怒張\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「嚴重時會出現頸靜脈怒張」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「嚴重時會出現頸靜脈怒張」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「心輸出量增加、聽診時心包膜摩擦音會更明顯」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-029", "unit": "單元11 心臟血管系統疾病與護理2", "question": "導致心內膜炎最常見的菌種，下列何者正確？", "options": ["克雷伯氏菌", "金黃色葡萄球菌", "β溶血性鏈球菌", "B型流行性嗜血桿菌"], "answer": 1, "explanation": "答案：金黃色葡萄球菌\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「金黃色葡萄球菌」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「金黃色葡萄球菌」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「克雷伯氏菌、β溶血性鏈球菌」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-030", "unit": "單元11 心臟血管系統疾病與護理2", "question": "懷疑病人罹患心內膜炎時，護理師最需要收集的資料，下列何者正 確？", "options": ["是否有心臟病家族史", "有無抽菸", "有無心臟血管手術記錄", "有無體重增加情形"], "answer": 2, "explanation": "答案：有無心臟血管手術記錄\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「有無心臟血管手術記錄」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「有無心臟血管手術記錄」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「是否有心臟病家族史、有無抽菸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-031", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心包膜積水的主要症狀，下列何者錯誤？", "options": ["胸痛、尖銳痛或瀰漫性鈍痛", "脈搏壓升高", "心音模糊及低沉", "頸靜脈怒張"], "answer": 1, "explanation": "答案：脈搏壓升高\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「脈搏壓升高」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「脈搏壓升高」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「胸痛、尖銳痛或瀰漫性鈍痛、心音模糊及低沉」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-032", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關診斷心包膜填塞的貝克氏三病徵(Beck’s triad)，不包括下列何 者？", "options": ["頸靜脈怒張", "心音模糊低沉", "動脈性低血壓", "呼吸速度＞15 次/分"], "answer": 3, "explanation": "答案：呼吸速度＞15 次/分\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「呼吸速度＞15 次/分」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「呼吸速度＞15 次/分」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「頸靜脈怒張、心音模糊低沉」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-033", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心包填塞之臨床表徵，下列何者錯誤？", "options": ["動脈性低血壓", "頸靜脈怒張", "心包膜摩擦音增強", "呼吸困難"], "answer": 2, "explanation": "答案：心包膜摩擦音增強\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「心包膜摩擦音增強」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「心包膜摩擦音增強」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「動脈性低血壓、頸靜脈怒張」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-034", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心包填塞(cardiac tamponade)症狀的敘述，下列何者錯誤？", "options": ["頸靜脈怒張", "心跳變快", "尿量減少", "收縮壓上升"], "answer": 3, "explanation": "答案：收縮壓上升\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「收縮壓上升」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「收縮壓上升」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「頸靜脈怒張、心跳變快」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-035", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心包膜填塞手術治療後之護理措施，下列何者最不需要？", "options": ["觀察生命徵象與心電圖之變化", "補充足夠之體液以增加心輸出量", "若有引流管留置，則需確認引流管之通暢", "採行保護隔離措施"], "answer": 3, "explanation": "答案：採行保護隔離措施\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「採行保護隔離措施」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「採行保護隔離措施」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「觀察生命徵象與心電圖之變化、補充足夠之體液以增加心輸出量」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-036", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關風濕熱與風濕性心臟病之敘述，下列何者錯誤？", "options": ["臨床表徵出現疼痛性的皮下結節，主要分布於骨突處及肌腱", "臨床表徵出現二尖瓣損傷", "可能與自體免疫有關，非細菌性炎症反應", "喉頭培養出A 群β型溶血性鏈球菌"], "answer": 0, "explanation": "答案：臨床表徵出現疼痛性的皮下結節，主要分布於骨突處及肌腱\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「臨床表徵出現疼痛性的皮下結節，主要分布於骨突處及肌腱」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「臨床表徵出現疼痛性的皮下結節，主要分布於骨突處及肌腱」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「臨床表徵出現二尖瓣損傷、可能與自體免疫有關，非細菌性炎症反應」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-037", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關風濕熱之敘述，下列何者正確？①最常侵犯三尖瓣②須使用抗生素治療③應多從事體能活動以強化心臟功能④若有心衰竭症狀須採低鹽飲食：", "options": ["①③", "①④", "②③", "②④"], "answer": 3, "explanation": "答案：②④\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「②④」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「②④」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「①③、①④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-038", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關風濕熱與風濕性心臟病之敘述，下列何者錯誤？", "options": ["好發於65歲以上女性病人", "主要臨床症狀為心肌炎", "最常侵犯二尖瓣", "紅血球沉降速率增加"], "answer": 0, "explanation": "答案：好發於65歲以上女性病人\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「好發於65歲以上女性病人」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「好發於65歲以上女性病人」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「主要臨床症狀為心肌炎、最常侵犯二尖瓣」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-039", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關風濕熱的主要臨床表徵，下列何者錯誤？", "options": ["邊緣性紅斑", "凝血時間延長", "多發性關節炎", "皮下結節"], "answer": 1, "explanation": "答案：凝血時間延長\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「凝血時間延長」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「凝血時間延長」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「邊緣性紅斑、多發性關節炎」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-040", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列何者為非風濕熱感染常見之心臟瓣膜病變？", "options": ["瓣膜閉鎖不全", "僧帽瓣逆流", "主動脈瓣狹窄", "肺動脈瓣硬化"], "answer": 3, "explanation": "答案：肺動脈瓣硬化\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「肺動脈瓣硬化」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「肺動脈瓣硬化」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「瓣膜閉鎖不全、僧帽瓣逆流」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-041", "unit": "單元11 心臟血管系統疾病與護理2", "question": "針對長期口服warfarin(Coumadin)病人，應定期監測下列何項檢驗值？", "options": ["凝血酶原時間(prothrombin time; PT)", "活化部分凝血酶原時間(activated partial thromboplastin time; aPTT)", "部分凝血酶原時間(partial thromboplastin time; PTT)", "活化凝血時間(activated coagu-lation time; ACT)"], "answer": 0, "explanation": "答案：凝血酶原時間(prothrombin time; PT)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「凝血酶原時間(prothrombin time; PT)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「凝血酶原時間(prothrombin time; PT)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「活化部分凝血酶原時間(activated partial thromboplastin time; aPTT)、部分凝血酶原時間(partial thromboplastin time; PTT)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-042", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關僧帽瓣狹窄的臨床表徵，下列何者正確？", "options": ["左心房壓力上升，可能導致左心房擴大", "血液鬱積於左心房造成周邊血壓上升", "容易產生周邊靜脈栓塞", "嚴重僧帽瓣狹窄會導致心收縮期雜音"], "answer": 0, "explanation": "答案：左心房壓力上升，可能導致左心房擴大\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「左心房壓力上升，可能導致左心房擴大」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「左心房壓力上升，可能導致左心房擴大」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「血液鬱積於左心房造成周邊血壓上升、容易產生周邊靜脈栓塞」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-043", "unit": "單元11 心臟血管系統疾病與護理2", "question": "與導致肺部鬱積血液有關的心臟瓣膜病變，下列何者正確？", "options": ["二尖瓣狹窄", "三尖瓣狹窄", "肺動脈瓣逆流", "肺動脈瓣狹窄"], "answer": 0, "explanation": "答案：二尖瓣狹窄\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「二尖瓣狹窄」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「二尖瓣狹窄」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「三尖瓣狹窄、肺動脈瓣逆流」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-044", "unit": "單元11 心臟血管系統疾病與護理2", "question": "主要症狀為腹水、下肢水腫及肝脾腫大之瓣膜性心臟病病人，其最可能的瓣膜問題為下列何者？", "options": ["主動脈瓣狹窄", "二尖瓣狹窄", "三尖瓣閉鎖不全", "二尖瓣閉鎖不全"], "answer": 2, "explanation": "答案：三尖瓣閉鎖不全\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「三尖瓣閉鎖不全」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「三尖瓣閉鎖不全」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「主動脈瓣狹窄、二尖瓣狹窄」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-045", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關抗凝劑Warfarin使用的注意事項，下列何者錯誤？", "options": ["需教導病人觀察異常出血的症狀，如血尿、黑便、鼻出血等", "需觀察顆粒白血球過少引起的發炎症狀，如發燒、喉嚨痛等", "鼓勵服用含有高維生素 K的食品，如青花椰菜、菠菜", "若使用劑量不當造成出血不止，必要時可給予 Phytonadione"], "answer": 2, "explanation": "答案：鼓勵服用含有高維生素 K的食品，如青花椰菜、菠菜\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「鼓勵服用含有高維生素 K的食品，如青花椰菜、菠菜」；Warfarin 題要抓凝血監測與出血安全\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「鼓勵服用含有高維生素 K的食品，如青花椰菜、菠菜」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「需教導病人觀察異常出血的症狀，如血尿、黑便、鼻出血等、需觀察顆粒白血球過少引起的發炎症狀，如發燒、喉嚨痛等」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-046", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關二尖瓣閉鎖不全或逆流所產生之心雜音，在心動周期出現的時間，下列何者正確？", "options": ["舒張全期", "舒張前期", "收縮全期", "收縮末期"], "answer": 2, "explanation": "答案：收縮全期\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「收縮全期」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「收縮全期」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「舒張全期、舒張前期」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-047", "unit": "單元11 心臟血管系統疾病與護理2", "question": "僧帽瓣逆流或狹窄的病人，易出現下列何種症狀？①呼吸困難②下肢水腫③端坐呼吸④咳嗽⑤肝腫大：", "options": ["①②③", "①③④", "②③⑤", "②④⑤"], "answer": 1, "explanation": "答案：①③④\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「①③④」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「①③④」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「①②③、②③⑤」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-048", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心肌病變臨床表徵之敘述，下列何者錯誤？", "options": ["心律不整", "心搏過速", "端坐呼吸", "心輸出量增加"], "answer": 3, "explanation": "答案：心輸出量增加\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「心輸出量增加」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「心輸出量增加」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「心律不整、心搏過速」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-049", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心肌病變(cardiomyopathy)的敘述，下列何者正確？", "options": ["擴張性心肌病變(dilated cardiomyopathy)最常見於心肌炎病人", "肥厚性心肌病變(hypertrophic cardiomyopathy)多數與家族遺傳無關", "心肌病變病人心輸出量增加，不需限制水分攝取", "限制性心肌病變(restricted cardiomyopathy)最為常見"], "answer": 0, "explanation": "答案：擴張性心肌病變(dilated cardiomyopathy)最常見於心肌炎病人\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「擴張性心肌病變(dilated cardiomyopathy)最常見於心肌炎病人」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「擴張性心肌病變(dilated cardiomyopathy)最常見於心肌炎病人」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「肥厚性心肌病變(hypertrophic cardiomyopathy)多數與家族遺傳無關、心肌病變病人心輸出量增加，不需限制水分攝取」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-050", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關左心室肥大評估結果之敘述，下列何者錯誤？", "options": ["觸診心尖搏動減弱", "觸診心尖搏動向左下偏移", "心電圖出現心室早期收縮", "心電圖QRS波變寬"], "answer": 0, "explanation": "答案：觸診心尖搏動減弱\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「觸診心尖搏動減弱」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「觸診心尖搏動減弱」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「觸診心尖搏動向左下偏移、心電圖出現心室早期收縮」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-051", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列何者是心臟移植後最常見的合併症？", "options": ["酸鹼中毒", "排斥與感染", "心臟衰竭", "肺水腫"], "answer": 1, "explanation": "答案：排斥與感染\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「排斥與感染」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「排斥與感染」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「酸鹼中毒、心臟衰竭」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-052", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關利用人工心肺機施行心臟手術，在術後恢復正常血循時，可用魚精蛋白(protamine)中和下列何種藥物的作用？", "options": ["Aspirin", "Cou- madin", "Digoxin", "Heparin"], "answer": 3, "explanation": "答案：Heparin\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「Heparin」；Digoxin 題要連到心尖脈、心搏過慢、血鉀與中毒症狀\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「Heparin」之所以是答案，是因為它符合本題核心判斷。給 Digoxin 前需評估心尖脈，若心搏過慢要暫緩並通知醫師；低血鉀會增加毒性風險，噁心、嘔吐、視覺異常與心律不整都是警訊。 其他選項如「Aspirin、Cou- madin」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：記住 Digoxin：先量心尖脈，再看鉀離子與中毒表現。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-053", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列何者最適合接受機械性人工心瓣膜置換術？", "options": ["出血傾向者", "計畫生育婦女", "50歲的停經婦女", "80歲的女性老人"], "answer": 2, "explanation": "答案：50歲的停經婦女\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「50歲的停經婦女」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「50歲的停經婦女」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「出血傾向者、計畫生育婦女」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-054", "unit": "單元11 心臟血管系統疾病與護理2", "question": "冠狀動脈繞道手術後病人送至加護病房時，下列何種徵象必須立即通知醫師？", "options": ["體溫35℃", "血壓90/60mmHg", "胸管引流量200mL/hr", "SaO2 90～92%"], "answer": 2, "explanation": "答案：胸管引流量200mL/hr\n作答關鍵：題目考優先順序，先處理會威脅生命或造成病情快速惡化的問題。 本題答案指向「胸管引流量200mL/hr」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：優先題要以 ABC、循環穩定、安全風險與急性變化來排序，而不是只選看起來常見的照護。 「胸管引流量200mL/hr」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「體溫35℃、血壓90/60mmHg」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 優先題先問自己：哪一項不先做會最快造成危險"}, {"id": "unit11-055", "unit": "單元11 心臟血管系統疾病與護理2", "question": "一位26歲新婚女性，有計畫懷孕，近日因心臟不適，經醫師診斷二尖瓣狹窄，並建議更換心臟瓣膜，有關瓣膜選擇與抗凝劑使用之敘述，下列何者最適當？", "options": ["宜選用機械性人工瓣膜，並需服用warfarin", "宜選用生物性人工瓣膜，不可服用warfarin", "宜選用機械性人工瓣膜，不可服用warfarin", "宜選用生物性人工瓣膜，並需服用warfarin"], "answer": 1, "explanation": "答案：宜選用生物性人工瓣膜，不可服用warfarin\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「宜選用生物性人工瓣膜，不可服用warfarin」；Warfarin 題要抓凝血監測與出血安全\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「宜選用生物性人工瓣膜，不可服用warfarin」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「宜選用機械性人工瓣膜，並需服用warfarin、宜選用機械性人工瓣膜，不可服用warfarin」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-056", "unit": "單元11 心臟血管系統疾病與護理2", "question": "輸注下列何種藥物時，需以不透光錫箔紙包住點滴瓶及輸液管？", "options": ["Diazoxide (Hyperstat)", "Dobutamine(Dobutrex)", "Nitroglycerin (Tridil)", "Nitroprusside(Nipride)"], "answer": 3, "explanation": "答案：Nitroprusside(Nipride)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「Nitroprusside(Nipride)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「Nitroprusside(Nipride)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「Diazoxide (Hyperstat)、Dobutamine(Dobutrex)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-057", "unit": "單元11 心臟血管系統疾病與護理2", "question": "歲男性，長期高血壓，近日經醫師診斷為主動脈瓣狹窄，醫師建議更換心臟瓣膜，有關瓣膜選擇與抗凝劑使用的敘述，下列何者正確？", "options": ["宜選用機械性人工瓣膜，並需終身服用Warfarin", "宜選用生物性人工瓣膜，不需終身服用Warfarin", "宜選用機械性人工瓣膜，不需終身服用Warfarin", "宜選用生物性人工瓣膜，並需終身服用Warfarin"], "answer": 1, "explanation": "答案：宜選用生物性人工瓣膜，不需終身服用Warfarin\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「宜選用生物性人工瓣膜，不需終身服用Warfarin」；Warfarin 題要抓凝血監測與出血安全\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「宜選用生物性人工瓣膜，不需終身服用Warfarin」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「宜選用機械性人工瓣膜，並需終身服用Warfarin、宜選用機械性人工瓣膜，不需終身服用Warfarin」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit11-058", "unit": "單元11 心臟血管系統疾病與護理2", "question": "病人昨天接受冠狀動脈繞道手術(CABG)，胸管引流量共600mL，今體溫38.7℃，血壓100/60mmHg，SaO2 94%。下列處置何者錯誤？", "options": ["胸管引流量多，應評估凝血功能", "SaO2 94%，應給予O2 cannula 3 L/min", "血壓偏低，應給予輸血", "體溫過高，應給予Aspirin"], "answer": 3, "explanation": "答案：體溫過高，應給予Aspirin\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「體溫過高，應給予Aspirin」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「體溫過高，應給予Aspirin」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「胸管引流量多，應評估凝血功能、SaO2 94%，應給予O2 cannula 3 L/min」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-059", "unit": "單元11 心臟血管系統疾病與護理2", "question": "奇脈(paradoxical pulse)是指下列何種情況？", "options": ["呼氣時，收縮壓下降超過10mmHg", "吸氣時，收縮壓下降超過10mmHg", "呼氣時，舒張壓下降超過10mmHg", "吸氣時，舒張壓下降超過10mmHg"], "answer": 1, "explanation": "答案：吸氣時，收縮壓下降超過10mmHg\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「吸氣時，收縮壓下降超過10mmHg」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「吸氣時，收縮壓下降超過10mmHg」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「呼氣時，收縮壓下降超過10mmHg、呼氣時，舒張壓下降超過10mmHg」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-060", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關生物性心瓣膜特性的敘述，下列何者錯誤？", "options": ["術後須終身服用抗凝血藥物", "耐用性較差", "適合有生育計畫的婦女使用", "瓣膜開關時的聲音較小"], "answer": 0, "explanation": "答案：術後須終身服用抗凝血藥物\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「術後須終身服用抗凝血藥物」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「術後須終身服用抗凝血藥物」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「耐用性較差、適合有生育計畫的婦女使用」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-061", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關二尖瓣狹窄之血液動力學檢查結果，下列何者錯誤？", "options": ["中心靜脈壓上升", "右心室壓力上升", "肺微血管楔壓(PCWP)上升", "心輸出量上升"], "answer": 3, "explanation": "答案：心輸出量上升\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「心輸出量上升」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「心輸出量上升」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「中心靜脈壓上升、右心室壓力上升」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit11-062", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心肌炎病人的護理指導，下列何者不適宜？", "options": ["教導阻力運動，提升活動耐力", "教導服用類固醇藥物，需觀察大便顏色", "教導減少水分攝取，減少心臟前負荷", "教導服用毛地黃，需監測脈搏"], "answer": 0, "explanation": "答案：教導阻力運動，提升活動耐力\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「教導阻力運動，提升活動耐力」；Digoxin 題要連到心尖脈、心搏過慢、血鉀與中毒症狀\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「教導阻力運動，提升活動耐力」之所以是答案，是因為它符合本題核心判斷。給 Digoxin 前需評估心尖脈，若心搏過慢要暫緩並通知醫師；低血鉀會增加毒性風險，噁心、嘔吐、視覺異常與心律不整都是警訊。 其他選項如「教導服用類固醇藥物，需觀察大便顏色、教導減少水分攝取，減少心臟前負荷」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：記住 Digoxin：先量心尖脈，再看鉀離子與中毒表現。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit11-063", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關冠狀動脈繞道手術後護理，下列敘述何者錯誤？", "options": ["當小便量減少時，須監測血中鉀離子濃度", "當縱膈腔引流管(P-R tube)引流量＞100 mL/hr，須監測凝血功能", "監測心律並注意傷口是否出血", "當凝血酶原時間(PT)延長時，須注射Protamine Sulfate"], "answer": 3, "explanation": "答案：當凝血酶原時間(PT)延長時，須注射Protamine Sulfate\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「當凝血酶原時間(PT)延長時，須注射Protamine Sulfate」；Warfarin 題要抓凝血監測與出血安全\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「當凝血酶原時間(PT)延長時，須注射Protamine Sulfate」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「當小便量減少時，須監測血中鉀離子濃度、當縱膈腔引流管(P-R tube)引流量＞100 mL/hr，須監測凝血功能」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-001", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關高血壓病人之日常生活護理指導，下列何者正確？", "options": ["為增加血中高密度脂蛋白，應養成規律運動的好習慣", "為減少酒精之攝取，應酬時建議以茶代酒", "為紓解壓力、放鬆肌肉，建議泡溫泉或泡熱水澡", "為避免引起伐氏(valsava)效應，建議運動以等長運動較佳"], "answer": 0, "explanation": "答案：為增加血中高密度脂蛋白，應養成規律運動的好習慣\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「為增加血中高密度脂蛋白，應養成規律運動的好習慣」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「為增加血中高密度脂蛋白，應養成規律運動的好習慣」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「為減少酒精之攝取，應酬時建議以茶代酒、為紓解壓力、放鬆肌肉，建議泡溫泉或泡熱水澡」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-002", "unit": "單元12 心臟血管系統疾病與護理3", "question": "楊先生50歲，患有高血壓超過10年，目前被診斷有慢性腎疾病，為減緩腎功能衰退，應指導其血壓控制在下列何種範圍？", "options": ["130/85mmHg以下", "140～145/85～90mmHg", "145～150/90～95 mmHg", "視病人情況而定"], "answer": 0, "explanation": "答案：130/85mmHg以下\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「130/85mmHg以下」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「130/85mmHg以下」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「140～145/85～90mmHg、145～150/90～95 mmHg」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-003", "unit": "單元12 心臟血管系統疾病與護理3", "question": "王先生55歲，有高血壓家族史，因工作關係經常應酬飲酒，沒有其他慢性疾病。此次因頭痛、血壓164/100mmHg至醫院就醫，經診斷為高血壓，目前服用propranolol(Inderal)及spironolactone(Aldacton)。下列敘述何者錯誤？", "options": ["王先生因有高血壓家族史，故推測其高血壓應為續發性高血壓", "王先生因經常應酬，故推論其高血壓可能是鈉及酒精攝取量過多導致", "王先生之高血壓可能演變為惡性高血壓，會造成心臟後負荷增加", "王先生之高血壓的治療目標應為維持血壓於140/90mmHg以下"], "answer": 0, "explanation": "答案：王先生因有高血壓家族史，故推測其高血壓應為續發性高血壓\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「王先生因有高血壓家族史，故推測其高血壓應為續發性高血壓」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「王先生因有高血壓家族史，故推測其高血壓應為續發性高血壓」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「王先生因經常應酬，故推論其高血壓可能是鈉及酒精攝取量過多導致、王先生之高血壓可能演變為惡性高血壓，會造成心臟後負荷增加」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-004", "unit": "單元12 心臟血管系統疾病與護理3", "question": "承上題，有關王先生的護理指導，下列何者錯誤？", "options": ["服用降血壓藥物需定時定量，以防反彈性高血壓", "每日固定時間測量血壓，並記錄血壓值", "可能會有心跳速率降低的情形，需教導測量脈搏", "需定期監測鉀離子濃度，並多攝取香蕉、柳橙、楊桃等"], "answer": 3, "explanation": "答案：需定期監測鉀離子濃度，並多攝取香蕉、柳橙、楊桃等\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「需定期監測鉀離子濃度，並多攝取香蕉、柳橙、楊桃等」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「需定期監測鉀離子濃度，並多攝取香蕉、柳橙、楊桃等」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「服用降血壓藥物需定時定量，以防反彈性高血壓、每日固定時間測量血壓，並記錄血壓值」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-005", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關低鈉飲食的護理指導，下列何者錯誤？", "options": ["烹調方式多選擇清蒸、水煮取代滷製的方式", "選擇天然辛香料取代鹽、醬油、沙茶醬等調味", "避免攝食罐頭或加工醃漬食物", "味素與小蘇打不含鈉，不需限制攝取量"], "answer": 3, "explanation": "答案：味素與小蘇打不含鈉，不需限制攝取量\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「味素與小蘇打不含鈉，不需限制攝取量」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「味素與小蘇打不含鈉，不需限制攝取量」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「烹調方式多選擇清蒸、水煮取代滷製的方式、選擇天然辛香料取代鹽、醬油、沙茶醬等調味」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-006", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關血管產生動脈粥狀硬化(atherosclerosis)的病理機轉，下列敘述何者錯誤？", "options": ["血管內皮細胞損傷", "血小板凝集增加、血塊凝集", "交感神經受刺激分泌兒茶酚胺", "周邊血管擴張心肌供氧增加"], "answer": 3, "explanation": "答案：周邊血管擴張心肌供氧增加\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「周邊血管擴張心肌供氧增加」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「周邊血管擴張心肌供氧增加」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「血管內皮細胞損傷、血小板凝集增加、血塊凝集」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-007", "unit": "單元12 心臟血管系統疾病與護理3", "question": "下列何者為可抑制血管加壓素I轉換成血管加壓素II之抗高血壓藥物？", "options": ["digoxin(Lanoxin)", "captopril(Capoten)", "nifedipine(Adalate)", "propranolol(Inderal)"], "answer": 1, "explanation": "答案：captopril(Capoten)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「captopril(Capoten)」；Digoxin 題要連到心尖脈、心搏過慢、血鉀與中毒症狀\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「captopril(Capoten)」之所以是答案，是因為它符合本題核心判斷。給 Digoxin 前需評估心尖脈，若心搏過慢要暫緩並通知醫師；低血鉀會增加毒性風險，噁心、嘔吐、視覺異常與心律不整都是警訊。 其他選項如「digoxin(Lanoxin)、nifedipine(Adalate)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：記住 Digoxin：先量心尖脈，再看鉀離子與中毒表現。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-008", "unit": "單元12 心臟血管系統疾病與護理3", "question": "高血壓病人服用下列何種藥物時，宜多攝取高鉀食物？", "options": ["血管擴張劑", "calcium阻斷劑", "thiazide類利尿劑", "aldactone"], "answer": 2, "explanation": "答案：thiazide類利尿劑\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「thiazide類利尿劑」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「thiazide類利尿劑」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「血管擴張劑、calcium阻斷劑」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-009", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關ACE inhibitors的藥物作用，下列何者錯誤？", "options": ["促進血管舒張", "降低後負荷", "增加前負荷", "減少留鹽激素分泌"], "answer": 2, "explanation": "答案：增加前負荷\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「增加前負荷」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「增加前負荷」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「促進血管舒張、降低後負荷」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-010", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關治療高血壓藥物血管升壓素轉換酶抑制劑(ACEI)的主要作用，下列何者正確？", "options": ["抑制腎素轉換為血管收縮素I", "抑制血管收縮素I轉換為血管收縮素II", "抑制血管收縮素II轉換為血管收縮素III", "抑制血管收縮素III轉換為腎素"], "answer": 1, "explanation": "答案：抑制血管收縮素I轉換為血管收縮素II\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「抑制血管收縮素I轉換為血管收縮素II」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「抑制血管收縮素I轉換為血管收縮素II」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「抑制腎素轉換為血管收縮素I、抑制血管收縮素II轉換為血管收縮素III」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-011", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關高血壓病人的護理指導，下列何者最不適當？", "options": ["維持身體質量指數(body mass index; BMI)於正常範圍", "飲食中攝取適當的鉀、鈣、鎂離子", "每日酒精攝取量少於120 mL", "持續且規律的有氧運動"], "answer": 2, "explanation": "答案：每日酒精攝取量少於120 mL\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「每日酒精攝取量少於120 mL」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「每日酒精攝取量少於120 mL」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「維持身體質量指數(body mass index; BMI)於正常範圍、飲食中攝取適當的鉀、鈣、鎂離子」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit12-012", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關高血壓病人的飲食原則，下列何者不適當？", "options": ["鼓勵高鈣與高鈉飲食", "鼓勵攝取高纖飲食", "避免含咖啡因飲料", "避免高油炸食物"], "answer": 0, "explanation": "答案：鼓勵高鈣與高鈉飲食\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「鼓勵高鈣與高鈉飲食」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「鼓勵高鈣與高鈉飲食」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「鼓勵攝取高纖飲食、避免含咖啡因飲料」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit12-013", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關高血壓病人服用Propranolol(Inderal)的護理指導，下列何者正確？①需確認病人有無氣喘②服藥前宜先檢查心跳次數③副作用有低血鈉④副作用會造成脫水：", "options": ["①②", "①③", "②③", "②④"], "answer": 0, "explanation": "答案：①②\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「①②」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「①②」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「①③、②③」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-014", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關使用Spironolactone(Aldactone)藥物指導之敘述，下列何者正確？①須注意鉀離子濃度②須注意鎂離子濃度③鼓勵多食用柑橘類食物④不宜食用芭樂：", "options": ["①③", "①④", "②③", "②④"], "answer": 1, "explanation": "答案：①④\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「①④」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「①④」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「①③、②③」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit12-015", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關雷諾氏疾病(Raynaud’s disease)的健康指導，下列何者正確？", "options": ["減輕壓力，以避免動脈收縮", "穿戴帽子，以減少日光直射", "避免暴露於炎熱的環境", "服用β阻斷劑時，宜防高血壓發生"], "answer": 0, "explanation": "答案：減輕壓力，以避免動脈收縮\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「減輕壓力，以避免動脈收縮」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「減輕壓力，以避免動脈收縮」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「穿戴帽子，以減少日光直射、避免暴露於炎熱的環境」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-016", "unit": "單元12 心臟血管系統疾病與護理3", "question": "關於雷諾氏病的敘述，下列何者錯誤？", "options": ["該疾病好發於年輕女性", "好發於近心端肢體", "容易因為冷的環境或壓力誘發", "患側肢體先變白，再轉為發紺"], "answer": 1, "explanation": "答案：好發於近心端肢體\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「好發於近心端肢體」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「好發於近心端肢體」之所以是答案，是因為它符合本題核心判斷。本題要從題
