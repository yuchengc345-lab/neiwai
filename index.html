考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「FEV1/FVC」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「FEV1/FVC」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「DLCO(一氧化碳擴散容量)、FEV25～75%」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-032", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性肺疾病病人出現早期呼吸衰竭之徵象，下列何者正確？", "options": ["低血壓及呼吸有哮鳴音", "呼吸困難及心跳過慢", "焦躁不安及意識混亂", "皮膚發紺且溫暖"], "answer": 2, "explanation": "答案：焦躁不安及意識混亂\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「焦躁不安及意識混亂」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「焦躁不安及意識混亂」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「低血壓及呼吸有哮鳴音、呼吸困難及心跳過慢」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-033", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性阻塞性肺疾病(COPD)病人之氧氣療法，下列何者正確？", "options": ["給予高濃度的氧氣", "維持PaO2≧95mmHg", "維持SaO2≧90%", "每分鐘給予5～流速之氧氣"], "answer": 2, "explanation": "答案：維持SaO2≧90%\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「維持SaO2≧90%」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「維持SaO2≧90%」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「給予高濃度的氧氣、維持PaO2≧95mmHg」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-034", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性阻塞性肺疾病(COPD)病人的護理照護計畫，下列何者應列為最優先處理？", "options": ["自我照顧能力缺失", "呼吸道清除功能失效", "活動無耐力", "調適障礙"], "answer": 1, "explanation": "答案：呼吸道清除功能失效\n作答關鍵：題目考優先順序，先處理會威脅生命或造成病情快速惡化的問題。 本題答案指向「呼吸道清除功能失效」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：優先題要以 ABC、循環穩定、安全風險與急性變化來排序，而不是只選看起來常見的照護。 「呼吸道清除功能失效」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「自我照顧能力缺失、活動無耐力」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 優先題先問自己：哪一項不先做會最快造成危險"}, {"id": "unit8-035", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性阻塞性肺疾病(COPD)病人飲食指導之敘述，下列何者較適當？①進食時可將氧氣面罩更換為氧氣套管②選擇易咀嚼食物③增加碳水化合物④減少水分的攝取：", "options": ["①②", "①③", "②④", "③④"], "answer": 0, "explanation": "答案：①②\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「①②」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「①②」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「①③、②④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-036", "unit": "單元8 呼吸系統疾病與護理2", "question": "慢性阻塞性肺疾病病人採用噘嘴呼吸的主要目的為下列何者？", "options": ["可鬆動並促進呼吸道痰液的咳出", "可增加吸氣，改善肺部氧合", "可預防呼吸道塌陷，促進吐氣", "可降低潮氣容積，增加病人對呼吸的自我控制感"], "answer": 2, "explanation": "答案：可預防呼吸道塌陷，促進吐氣\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「可預防呼吸道塌陷，促進吐氣」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「可預防呼吸道塌陷，促進吐氣」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「可鬆動並促進呼吸道痰液的咳出、可增加吸氣，改善肺部氧合」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-037", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者不是肺氣腫病人的身體評估結果？", "options": ["聽診發現呼吸音減弱", "視診可發現胸廓前後徑增加似桶狀胸", "叩診出現濁音", "觸診出現觸覺震顫減弱"], "answer": 2, "explanation": "答案：叩診出現濁音\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「叩診出現濁音」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「叩診出現濁音」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「聽診發現呼吸音減弱、視診可發現胸廓前後徑增加似桶狀胸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-038", "unit": "單元8 呼吸系統疾病與護理2", "question": "慢性阻塞性肺部疾病病人最早出現的肺功能變化為下列何者？", "options": ["用力呼氣時間延長", "肺活量降低", "肺餘容積上升", "用力呼氣第一秒容積下降"], "answer": 3, "explanation": "答案：用力呼氣第一秒容積下降\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「用力呼氣第一秒容積下降」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「用力呼氣第一秒容積下降」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「用力呼氣時間延長、肺活量降低」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-039", "unit": "單元8 呼吸系統疾病與護理2", "question": "慢性阻塞性肺疾病病人居家使用氧氣之護理指導，下列何者正確？", "options": ["有助降低肺血管阻力", "僅適用於末期病人", "可能引起氧氣依賴", "避免於夜間用氧"], "answer": 0, "explanation": "答案：有助降低肺血管阻力\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「有助降低肺血管阻力」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「有助降低肺血管阻力」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「僅適用於末期病人、可能引起氧氣依賴」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-040", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性阻塞性肺部疾病病人發生呼吸困難之護理措施，下列何者正確？①可以使用凡德里面罩(Venturi’s mask)給氧②可以使用鼻導管給氧③給與40%濃度的氧氣④維持平躺以促進舒適", "options": ["①②", "①③", "②④", "③④"], "answer": 0, "explanation": "答案：①②\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「①②」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「①②」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「①③、②④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-041", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者是肺氣腫造成氧氣供應減少的主要原因？", "options": ["呼吸肌麻痺", "肋膜積水", "氣體交換面積減少", "呼吸道阻塞"], "answer": 2, "explanation": "答案：氣體交換面積減少\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「氣體交換面積減少」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「氣體交換面積減少」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「呼吸肌麻痺、肋膜積水」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-042", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者最容易造成α1-抗胰蛋白酶(α1-antitrypsin)缺乏？", "options": ["慢性支氣管炎", "肺氣腫", "氣喘", "支氣管擴張症"], "answer": 1, "explanation": "答案：肺氣腫\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「肺氣腫」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「肺氣腫」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「慢性支氣管炎、氣喘」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-043", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者最不可能出現在肺氣腫病人的肺功能檢查結果？", "options": ["肺總量(TLC)增加", "第一秒鐘用力吐氣容積(FEV1)降低", "第一秒鐘用力吐氣容積與用力肺活量之比值(FEV1/FVC)大於80%", "肺餘容積(RV)增加"], "answer": 2, "explanation": "答案：第一秒鐘用力吐氣容積與用力肺活量之比值(FEV1/FVC)大於80%\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「第一秒鐘用力吐氣容積與用力肺活量之比值(FEV1/FVC)大於80%」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「第一秒鐘用力吐氣容積與用力肺活量之比值(FEV1/FVC)大於80%」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「肺總量(TLC)增加、第一秒鐘用力吐氣容積(FEV1)降低」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit8-044", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關肺氣腫之敘述，下列何者錯誤？", "options": ["換氣灌流比值會減少", "會造成氣體交換障礙", "會出現呼氣期時間延長", "會出現桶狀胸"], "answer": 0, "explanation": "答案：換氣灌流比值會減少\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「換氣灌流比值會減少」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「換氣灌流比值會減少」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「會造成氣體交換障礙、會出現呼氣期時間延長」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit8-045", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者是評估慢性支氣管炎病人通氣有效性的最佳指標？", "options": ["PaCO2", "PaO2", "SaO2", "pH"], "answer": 0, "explanation": "答案：PaCO2\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「PaCO2」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「PaCO2」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「PaO2、SaO2」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-046", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性支氣管炎的病理變化，下列何者錯誤？", "options": ["杯狀細胞數目增加", "纖毛上皮細胞數目減少", "肺的回縮力量降低", "缺氧導致右心衰竭"], "answer": 2, "explanation": "答案：肺的回縮力量降低\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「肺的回縮力量降低」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「肺的回縮力量降低」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「杯狀細胞數目增加、纖毛上皮細胞數目減少」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit8-047", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性支氣管炎病人出院護理指導的敘述，下列何者正確？", "options": ["限制水分的攝取量", "增加醣類的攝取量", "戒菸或避免二手菸", "避免注射流感疫苗"], "answer": 2, "explanation": "答案：戒菸或避免二手菸\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「戒菸或避免二手菸」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「戒菸或避免二手菸」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「限制水分的攝取量、增加醣類的攝取量」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-048", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性阻塞性肺部疾病病人的飲食指導，下列何者錯誤？", "options": ["少量多餐", "攝取適量的鈣、鉀離子", "增加碳水化合物飲食", "製作成易咀嚼的食物"], "answer": 2, "explanation": "答案：增加碳水化合物飲食\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「增加碳水化合物飲食」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「增加碳水化合物飲食」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「少量多餐、攝取適量的鈣、鉀離子」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit8-049", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關維持慢性阻塞性肺部疾病病人的氧合狀態，下列敘述何者正確？", "options": ["PaO2為80～100mmHg", "PaO2為50～65mmHg", "SaO2為100%", "SaO2為60%"], "answer": 1, "explanation": "答案：PaO2為50～65mmHg\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「PaO2為50～65mmHg」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「PaO2為50～65mmHg」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「PaO2為80～100mmHg、SaO2為100%」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-050", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性阻塞性肺部疾病病人使用Aminophylline治療時之敘述，下列何者正確？①主要作用為支氣管擴張②副作用為心律不整和高血壓③靜脈注射速度不可超過20～25mg/min④血清治療濃度應維持在20～40μg/mL 之間", "options": ["①②", "①③", "②④", "③④"], "answer": 1, "explanation": "答案：①③\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「①③」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「①③」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「①②、②④」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit8-051", "unit": "單元8 呼吸系統疾病與護理2", "question": "教導慢性阻塞性肺疾病病人採用橫膈式呼吸之預期效果，下列何者正確？", "options": ["減少潮氣容積", "減少肺泡通氣", "增加呼吸速率", "增加活動耐力"], "answer": 3, "explanation": "答案：增加活動耐力\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「增加活動耐力」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「增加活動耐力」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「減少潮氣容積、減少肺泡通氣」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-052", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性阻塞性肺疾病(COPD)的病人使用噘嘴式呼吸的目的，下列何者正確？", "options": ["減少二氧化碳滯留在肺部", "促進痰液排除", "降低呼吸道的壓力", "增加橫膈的肌肉力量"], "answer": 0, "explanation": "答案：減少二氧化碳滯留在肺部\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「減少二氧化碳滯留在肺部」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「減少二氧化碳滯留在肺部」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「促進痰液排除、降低呼吸道的壓力」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-053", "unit": "單元8 呼吸系統疾病與護理2", "question": "葉先生為COPD病人，醫囑為：fenoterol(Berotec) 2 puffs INHA BID，下列何者表示其使用正確？", "options": ["使用前不應搖晃瓶身", "連續按壓兩次噴霧劑然後吸入藥物", "吸藥後閉氣10秒鐘再緩慢吐氣", "使用完後應立即漱口"], "answer": 2, "explanation": "答案：吸藥後閉氣10秒鐘再緩慢吐氣\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「吸藥後閉氣10秒鐘再緩慢吐氣」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「吸藥後閉氣10秒鐘再緩慢吐氣」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「使用前不應搖晃瓶身、連續按壓兩次噴霧劑然後吸入藥物」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-054", "unit": "單元8 呼吸系統疾病與護理2", "question": "有氣喘病史的高血壓病人應避免使用下列何類藥物，以預防病人支氣管痙攣導致氣喘發作？", "options": ["亨利氏環利尿劑", "α型阻斷劑", "β型阻斷劑", "鈣離子拮抗劑"], "answer": 2, "explanation": "答案：β型阻斷劑\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「β型阻斷劑」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「β型阻斷劑」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「亨利氏環利尿劑、α型阻斷劑」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-055", "unit": "單元8 呼吸系統疾病與護理2", "question": "氣喘病人肺功能檢查前之護理，下列何者正確？", "options": ["檢查前禁食4小時", "檢查前2小時口服類固醇", "檢查前6小時不要使用支氣管擴張劑", "檢查前使用鎮靜劑"], "answer": 2, "explanation": "答案：檢查前6小時不要使用支氣管擴張劑\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「檢查前6小時不要使用支氣管擴張劑」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「檢查前6小時不要使用支氣管擴張劑」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「檢查前禁食4小時、檢查前2小時口服類固醇」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-056", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者為氣喘病人使用尖峰吐氣流速計(peak flow meter)的目的？", "options": ["訓練呼吸肌", "促進痰液排除", "測量肺活量", "評估氣流阻塞程度"], "answer": 3, "explanation": "答案：評估氣流阻塞程度\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「評估氣流阻塞程度」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「評估氣流阻塞程度」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「訓練呼吸肌、促進痰液排除」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-057", "unit": "單元8 呼吸系統疾病與護理2", "question": "病人使用尖峰吐氣流速計(peak flow meter)以監測氣喘控制之護理指導，下列何者正確？", "options": ["開始測量時，將流量計的吹口置於雙唇和前排牙齒的中間", "深吸氣，然後經由流量計的吹口用力吐氣", "吐氣時，移動身體由直立到向前彎的姿勢", "於每次服藥前測量以決定是否用藥"], "answer": 1, "explanation": "答案：深吸氣，然後經由流量計的吹口用力吐氣\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「深吸氣，然後經由流量計的吹口用力吐氣」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「深吸氣，然後經由流量計的吹口用力吐氣」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「開始測量時，將流量計的吹口置於雙唇和前排牙齒的中間、吐氣時，移動身體由直立到向前彎的姿勢」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-058", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者為氣喘病人最典型的呼吸音？", "options": ["哮吼(stridor)", "喘鳴(wheeze)", "濕囉音(rales)", "鼾音(rhonchi)"], "answer": 1, "explanation": "答案：喘鳴(wheeze)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「喘鳴(wheeze)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「喘鳴(wheeze)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「哮吼(stridor)、濕囉音(rales)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-059", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關氣喘病人尖峰呼氣流速(peak expiratory flow rate; PEFR)的護理指導，下列何者正確？", "options": ["氣喘治療期間所測得的PEFR值達最佳預期值，即可減少藥量", "取2次吹氣數值之平均值記錄於氣喘日誌內", "若PEFR＜60%表示氣喘屬於紅燈區，須立即就醫", "PEFR值與病人之身高及年齡有關，與性別無關"], "answer": 2, "explanation": "答案：若PEFR＜60%表示氣喘屬於紅燈區，須立即就醫\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「若PEFR＜60%表示氣喘屬於紅燈區，須立即就醫」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「若PEFR＜60%表示氣喘屬於紅燈區，須立即就醫」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「氣喘治療期間所測得的PEFR值達最佳預期值，即可減少藥量、取2次吹氣數值之平均值記錄於氣喘日誌內」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-060", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關氣喘病人常用藥物作用之敘述，下列何者錯誤？", "options": ["使用吸入型乙二型交感神經興奮劑緩解支氣管痙攣", "使用類固醇抑制呼吸道黏膜炎症反應", "使用吸入型巨細胞抑制劑減輕呼吸道炎症程度", "使用抗生素治療病毒感染"], "answer": 3, "explanation": "答案：使用抗生素治療病毒感染\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「使用抗生素治療病毒感染」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「使用抗生素治療病毒感染」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「使用吸入型乙二型交感神經興奮劑緩解支氣管痙攣、使用類固醇抑制呼吸道黏膜炎症反應」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit8-061", "unit": "單元8 呼吸系統疾病與護理2", "question": "李先生為氣喘病人，目前使用Aminophylline靜脈輸注溶液，護理師得知李先生血清中的Theophylline濃度為12μg/mL，此時最適當的護理措施為何？", "options": ["立即告知主治醫師檢驗報告的數值", "繼續使用Aminophylline輸注溶液", "將輸注溶液更換為不含Aminophylline的點滴溶液", "聯絡檢驗部門確認數值是否有誤"], "answer": 1, "explanation": "答案：繼續使用Aminophylline輸注溶液\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「繼續使用Aminophylline輸注溶液」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「繼續使用Aminophylline輸注溶液」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「立即告知主治醫師檢驗報告的數值、將輸注溶液更換為不含Aminophylline的點滴溶液」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-062", "unit": "單元8 呼吸系統疾病與護理2", "question": "氣喘病人使用下列何種定量吸入劑後要漱口？", "options": ["Aminophylline", "Pulmicort(budesonide)", "Atrovent(ipratropium)", "Intal(cromolyn sodium)"], "answer": 1, "explanation": "答案：Pulmicort(budesonide)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「Pulmicort(budesonide)」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「Pulmicort(budesonide)」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「Aminophylline、Atrovent(ipratropium)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-063", "unit": "單元8 呼吸系統疾病與護理2", "question": "關以定量吸入器(MDI)方式給藥的敘述，下列何者錯誤？", "options": ["全身副作用較小", "使用後需要漱口", "使用時需快速深吸氣", "吸完藥物後要閉氣約5～10 秒"], "answer": 2, "explanation": "答案：使用時需快速深吸氣\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「使用時需快速深吸氣」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「使用時需快速深吸氣」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「全身副作用較小、使用後需要漱口」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit8-064", "unit": "單元8 呼吸系統疾病與護理2", "question": "氣喘病人使用尖峰吐氣流量器(peak flow meter)的護理指導，下列何者正確？", "options": ["可以反應氣道狹窄的程度", "尖峰吐氣流量落於紅色區段時，應增加長效型的支氣管擴張劑", "每一次測量連續作3次，取其最低的數據作為記錄", "測量時應先將氣吐盡，然後經由含口器大量吸氣"], "answer": 0, "explanation": "答案：可以反應氣道狹窄的程度\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「可以反應氣道狹窄的程度」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「可以反應氣道狹窄的程度」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「尖峰吐氣流量落於紅色區段時，應增加長效型的支氣管擴張劑、每一次測量連續作3次，取其最低的數據作為記錄」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-065", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列氣喘病人自我照顧之敘述，何者顯示其有正確的認知？", "options": ["當我一感到呼吸不順，就會立即使用類固醇吸入劑", "我只有在與醫師溝通後，才會調整我家中使用的氧氣濃度", "如果我每天夜裡僅出現一次呼吸困難，那就表示我的藥物已發生效用", "如果我的尖峰吐氣流速維持在預期值80%以上，就不需做藥物的調整"], "answer": 3, "explanation": "答案：如果我的尖峰吐氣流速維持在預期值80%以上，就不需做藥物的調整\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「如果我的尖峰吐氣流速維持在預期值80%以上，就不需做藥物的調整」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「如果我的尖峰吐氣流速維持在預期值80%以上，就不需做藥物的調整」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「當我一感到呼吸不順，就會立即使用類固醇吸入劑、我只有在與醫師溝通後，才會調整我家中使用的氧氣濃度」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-066", "unit": "單元8 呼吸系統疾病與護理2", "question": "陳女士是氣喘病人，過去四週內發生：日間出現氣喘症狀每週一次、因氣喘在夜間醒來兩次、日常活動未因氣喘受影響、需要使用藥物緩解症狀每週超過兩次。依照GINA(Global Initiative for Asthma, 2019)對氣喘控制程度，其屬於下列何者？", "options": ["控制良好", "部分控制", "控制不佳", "控制很差"], "answer": 1, "explanation": "答案：部分控制\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「部分控制」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「部分控制」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「控制良好、控制不佳」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-067", "unit": "單元8 呼吸系統疾病與護理2", "question": "當病人出現大量化膿性濃稠痰液，且將痰液靜置於杯子內，會分成上層泡沫、中層清澈、下層濃稠，下列何者為其最可能之診斷？", "options": ["肺炎", "肺癌", "支氣管擴張症", "慢性支氣管炎"], "answer": 2, "explanation": "答案：支氣管擴張症\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「支氣管擴張症」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「支氣管擴張症」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「肺炎、肺癌」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-068", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者為支氣管擴張症最主要的病因？", "options": ["細菌感染", "過敏反應", "遺傳", "老化"], "answer": 0, "explanation": "答案：細菌感染\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「細菌感染」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「細菌感染」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「過敏反應、遺傳」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-069", "unit": "單元8 呼吸系統疾病與護理2", "question": "當支氣管擴張症病人出現下列何種狀況需盡速就醫？", "options": ["天氣炎熱痰液變得較黏稠", "痰液明顯出現血絲或血塊", "進食大餐後呼吸變得較喘", "痰液出現分層現象"], "answer": 1, "explanation": "答案：痰液明顯出現血絲或血塊\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「痰液明顯出現血絲或血塊」；肺炎題要抓感染、痰液清除與氧合\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「痰液明顯出現血絲或血塊」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「天氣炎熱痰液變得較黏稠、進食大餐後呼吸變得較喘」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-070", "unit": "單元8 呼吸系統疾病與護理2", "question": "周先生為氣喘病人，使用藥物後，出現「心悸、心律不整」的反應，最可能導致此反應的藥物為下列何者？", "options": ["fenoterol (Berotec®)", "ipratropium bromide (Atrovent®)", "budesonide (Duasma®)", "montelukast (Singular®)"], "answer": 0, "explanation": "答案：fenoterol (Berotec®)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「fenoterol (Berotec®)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「fenoterol (Berotec®)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「ipratropium bromide (Atrovent®)、budesonide (Duasma®)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-001", "unit": "單元9 呼吸系統疾病與護理3", "question": "下列何者是誘發病人發生急性呼吸窘迫症候群(ARDS)最常見的危險因子？", "options": ["敗血性休克", "慢性阻塞性肺疾病", "氣喘", "心衰竭"], "answer": 0, "explanation": "答案：敗血性休克\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「敗血性休克」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「敗血性休克」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「慢性阻塞性肺疾病、氣喘」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-002", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關急性呼吸窘迫症候群(ARDS)病人使用機械性通氣時，配合使用呼氣末端正壓(PEEP)之目的，下列何者錯誤？", "options": ["減少分流程度", "減少肺泡塌陷", "改善血管的通透性", "改善氧合狀態"], "answer": 2, "explanation": "答案：改善血管的通透性\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「改善血管的通透性」；ARDS 題要抓頑固性低血氧與肺泡塌陷\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「改善血管的通透性」之所以是答案，是因為它符合本題核心判斷。ARDS 常見嚴重低血氧、瀰漫性肺泡損傷與肺順應性下降；治療照護常涉及氧合支持、PEEP、俯臥位與密切監測呼吸循環。 其他選項如「減少分流程度、減少肺泡塌陷」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：ARDS 的關鍵字是「氧氣給了仍低氧」與需要進階呼吸支持。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-003", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關急性呼吸窘迫症候群(ARDS)的診斷標準，下列何者正確？", "options": ["慢性發作", "氧合指數(PaO2/FIO2)＞200mmHg", "胸部X光呈現單側肺浸潤", "肺微血管楔壓≦18mmHg"], "answer": 3, "explanation": "答案：肺微血管楔壓≦18mmHg\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「肺微血管楔壓≦18mmHg」；ARDS 題要抓頑固性低血氧與肺泡塌陷\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「肺微血管楔壓≦18mmHg」之所以是答案，是因為它符合本題核心判斷。ARDS 常見嚴重低血氧、瀰漫性肺泡損傷與肺順應性下降；治療照護常涉及氧合支持、PEEP、俯臥位與密切監測呼吸循環。 其他選項如「慢性發作、氧合指數(PaO2/FIO2)＞200mmHg」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：ARDS 的關鍵字是「氧氣給了仍低氧」與需要進階呼吸支持。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-004", "unit": "單元9 呼吸系統疾病與護理3", "question": "王先生溺水送醫，診斷為急性呼吸窘迫症候群(ARDS)，入院後使用呼吸器治療，下列何種呼吸器最適宜？", "options": ["負壓型呼吸器", "壓力週期型呼吸器", "時間週期型呼吸器", "容積週期型呼吸器"], "answer": 3, "explanation": "答案：容積週期型呼吸器\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「容積週期型呼吸器」；肺結核題要抓空氣傳染與完整服藥\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「容積週期型呼吸器」之所以是答案，是因為它符合本題核心判斷。肺結核需採空氣傳染防護，常見措施包括負壓病室、N95 防護與規則完成多重抗結核藥物療程，避免因症狀改善就停藥。 其他選項如「負壓型呼吸器、壓力週期型呼吸器」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：TB 題記住空氣隔離、N95、負壓與服藥完整性。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-005", "unit": "單元9 呼吸系統疾病與護理3", "question": "急性呼吸窘迫症候群(ARDS)患者出現廣泛性肺擴張不全，主因肺泡內水腫影響那一種肺泡細胞的生理功能？", "options": ["第1類細胞的氣體交換", "第2類細胞分泌表面張力素", "第3類巨噬細胞吞噬外來物", "柯恩氏孔(pores of Kohn)的氣體流通"], "answer": 1, "explanation": "答案：第2類細胞分泌表面張力素\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「第2類細胞分泌表面張力素」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「第2類細胞分泌表面張力素」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「第1類細胞的氣體交換、第3類巨噬細胞吞噬外來物」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-006", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關急性呼吸窘迫症候群(ARDS)病生理變化的敘述，下列何者正確？", "options": ["微血管細胞膜的通透性增加，導致肺水腫", "肺泡過度擴張導致呼吸道阻力下降", "肺泡表面張力素過度分泌，導致肺泡過度撐大", "支氣管擴張導致進入肺的氣體流量下降"], "answer": 0, "explanation": "答案：微血管細胞膜的通透性增加，導致肺水腫\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「微血管細胞膜的通透性增加，導致肺水腫」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「微血管細胞膜的通透性增加，導致肺水腫」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「肺泡過度擴張導致呼吸道阻力下降、肺泡表面張力素過度分泌，導致肺泡過度撐大」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-007", "unit": "單元9 呼吸系統疾病與護理3", "question": "急性呼吸窘迫症候群(ARDS)主要的臨床表徵包括那些？①白肺(white out)②D(A-a)O2增至200～500mmHg③功能性肺餘容量(FRC)增加④治療無效的血氧過低(refractory hypoxemia)⑤肺微血管楔壓(PCWP)＞12 mmHg：", "options": ["①②④", "①③⑤", "②③④", "②④⑤"], "answer": 0, "explanation": "答案：①②④\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「①②④」；ARDS 題要抓頑固性低血氧與肺泡塌陷\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「①②④」之所以是答案，是因為它符合本題核心判斷。ARDS 常見嚴重低血氧、瀰漫性肺泡損傷與肺順應性下降；治療照護常涉及氧合支持、PEEP、俯臥位與密切監測呼吸循環。 其他選項如「①③⑤、②③④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：ARDS 的關鍵字是「氧氣給了仍低氧」與需要進階呼吸支持。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-008", "unit": "單元9 呼吸系統疾病與護理3", "question": "急性呼吸窘迫症候群病人使用呼氣末正壓(PEEP)的目的，下列何者正確？", "options": ["協助打開氣管及支氣管", "減少功能性肺餘容積", "減少分流情形", "可增加胸內靜脈回流"], "answer": 2, "explanation": "答案：減少分流情形\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「減少分流情形」；ARDS 題要抓頑固性低血氧與肺泡塌陷\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「減少分流情形」之所以是答案，是因為它符合本題核心判斷。ARDS 常見嚴重低血氧、瀰漫性肺泡損傷與肺順應性下降；治療照護常涉及氧合支持、PEEP、俯臥位與密切監測呼吸循環。 其他選項如「協助打開氣管及支氣管、減少功能性肺餘容積」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：ARDS 的關鍵字是「氧氣給了仍低氧」與需要進階呼吸支持。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-009", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關促進急性呼吸窘迫症候群(ARDS)病人有效呼吸道清除的護理措施，下列何者正確？", "options": ["每2小時給氧", "每4小時翻身", "給予鎮靜劑以促進休息", "若咳嗽無效，可進行抽痰"], "answer": 3, "explanation": "答案：若咳嗽無效，可進行抽痰\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「若咳嗽無效，可進行抽痰」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「若咳嗽無效，可進行抽痰」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「每2小時給氧、每4小時翻身」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-010", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關急性呼吸窘迫症候群(ARDS)的處置，下列何者錯誤？", "options": ["使用濃縮紅血球以維持正常血色素來增加攜氧能力", "使用膠質溶液以減少微血管滲漏程度", "使用升壓劑以改善心輸出量不足現象", "使用陽壓呼吸器以降低功能性肺餘容積"], "answer": 3, "explanation": "答案：使用陽壓呼吸器以降低功能性肺餘容積\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「使用陽壓呼吸器以降低功能性肺餘容積」；ARDS 題要抓頑固性低血氧與肺泡塌陷\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「使用陽壓呼吸器以降低功能性肺餘容積」之所以是答案，是因為它符合本題核心判斷。ARDS 常見嚴重低血氧、瀰漫性肺泡損傷與肺順應性下降；治療照護常涉及氧合支持、PEEP、俯臥位與密切監測呼吸循環。 其他選項如「使用濃縮紅血球以維持正常血色素來增加攜氧能力、使用膠質溶液以減少微血管滲漏程度」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：ARDS 的關鍵字是「氧氣給了仍低氧」與需要進階呼吸支持。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-011", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關使用呼氣末期陽壓(PEEP)治療急性呼吸窘迫症候群的主要目的，下列何者正確？", "options": ["可避免肺纖維化的產生", "可使吸氣時有更多氣體帶入肺內", "可將100%的氧氣帶入肺內", "可避免吐氣時肺泡塌陷"], "answer": 3, "explanation": "答案：可避免吐氣時肺泡塌陷\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「可避免吐氣時肺泡塌陷」；ARDS 題要抓頑固性低血氧與肺泡塌陷\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「可避免吐氣時肺泡塌陷」之所以是答案，是因為它符合本題核心判斷。ARDS 常見嚴重低血氧、瀰漫性肺泡損傷與肺順應性下降；治療照護常涉及氧合支持、PEEP、俯臥位與密切監測呼吸循環。 其他選項如「可避免肺纖維化的產生、可使吸氣時有更多氣體帶入肺內」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：ARDS 的關鍵字是「氧氣給了仍低氧」與需要進階呼吸支持。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-012", "unit": "單元9 呼吸系統疾病與護理3", "question": "下列那一種肺癌生長最快速，且最惡性但對化學及放射線治療敏感？", "options": ["小細胞肺癌", "鱗狀細胞癌", "肺腺癌", "大細胞肺癌"], "answer": 0, "explanation": "答案：小細胞肺癌\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「小細胞肺癌」；放射治療題要抓局部皮膚照護與疲倦\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「小細胞肺癌」之所以是答案，是因為它符合本題核心判斷。放射治療照護重點是保護照射部位皮膚，避免摩擦、抓癢、熱敷、冰敷或自行塗刺激性藥膏，並評估疲倦與局部組織反應。 其他選項如「鱗狀細胞癌、肺腺癌」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：放療皮膚題記住：溫和清潔、避免刺激、不要任意塗抹或摩擦。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-013", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺癌常見的轉移部位，下列何者錯誤？", "options": ["腦部", "胰臟", "骨骼", "肝臟"], "answer": 1, "explanation": "答案：胰臟\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「胰臟」；腫瘤概念題要分清良惡性、侵犯性與轉移能力\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「胰臟」之所以是答案，是因為它符合本題核心判斷。良性腫瘤多生長較慢、邊界較清楚且不轉移；惡性腫瘤常侵犯周邊組織、分化較差且可能經血液或淋巴轉移，癌細胞也常失去正常接觸抑制。 其他選項如「腦部、骨骼」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：腫瘤題常考「侵犯、轉移、分化差、接觸抑制消失」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-014", "unit": "單元9 呼吸系統疾病與護理3", "question": "一位有抽菸習慣的病人向護理師詢問：「你們說抽菸傷肺，抽菸到底是如何傷害我的肺？」，護理師應如何正確回答？", "options": ["抽菸會影響你咳嗽及嘔吐反射的能力", "抽菸會影響你呼吸道黏膜纖毛排除分泌物的能力", "抽菸會影響你呼吸道濕潤吸入空氣的能力", "抽菸會影響你呼吸道過濾吸入空氣的能力"], "answer": 1, "explanation": "答案：抽菸會影響你呼吸道黏膜纖毛排除分泌物的能力\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「抽菸會影響你呼吸道黏膜纖毛排除分泌物的能力」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「抽菸會影響你呼吸道黏膜纖毛排除分泌物的能力」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「抽菸會影響你咳嗽及嘔吐反射的能力、抽菸會影響你呼吸道濕潤吸入空氣的能力」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-015", "unit": "單元9 呼吸系統疾病與護理3", "question": "肺葉切除手術後右側胸管留置病人，胸管抽吸控制瓶中持續有氣泡產生，應提供下列何項護理處置？", "options": ["調高抽吸的壓力", "更換新的抽吸控制瓶", "可能發生氣胸，需立即通知醫師", "正常現象，繼續觀察"], "answer": 2, "explanation": "答案：可能發生氣胸，需立即通知醫師\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「可能發生氣胸，需立即通知醫師」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「可能發生氣胸，需立即通知醫師」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「調高抽吸的壓力、更換新的抽吸控制瓶」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-016", "unit": "單元9 呼吸系統疾病與護理3", "question": "肺癌病人接受下列何種手術後，不需要使用胸腔水下引流裝置？", "options": ["全肺切除術(pneumonectomy)", "肺葉切除術(lobectomy)", "肺節切除術(segmentectomy)", "楔形切除術(wedge resection)"], "answer": 0, "explanation": "答案：全肺切除術(pneumonectomy)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「全肺切除術(pneumonectomy)」；腫瘤概念題要分清良惡性、侵犯性與轉移能力\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「全肺切除術(pneumonectomy)」之所以是答案，是因為它符合本題核心判斷。良性腫瘤多生長較慢、邊界較清楚且不轉移；惡性腫瘤常侵犯周邊組織、分化較差且可能經血液或淋巴轉移，癌細胞也常失去正常接觸抑制。 其他選項如「肺葉切除術(lobectomy)、肺節切除術(segmentectomy)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：腫瘤題常考「侵犯、轉移、分化差、接觸抑制消失」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-017", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺癌手術治療之敘述，下列何者正確？", "options": ["手術切除較適合於IIIB期以上病人", "胸部X光檢查發現腫塊＞，即可接受手術", "手術前評估FEV1時，須注意切除範圍，以保留術後至少", "全肺切除術後，較少使用胸腔引流"], "answer": 3, "explanation": "答案：全肺切除術後，較少使用胸腔引流\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「全肺切除術後，較少使用胸腔引流」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「全肺切除術後，較少使用胸腔引流」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「手術切除較適合於IIIB期以上病人、胸部X光檢查發現腫塊＞，即可接受手術」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-018", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺癌病人進行肺葉切除(lobectomy)手術前護理指導之敘述，下列何者錯誤？", "options": ["術前戒菸是為了要減少痰液的分泌，增加氧合能力", "行心肺功能檢查的目的是為了確認術後的功能所受影響及恢復情形", "教導吸氣較吐氣為長的胸式呼吸，以降低術後疼痛及增加氧合", "實施全關節運動是為預防關節攣縮及維持肌肉張力"], "answer": 2, "explanation": "答案：教導吸氣較吐氣為長的胸式呼吸，以降低術後疼痛及增加氧合\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「教導吸氣較吐氣為長的胸式呼吸，以降低術後疼痛及增加氧合」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「教導吸氣較吐氣為長的胸式呼吸，以降低術後疼痛及增加氧合」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「術前戒菸是為了要減少痰液的分泌，增加氧合能力、行心肺功能檢查的目的是為了確認術後的功能所受影響及恢復情形」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-019", "unit": "單元9 呼吸系統疾病與護理3", "question": "為肺葉切除術後病人進行胸部評估時，發現傷口周圍皮膚組織像海綿狀且有爆裂音，下列何者是病人最可能的問題？", "options": ["皮下氣腫", "肋膜積水", "氣胸", "連枷胸"], "answer": 0, "explanation": "答案：皮下氣腫\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「皮下氣腫」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「皮下氣腫」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「肋膜積水、氣胸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-020", "unit": "單元9 呼吸系統疾病與護理3", "question": "右肺葉切除術後病人的姿勢擺位，下列何者最適當？", "options": ["左或右側臥", "平躺或高坐臥", "平躺或右側臥", "左側臥或半坐臥"], "answer": 3, "explanation": "答案：左側臥或半坐臥\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「左側臥或半坐臥」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「左側臥或半坐臥」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「左或右側臥、平躺或高坐臥」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-021", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關全肺切除術(penumonectomy)後之護理措施，下列何者正確？", "options": ["教導誘導性肺量器使用，預防氣喘發作", "限制患側肩部關節運動，以防牽拉傷口", "協助病人早期下床，以促進肺膨脹", "鼓勵術前開始睡向患側，預防縱膈腔偏移"], "answer": 2, "explanation": "答案：協助病人早期下床，以促進肺膨脹\n作答關鍵：先抓題幹要你判斷的護理重點，再回到正確選項「協助病人早期下床，以促進肺膨脹」比對\n解析：(A)預防肺擴張不全；(B)鼓勵患側肩部及手臂關節運動，以防關節黏滯(冰凍肩) ；(D)術後不宜完全左右側臥，以防造縱隔腔移位及健側肺無法完全膨脹\n複習提醒：遇到同類題時，先確認能支持正確選項「協助病人早期下床，以促進肺膨脹」的核心概念"}, {"id": "unit9-022", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關開胸手術切除肺葉病人身上留置的兩條胸管功能之敘述，下列何者正確？", "options": ["因手術傷口血水較多，故需兩條胸管同時進行引流", "兩條胸管是為了引流肺部不同部位的血水", "位置較低的胸管引流血水，位置較高的胸管引流氣體", "位置較低的胸管為主要的血水引流管，位置較高的胸管是備用的"], "answer": 2, "explanation": "答案：位置較低的胸管引流血水，位置較高的胸管引流氣體\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「位置較低的胸管引流血水，位置較高的胸管引流氣體」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「位置較低的胸管引流血水，位置較高的胸管引流氣體」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「因手術傷口血水較多，故需兩條胸管同時進行引流、兩條胸管是為了引流肺部不同部位的血水」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-023", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關胸腔手術術後病人執行有效呼吸與咳嗽之護理指導，下列何者錯誤？", "options": ["儘量保持平躺，以減少呼吸作功", "使用止痛劑緩解疼痛，以助有效咳嗽", "鼓勵病人儘量起身走動", "給予誘發性肺量計使用"], "answer": 0, "explanation": "答案：儘量保持平躺，以減少呼吸作功\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「儘量保持平躺，以減少呼吸作功」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「儘量保持平躺，以減少呼吸作功」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「使用止痛劑緩解疼痛，以助有效咳嗽、鼓勵病人儘量起身走動」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-024", "unit": "單元9 呼吸系統疾病與護理3", "question": "呼吸衰竭病人攝取下列那種食物過多，可能會增加呼吸作功的負荷？", "options": ["脂肪", "醣類", "蛋白質", "維生素"], "answer": 1, "explanation": "答案：醣類\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「醣類」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「醣類」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「脂肪、蛋白質」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-025", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關神經肌肉病變導致呼吸衰竭病理機轉之敘述，下列何者正確？", "options": ["潮氣容積下降", "肺死腔增加", "二氧化碳的排出增加", "肺泡與微血管間擴散障礙"], "answer": 0, "explanation": "答案：潮氣容積下降\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「潮氣容積下降」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「潮氣容積下降」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「肺死腔增加、二氧化碳的排出增加」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-026", "unit": "單元9 呼吸系統疾病與護理3", "question": "因呼吸衰竭而血中二氧化碳分壓(PaCO2)過高時，下列症狀何者最可能立即危及生命？", "options": ["病人變得嗜睡導致PaCO2提高", "病人周邊血氧飽和濃度(SpO2)為90%", "病人主訴全身虛弱", "病人的血壓偏高160/90mmHg"], "answer": 0, "explanation": "答案：病人變得嗜睡導致PaCO2提高\n作答關鍵：題目考優先順序，先處理會威脅生命或造成病情快速惡化的問題。 本題答案指向「病人變得嗜睡導致PaCO2提高」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：優先題要以 ABC、循環穩定、安全風險與急性變化來排序，而不是只選看起來常見的照護。 「病人變得嗜睡導致PaCO2提高」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「病人周邊血氧飽和濃度(SpO2)為90%、病人主訴全身虛弱」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 優先題先問自己：哪一項不先做會最快造成危險"}, {"id": "unit9-027", "unit": "單元9 呼吸系統疾病與護理3", "question": "下列何者不是造成肺泡通氣不足而導致呼吸衰竭的原因？", "options": ["睡眠呼吸中止症", "頸椎損傷", "肺栓塞", "安眠藥服用過量"], "answer": 2, "explanation": "答案：肺栓塞\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「肺栓塞」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「肺栓塞」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「睡眠呼吸中止症、頸椎損傷」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-028", "unit": "單元9 呼吸系統疾病與護理3", "question": "二氧化碳過高型急性呼吸衰竭病患，下列生理反應何者錯誤？", "options": ["PaCO2升高", "PaO2正常", "腦部血管擴張", "呼吸性酸中毒"], "answer": 1, "explanation": "答案：PaO2正常\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「PaO2正常」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「PaO2正常」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「PaCO2升高、腦部血管擴張」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-029", "unit": "單元9 呼吸系統疾病與護理3", "question": "病人有心衰竭病史，因車禍造成左側肋骨骨折與氣血胸，目前出現急性呼吸衰竭的情形，下列護理措施何者最不適宜？", "options": ["給與止痛藥，避免肺擴張不全，降低通氣量", "給與氧氣，FiO2 60%", "給與全血，避免血色素低下，影響攜氧量", "建議補充低醣、高蛋白食物"], "answer": 2, "explanation": "答案：給與全血，避免血色素低下，影響攜氧量\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「給與全血，避免血色素低下，影響攜氧量」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「給與全血，避免血色素低下，影響攜氧量」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「給與止痛藥，避免肺擴張不全，降低通氣量、給與氧氣，FiO2 60%」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-030", "unit": "單元9 呼吸系統疾病與護理3", "question": "病人肺部手術後出現呼吸速率加快、粉紅色泡沫狀痰液、持續性咳嗽、呼吸困難和囉音等表徵，最有可能的合併症是下列何者？", "options": ["肺炎", "氣胸", "肺栓塞", "急性肺水腫"], "answer": 3, "explanation": "答案：急性肺水腫\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「急性肺水腫」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「急性肺水腫」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「肺炎、氣胸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-031", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關接受肺葉切除手術病人之護理，下列敘述何者正確？", "options": ["術前接受肺功能檢查，可作為評估術後咳嗽能力的指標", "術後教導避免肩部與手臂運動，以利傷口癒合", "採肺葉切除手術，術後應臥向患側，以利健側肺部氣體交換", "術後使用誘發性肺量計(incentive spirometry)，可預防肺塌陷"], "answer": 3, "explanation": "答案：術後使用誘發性肺量計(incentive spirometry)，可預防肺塌陷\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「術後使用誘發性肺量計(incentive spirometry)，可預防肺塌陷」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「術後使用誘發性肺量計(incentive spirometry)，可預防肺塌陷」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「術前接受肺功能檢查，可作為評估術後咳嗽能力的指標、術後教導避免肩部與手臂運動，以利傷口癒合」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-032", "unit": "單元9 呼吸系統疾病與護理3", "question": "王先生診斷左側肋膜積水準備接受胸腔放液穿刺術，下列何者為其最適當的姿勢體位？", "options": ["床頭搖高30度仰臥", "坐於床緣，頭和手趴在床旁桌上", "躺向左側，左手臂上舉過頭", "左手上舉採俯臥"], "answer": 1, "explanation": "答案：坐於床緣，頭和手趴在床旁桌上\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「坐於床緣，頭和手趴在床旁桌上」；心導管題要注意穿刺部位出血與遠端循環\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「坐於床緣，頭和手趴在床旁桌上」之所以是答案，是因為它符合本題核心判斷。心導管術後需觀察穿刺處有無出血、血腫，評估遠端脈搏、膚色、溫度與感覺，並依穿刺部位維持臥床與肢體伸直。 其他選項如「床頭搖高30度仰臥、躺向左側，左手臂上舉過頭」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：術後題先看出血、循環、疼痛與生命徵象變化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-033", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關發炎或腫瘤造成的滲出性肋膜積水(exudative pleural effusion)的特徵，下列何者正確？①比重＜1.015②Rivalta試驗陽性反應③蛋白質＞3gm/dL④紅血球正常：", "options": ["①②", "①④", "②③", "③④"], "answer": 2, "explanation": "答案：②③\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「②③」；腫瘤概念題要分清良惡性、侵犯性與轉移能力\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「②③」之所以是答案，是因為它符合本題核心判斷。良性腫瘤多生長較慢、邊界較清楚且不轉移；惡性腫瘤常侵犯周邊組織、分化較差且可能經血液或淋巴轉移，癌細胞也常失去正常接觸抑制。 其他選項如「①②、①④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：腫瘤題常考「侵犯、轉移、分化差、接觸抑制消失」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-034", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肋膜積水的敘述，下列何者正確？", "options": ["觸診震顫在積水部位會明顯增強", "是由肋膜腔內微血管滲透壓減少或淋巴回流量增加所致", "滲出性肋膜積水(exudative pleural effusion)液顏色較深、內含蛋白質＞3gm/dL、比重＞1.018", "漏出性肋膜積水(transudative pleural effusion)主要是由炎症病變所引起"], "answer": 2, "explanation": "答案：滲出性肋膜積水(exudative pleural effusion)液顏色較深、內含蛋白質＞3gm/dL、比重＞1.018\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「滲出性肋膜積水(exudative pleural effusion)液顏色較深、內含蛋白質＞3gm/dL、比重＞1.018」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「滲出性肋膜積水(exudative pleural effusion)液顏色較深、內含蛋白質＞3gm/dL、比重＞1.018」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「觸診震顫在積水部位會明顯增強、是由肋膜腔內微血管滲透壓減少或淋巴回流量增加所致」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-035", "unit": "單元9 呼吸系統疾病與護理3", "question": "由於感染所造成之肋膜積水，通常多為下列何種類別或性質之積液？", "options": ["漏出性(transudative)肋膜積水", "滲出性(exudative)肋膜積水", "顏色清澈、淡黃", "含大量淋巴球"], "answer": 1, "explanation": "答案：滲出性(exudative)肋膜積水\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「滲出性(exudative)肋膜積水」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「滲出性(exudative)肋膜積水」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「漏出性(transudative)肋膜積水、顏色清澈、淡黃」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-036", "unit": "單元9 呼吸系統疾病與護理3", "question": "關肋膜積水進行放液時，若一次超過1,200c.c.，可能會發生下列何種現象？", "options": ["血壓急速上升", "高碳酸血症", "肺水腫", "肺纖維化"], "answer": 2, "explanation": "答案：肺水腫\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「肺水腫」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「肺水腫」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「血壓急速上升、高碳酸血症」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-037", "unit": "單元9 呼吸系統疾病與護理3", "question": "自發性氣胸導致縱膈移位後造成的影響，下列何者正確？", "options": ["右心血液回流減少", "肋膜腔感染", "心包膜破裂", "未受影響側的肺容量增加"], "answer": 0, "explanation": "答案：右心血液回流減少\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「右心血液回流減少」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「右心血液回流減少」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「肋膜腔感染、心包膜破裂」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-038", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關單側自發性氣胸病人之身體檢查評估結果，下列何者錯誤？", "options": ["吸氣時，胸廓兩側不對稱", "患側觸覺震顫減弱", "患側叩診為過度反響音", "橫膈膜離軌度變大"], "answer": 3, "explanation": "答案：橫膈膜離軌度變大\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「橫膈膜離軌度變大」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「橫膈膜離軌度變大」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「吸氣時，胸廓兩側不對稱、患側觸覺震顫減弱」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-039", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關自發性氣胸之敘述，下列何者錯誤？", "options": ["好發於老年人", "病人體型多為瘦高型", "病人多有抽菸史", "此病有家族史"], "answer": 0, "explanation": "答案：好發於老年人\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「好發於老年人」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「好發於老年人」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「病人體型多為瘦高型、病人多有抽菸史」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-040", "unit": "單元9 呼吸系統疾病與護理3", "question": "李同學在打籃球時突然感到左胸尖銳疼痛到急診求治，護理師視診發現李同學的左側胸部起伏較小，且氣管偏向右側，聽診發現左側肺部呼吸音減弱、叩診左側肺部出現過度反響音，此時李同學最可能發生下列何種情形？", "options": ["槤枷胸", "氣胸", "肺炎", "肺栓塞"], "answer": 1, "explanation": "答案：氣胸\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「氣胸」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「氣胸」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「槤枷胸、肺炎」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-041", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關張力性氣胸(tension pneumothorax)的臨床表徵，下列何者正確？", "options": ["吐氣時出現喘鳴音", "單側呼吸音減弱", "單側肋膜積水", "吸氣時單側不正常下陷"], "answer": 1, "explanation": "答案：單側呼吸音減弱\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「單側呼吸音減弱」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「單側呼吸音減弱」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「吐氣時出現喘鳴音、單側肋膜積水」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-042", "unit": "單元9 呼吸系統疾病與護理3", "question": "針對左側氣胸病人之患側胸部評估，下列何者為最可能之發現？", "options": ["叩診濁音", "觸診有觸覺震顫", "聽診有濕囉音", "聽診呼吸音消失"], "answer": 3, "explanation": "答案：聽診呼吸音消失\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「聽診呼吸音消失」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「聽診呼吸音消失」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「叩診濁音、觸診有觸覺震顫」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-043", "unit": "單元9 呼吸系統疾病與護理3", "question": "車禍外傷病人出現胸部右側聽不到呼吸音，且氣管向左側偏移，下列處置何者最適當？", "options": ["準備抽血進行血液培養(blood culture)", "準備心肺復甦術(CPR)並請其他人通知醫師", "準備胸部針刺減壓(chest needle decompression)", "進行動脈氣體分析(arterial blood gas analysis)"], "answer": 2, "explanation": "答案：準備胸部針刺減壓(chest needle decompression)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「準備胸部針刺減壓(chest needle decompression)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「準備胸部針刺減壓(chest needle decompression)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「準備抽血進行血液培養(blood culture)、準備心肺復甦術(CPR)並請其他人通知醫師」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-044", "unit": "單元9 呼吸系統疾病與護理3", "question": "下列何者是氣胸病人放置胸管的目的？", "options": ["監測是否出血", "監測肺 功能", "移除肋膜腔中的氣體", "引流肋膜腔中的液體"], "answer": 2, "explanation": "答案：移除肋膜腔中的氣體\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「移除肋膜腔中的氣體」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「移除肋膜腔中的氣體」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「監測是否出血、監測肺 功能」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-045", "unit": "單元9 呼吸系統疾病與護理3", "question": "外傷性肋骨骨折病人可能出現之徵候與症狀，下列何者正確？", "options": ["慢且深的呼吸型態，且疼痛持續存在", "快且深的呼吸型態，且吐氣時疼痛感加劇", "較淺的呼吸型態，且吸氣時疼痛感加劇", "喟嘆式的呼吸型態，且飯後疼痛感加劇"], "answer": 2, "explanation": "答案：較淺的呼吸型態，且吸氣時疼痛感加劇\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「較淺的呼吸型態，且吸氣時疼痛感加劇」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「較淺的呼吸型態，且吸氣時疼痛感加劇」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「慢且深的呼吸型態，且疼痛持續存在、快且深的呼吸型態，且吐氣時疼痛感加劇」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-046", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關連枷胸的敘述，下列何者正確？", "options": ["會使死腔減少", "會造成奇異性呼吸", "會影響肺吸氣時胸腔產生的正壓", "連枷段會在吸氣時向外突出，而吐氣時往內拉"], "answer": 1, "explanation": "答案：會造成奇異性呼吸\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「會造成奇異性呼吸」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「會造成奇異性呼吸」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「會使死腔減少、會影響肺吸氣時胸腔產生的正壓」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-047", "unit": "單元9 呼吸系統疾病與護理3", "question": "下列何種疾病會出現奇異性呼吸(paradoxical respiration)？", "options": ["張力性氣胸", "槤枷胸", "急性呼吸衰竭", "肺高壓症"], "answer": 1, "explanation": "答案：槤枷胸\n作答關鍵：先抓題幹要你判斷的護理重點，再回到正確選項「槤枷胸」比對\n解析：奇異呼吸(paradoxical breathing)是指吸氣時患側胸部向內凹陷，呼氣時則向外膨出\n複習提醒：遇到同類題時，先確認能支持正確選項「槤枷胸」的核心概念"}, {"id": "unit9-048", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關槤枷胸之敘述，下列何者正確？", "options": ["多重胸腔肌肉創傷所導致", "常出現深及慢的呼吸型態", "吸氣時患部向外膨出", "治療主要著重於肺部再擴張"], "answer": 3, "explanation": "答案：治療主要著重於肺部再擴張\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「治療主要著重於肺部再擴張」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「治療主要著重於肺部再擴張」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「多重胸腔肌肉創傷所導致、常出現深及慢的呼吸型態」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-049", "unit": "單元9 呼吸系統疾病與護理3", "question": "血胸病人放置胸管後，發生下列何種情況需立即通知醫師處置？", "options": ["大量氣泡出現在水下引流瓶內", "一小時內引流出400mL血水", "病人用力吸氣時會有劇烈疼痛", "水下引流瓶長玻管內液面無上下浮動"], "answer": 1, "explanation": "答案：一小時內引流出400mL血水\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「一小時內引流出400mL血水」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「一小時內引流出400mL血水」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「大量氣泡出現在水下引流瓶內、病人用力吸氣時會有劇烈疼痛」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-050", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關膿胸病變發生之部位，下列何者正確？", "options": ["肺泡", "支氣管", "肺實質", "肋膜腔"], "answer": 3, "explanation": "答案：肋膜腔\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「肋膜腔」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「肋膜腔」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「肺泡、支氣管」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-051", "unit": "單元9 呼吸系統疾病與護理3", "question": "王先生胸壁受到鈍傷入院求治，下列何者表示可能有肺挫傷的情形？", "options": ["呼吸緩慢", "呼吸音降低", "桶狀胸", "受傷部位有吸吮聲"], "answer": 1, "explanation": "答案：呼吸音降低\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「呼吸音降低」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「呼吸音降低」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「呼吸緩慢、桶狀胸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-052", "unit": "單元9 呼吸系統疾病與護理3", "question": "肺栓塞病人於血栓形成後72小時內，可給與下列何種藥物以快速溶解血塊？", "options": ["aspirin", "heparin", "streptokinase", "warfarin"], "answer": 2, "explanation": "答案：streptokinase\n作答關鍵：先抓題幹要你判斷的護理重點，再回到正確選項「streptokinase」比對\n解析：(A)(B)(D)為抗凝血劑\n複習提醒：遇到同類題時，先確認能支持正確選項「streptokinase」的核心概念"}, {"id": "unit9-053", "unit": "單元9 呼吸系統疾病與護理3", "question": "肺栓塞病人使用肝素以阻止新的血塊形成，通常須維持部分凝血活酶時間(aPTT)為正常值的多少倍？", "options": ["1.0～1.4", "1.5～2.5", "2.6～3.5", "3.6～4.5"], "answer": 1, "explanation": "答案：1.5～2.5\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「1.5～2.5」；Warfarin 題要抓凝血監測與出血安全\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「1.5～2.5」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「1.0～1.4、2.6～3.5」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-054", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺栓塞患者服用Coumadin居家護理指導之敘述，下列何者錯誤？", "options": ["治療期間應停止抽菸", "治療期間宜多吃富含維生素K的食物", "抽血後應在穿刺部位局部加壓15～20分鐘", "選用軟毛牙刷或正確使用含蠟的牙線"], "answer": 1, "explanation": "答案：治療期間宜多吃富含維生素K的食物\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「治療期間宜多吃富含維生素K的食物」；Warfarin 題要抓凝血監測與出血安全\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「治療期間宜多吃富含維生素K的食物」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「治療期間應停止抽菸、抽血後應在穿刺部位局部加壓15～20分鐘」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-055", "unit": "單元9 呼吸系統疾病與護理3", "question": "肺栓塞(pulmonary embolism)病人之臨床表徵，下列何者最不可能出現？", "options": ["突然呼吸困難", "心搏過緩", "胸痛", "焦慮"], "answer": 1, "explanation": "答案：心搏過緩\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「心搏過緩」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「心搏過緩」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「突然呼吸困難、胸痛」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit9-056", "unit": "單元9 呼吸系統疾病與護理3", "question": "大範圍肺栓塞(massive　pulmonary　embolus)影響血流動力學造成的變化，下列何者正確？", "options": ["全身性血管阻力上升導致左心衰竭", "肺高壓造成右心衰竭", "肝門靜脈阻塞引起腹水", "內頸靜脈阻塞導致頭頸部水腫"], "answer": 1, "explanation": "答案：肺高壓造成右心衰竭\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「肺高壓造成右心衰竭」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「肺高壓造成右心衰竭」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「全身性血管阻力上升導致左心衰竭、肝門靜脈阻塞引起腹水」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-057", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺栓塞之預防措施，下列何者最重要？", "options": ["經常深呼吸及咳嗽", "每天至少攝取3,000 c.c.的水分", "避免劇烈運動", "避免久坐以預防深部靜脈血栓"], "answer": 3, "explanation": "答案：避免久坐以預防深部靜脈血栓\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「避免久坐以預防深部靜脈血栓」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「避免久坐以預防深部靜脈血栓」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「經常深呼吸及咳嗽、每天至少攝取3,000 c.c.的水分」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-058", "unit": "單元9 呼吸系統疾病與護理3", "question": "一位肺氣腫病人突然覺得呼吸短促，醫生診斷為自發性氣胸，下列何者是造成此情形最可能的原因？", "options": ["氣管與食道間的瘻管", "肋膜磨擦間的瘻管", "胸壁穿刺性的傷口", "肺臟頂端的氣泡破裂"], "answer": 3, "explanation": "答案：肺臟頂端的氣泡破裂\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「肺臟頂端的氣泡破裂」；心導管題要注意穿刺部位出血與遠端循環\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「肺臟頂端的氣泡破裂」之所以是答案，是因為它符合本題核心判斷。心導管術後需觀察穿刺處有無出血、血腫，評估遠端脈搏、膚色、溫度與感覺，並依穿刺部位維持臥床與肢體伸直。 其他選項如「氣管與食道間的瘻管、肋膜磨擦間的瘻管」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：術後題先看出血、循環、疼痛與生命徵象變化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-059", "unit": "單元9 呼吸系統疾病與護理3", "question": "評估疑似肺栓塞病人時，最可能發現下列何種症狀？", "options": ["突然發冷、發燒", "突然胸痛", "出現噘嘴式呼吸", "出現泡沫痰"], "answer": 1, "explanation": "答案：突然胸痛\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「突然胸痛」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「突然胸痛」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「突然發冷、發燒、出現噘嘴式呼吸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-060", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺栓塞病人之護理處置，下列敘述何者最正確？", "options": ["教導病人應多食用青花椰菜、甘藍、菠菜等", "教導病人坐姿時，應避免翹二郎腿或交叉雙腿", "教導病人胸痛時，可服用NTG緩解疼痛", "教導病人使用誘發性肺量計(incentive spirometry)，增進肺部血流"], "answer": 1, "explanation": "答案：教導病人坐姿時，應避免翹二郎腿或交叉雙腿\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「教導病人坐姿時，應避免翹二郎腿或交叉雙腿」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「教導病人坐姿時，應避免翹二郎腿或交叉雙腿」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「教導病人應多食用青花椰菜、甘藍、菠菜等、教導病人胸痛時，可服用NTG緩解疼痛」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-061", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺栓塞的醫療處置，下列何者錯誤？", "options": ["給與氧氣治療，維持PaO2在60mmHg以上", "抬高下肢增加靜脈回流", "給與Streptokinase預防血栓形成", "在下腔靜脈放入腔靜脈過濾器"], "answer": 2, "explanation": "答案：給與Streptokinase預防血栓形成\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「給與Streptokinase預防血栓形成」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「給與Streptokinase預防血栓形成」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「給與氧氣治療，維持PaO2在60mmHg以上、抬高下肢增加靜脈回流」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit9-062", "unit": "單元9 呼吸系統疾病與護理3", "question": "下列何者不是肺水腫病人之典型臨床表徵？", "options": ["動脈氧分壓(PaO2)48 mmHg", "肺動脈楔壓(PAWP)14 mmHg", "頸靜脈怒張", "中心靜脈壓(CVP)18 cmH2O"], "answer": 1, "explanation": "答案：肺動脈楔壓(PAWP)14 mmHg\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「肺動脈楔壓(PAWP)14 mmHg」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「肺動脈楔壓(PAWP)14 mmHg」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「動脈氧分壓(PaO2)48 mmHg、頸靜脈怒張」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-063", "unit": "單元9 呼吸系統疾病與護理3", "question": "理一位出現肺水腫症狀與徵候的病人，下列措施之順序，何者最適當？①經由鼻導管給與2 L/min 氧氣治療②呼叫醫師③協助病人採高坐臥④準備床邊抽痰用物：", "options": ["①②③④", "①④③②", "②①③④", "③①④②"], "answer": 3, "explanation": "答案：③①④②\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「③①④②」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「③①④②」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「①②③④、①④③②」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-064", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺水腫(pulmonary edema)的敘述，下列何者正確？", "options": ["為肋膜過度積水", "常為左心衰竭所引起", "應提供增加前負荷之處置", "鼓勵病人下肢抬高增加靜脈血液回流"], "answer": 1, "explanation": "答案：常為左心衰竭所引起\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「常為左心衰竭所引起」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「常為左心衰竭所引起」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「為肋膜過度積水、應提供增加前負荷之處置」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit9-065", "unit": "單元9 呼吸系統疾病與護理3", "question": "下列何者為肺水腫最典型的症狀？", "options": ["呼吸音出現肋膜摩擦音", "突然胸痛", "粉紅色泡沫痰", "杵狀指"], "answer": 2, "explanation": "答案：粉紅色泡沫痰\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「粉紅色泡沫痰」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「粉紅色泡沫痰」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「呼吸音出現肋膜摩擦音、突然胸痛」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit9-066", "unit": "單元9 呼吸系統疾病與護理3", "question": "汪先生診斷為肺癌並接受右肺葉切除術，下列何者為其最適合的術後姿勢臥位？", "options": ["躺向左側", "俯臥", "仰臥平躺", "躺向右側"], "answer": 0, "explanation": "答案：躺向左側\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「躺向左側」；ARDS 題要抓頑固性低血氧與肺泡塌陷\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「躺向左側」之所以是答案，是因為它符合本題核心判斷。ARDS 常見嚴重低血氧、瀰漫性肺泡損傷與肺順應性下降；治療照護常涉及氧合支持、PEEP、俯臥位與密切監測呼吸循環。 其他選項如「俯臥、仰臥平躺」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：ARDS 的關鍵字是「氧氣給了仍低氧」與需要進階呼吸支持。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-001", "unit": "單元10 心臟血管系統疾病與護理1", "question": "心臟週期的那一階段會出現第一心音？", "options": ["房室瓣瓣膜開啟", "半月 瓣瓣膜關", "心舒張期開始", "心收縮期開始"], "answer": 3, "explanation": "答案：心收縮期開始\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「心收縮期開始」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「心收縮期開始」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「房室瓣瓣膜開啟、半月 瓣瓣膜關」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-002", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心動週期(cardiac cycle)之敘述，下列何者正確？", "options": ["主動脈與肺動脈瓣關閉會造成第一心音", "正常心率下，收縮期時間較舒張期長", "第一心音與第二心音間為收縮期", "正常人的第二心音分裂音於呼氣期較明顯"], "answer": 2, "explanation": "答案：第一心音與第二心音間為收縮期\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「第一心音與第二心音間為收縮期」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「第一心音與第二心音間為收縮期」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「主動脈與肺動脈瓣關閉會造成第一心音、正常心率下，收縮期時間較舒張期長」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-003", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關聽診心音之敘述，下列何者錯誤？", "options": ["第一心音的產生是僧帽瓣與三尖瓣關閉血液撞擊所造成", "聽診心音的主動脈瓣區在胸骨右緣第2肋間", "聽到第二心音之後心動週期進入心室的舒張期", "心臟衰竭病人如出現第三心音會在心室的舒張末期聽到"], "answer": 3, "explanation": "答案：心臟衰竭病人如出現第三心音會在心室的舒張末期聽到\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「心臟衰竭病人如出現第三心音會在心室的舒張末期聽到」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「心臟衰竭病人如出現第三心音會在心室的舒張末期聽到」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「第一心音的產生是僧帽瓣與三尖瓣關閉血液撞擊所造成、聽診心音的主動脈瓣區在胸骨右緣第2肋間」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-004", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列血流動力學檢查結果何者正常？", "options": ["右心房壓力130mmHg", "右心室收縮壓120 mmHg", "左心室舒張壓40mmHg", "上腔靜脈壓8mmHg"], "answer": 3, "explanation": "答案：上腔靜脈壓8mmHg\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「上腔靜脈壓8mmHg」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「上腔靜脈壓8mmHg」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「右心房壓力130mmHg、右心室收縮壓120 mmHg」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-005", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟循環動力學的敘述，下列何者錯誤？", "options": ["心輸出量(cardiac out-put)＝心搏出量(stroke volume)×每分鐘心跳次數", "心跳次數200次／每分鐘之心輸出量＞心跳次數80次／每分鐘之心輸出量", "中心靜脈導管測量的是右心房之壓力", "平均動脈壓＝1/3收縮壓＋2/3舒張壓"], "answer": 1, "explanation": "答案：心跳次數200次／每分鐘之心輸出量＞心跳次數80次／每分鐘之心輸出量\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「心跳次數200次／每分鐘之心輸出量＞心跳次數80次／每分鐘之心輸出量」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「心跳次數200次／每分鐘之心輸出量＞心跳次數80次／每分鐘之心輸出量」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「心輸出量(cardiac out-put)＝心搏出量(stroke volume)×每分鐘心跳次數、中心靜脈導管測量的是右心房之壓力」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-006", "unit": "單元10 心臟血管系統疾病與護理1", "question": "決定心搏出量(stroke volume)的要素，下列何者錯誤？", "options": ["前負荷", "後負荷", "心收縮力", "心跳速率"], "answer": 3, "explanation": "答案：心跳速率\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「心跳速率」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「心跳速率」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「前負荷、後負荷」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-007", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何種現象會增加心臟之前負荷？", "options": ["周邊血管擴張", "車禍造成失血過多", "呼吸動作之吸氣期", "心室收縮血液流出的阻力增加"], "answer": 2, "explanation": "答案：呼吸動作之吸氣期\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「呼吸動作之吸氣期」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「呼吸動作之吸氣期」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「周邊血管擴張、車禍造成失血過多」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-008", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟血管系統檢查評估的敘述，下列何者錯誤？", "options": ["頸靜脈搏動最高點與胸骨角的垂直距離為5公分，顯示可能右心房壓力偏高", "聽診第三心音時，病人應採左側臥，以聽診器膜面聽診心尖處", "心尖最大搏動點之正常位置，應在左鎖骨中線與第五肋間交叉處", "評估脈搏應記錄速率、節律、強度，並比較左、右側的對稱性"], "answer": 1, "explanation": "答案：聽診第三心音時，病人應採左側臥，以聽診器膜面聽診心尖處\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「聽診第三心音時，病人應採左側臥，以聽診器膜面聽診心尖處」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「聽診第三心音時，病人應採左側臥，以聽診器膜面聽診心尖處」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「頸靜脈搏動最高點與胸骨角的垂直距離為5公分，顯示可能右心房壓力偏高、心尖最大搏動點之正常位置，應在左鎖骨中線與第五肋間交叉處」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-009", "unit": "單元10 心臟血管系統疾病與護理1", "question": "指甲與指甲床的角度超過多少度，稱為杵狀指(clubbing finger)？", "options": ["90", "120", "150", "180"], "answer": 3, "explanation": "答案：180\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「180」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「180」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「90、120」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-010", "unit": "單元10 心臟血管系統疾病與護理1", "question": "艾倫氏試驗(Allen’s test)呈陽性反應，表示下列何種情況？", "options": ["橈動脈或尺動脈供應掌弓動脈血異常", "股動脈血管阻滯", "隱靜脈瓣功能異常", "頸靜脈血流量過大"], "answer": 0, "explanation": "答案：橈動脈或尺動脈供應掌弓動脈血異常\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「橈動脈或尺動脈供應掌弓動脈血異常」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「橈動脈或尺動脈供應掌弓動脈血異常」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「股動脈血管阻滯、隱靜脈瓣功能異常」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-011", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列血脂肪之檢驗值何者不正常？", "options": ["低密度脂蛋白170mg/dL", "高密度脂蛋白60mg/dL", "總膽固醇150mg/dL", "低密度脂蛋白/高密度脂蛋白=1.5"], "answer": 0, "explanation": "答案：低密度脂蛋白170mg/dL\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「低密度脂蛋白170mg/dL」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「低密度脂蛋白170mg/dL」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「高密度脂蛋白60mg/dL、總膽固醇150mg/dL」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-012", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心電圖的敘述，下列何者錯誤？", "options": ["胸導程V5，應置放在左腋前線第5肋間", "T波表示心室去極化", "運動心電圖可評估心肌缺氧的情形", "相鄰的2個R波為5大格，則心跳速率為60次／分"], "answer": 1, "explanation": "答案：T波表示心室去極化\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「T波表示心室去極化」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「T波表示心室去極化」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「胸導程V5，應置放在左腋前線第5肋間、運動心電圖可評估心肌缺氧的情形」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-013", "unit": "單元10 心臟血管系統疾病與護理1", "question": "最適用於檢查心臟結構性變化之心電圖檢查，下列何者正確？", "options": ["霍爾特(Holter)心電圖監測", "12導程心電圖", "運動心電圖", "連續性心電圖監測"], "answer": 1, "explanation": "答案：12導程心電圖\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「12導程心電圖」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「12導程心電圖」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「霍爾特(Holter)心電圖監測、運動心電圖」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-014", "unit": "單元10 心臟血管系統疾病與護理1", "question": "如果在心電圖記錄上看到兩個相鄰R波之間有4個大方格，此病患的心跳速率，下列何者正確？", "options": ["50次/分", "60次/分", "75次/分", "90次/分"], "answer": 2, "explanation": "答案：75次/分\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「75次/分」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「75次/分」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「50次/分、60次/分」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-015", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關運動壓力試驗(exercise stress testing)之敘述，下列何者錯誤？", "options": ["目標是讓病人達到最高心跳", "最高心跳是採用病人的年齡來計算的", "試驗過程要監測心肌缺氧的變化", "試驗中出現異常心電圖時，代表結果是陽性的"], "answer": 0, "explanation": "答案：目標是讓病人達到最高心跳\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「目標是讓病人達到最高心跳」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「目標是讓病人達到最高心跳」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「最高心跳是採用病人的年齡來計算的、試驗過程要監測心肌缺氧的變化」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-016", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關經食道心臟攝影超音波(TEE)檢查之敘述，下列何者錯誤？", "options": ["檢查前禁食6小時", "與其同時做dobutamine藥物壓力試驗時，需插入動脈導管", "檢查過程中，要監測病人的血壓和心電圖", "監測轉換器插入食道及胃部，所引起之血管迷走神經反應"], "answer": 1, "explanation": "答案：與其同時做dobutamine藥物壓力試驗時，需插入動脈導管\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「與其同時做dobutamine藥物壓力試驗時，需插入動脈導管」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「與其同時做dobutamine藥物壓力試驗時，需插入動脈導管」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「檢查前禁食6小時、檢查過程中，要監測病人的血壓和心電圖」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-017", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心臟血管系統的診斷檢查結果，下列敘述何者正確？", "options": ["十二導程心電圖 II、III及aVF出現ST上升，顯示心室前壁心肌梗塞", "B型排鈉利尿胜肽(BNP)＞100pg/mL，表示心臟衰竭", "肺動脈楔壓過高，代表主動脈阻力過高", "高密度脂蛋白(HDL)偏高，容易罹患冠狀動脈疾病"], "answer": 1, "explanation": "答案：B型排鈉利尿胜肽(BNP)＞100pg/mL，表示心臟衰竭\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「B型排鈉利尿胜肽(BNP)＞100pg/mL，表示心臟衰竭」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「B型排鈉利尿胜肽(BNP)＞100pg/mL，表示心臟衰竭」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「十二導程心電圖 II、III及aVF出現ST上升，顯示心室前壁心肌梗塞、肺動脈楔壓過高，代表主動脈阻力過高」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-018", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關測量頸靜脈壓的敘述，下列何者正確？", "options": ["測壓時病人床頭必須放平", "是測量內頸靜脈搏動最高點與胸骨角間的垂直距離", "測壓時病人必須深吸氣", "正常之頸靜脈壓數值高於3～4公分"], "answer": 1, "explanation": "答案：是測量內頸靜脈搏動最高點與胸骨角間的垂直距離\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「是測量內頸靜脈搏動最高點與胸骨角間的垂直距離」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「是測量內頸靜脈搏動最高點與胸骨角間的垂直距離」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「測壓時病人床頭必須放平、測壓時病人必須深吸氣」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-019", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關中心靜脈壓與頸靜脈壓的敘述，下列何者正確？", "options": ["中心靜脈壓代表左心房與左心室壓力", "中心靜脈壓與頸靜脈壓都可反應右心房壓力", "頸靜脈壓代表肺動脈與肺微血管壓力", "中心靜脈壓與頸靜脈壓用來測量頸動脈壓力"], "answer": 1, "explanation": "答案：中心靜脈壓與頸靜脈壓都可反應右心房壓力\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「中心靜脈壓與頸靜脈壓都可反應右心房壓力」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「中心靜脈壓與頸靜脈壓都可反應右心房壓力」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「中心靜脈壓代表左心房與左心室壓力、頸靜脈壓代表肺動脈與肺微血管壓力」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-020", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關冠狀動脈疾病病人接受鉈-201之檢查目的，下列何者正確？", "options": ["監測僧帽瓣及主動脈瓣的功能", "觀察心室收縮及舒張的情形", "確定心肌受傷的部位與範圍", "判定心臟電氣傳導的狀態"], "answer": 2, "explanation": "答案：確定心肌受傷的部位與範圍\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「確定心肌受傷的部位與範圍」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「確定心肌受傷的部位與範圍」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「監測僧帽瓣及主動脈瓣的功能、觀察心室收縮及舒張的情形」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-021", "unit": "單元10 心臟血管系統疾病與護理1", "question": "針對經由右鼠蹊部心導管檢查後病人之護理指導，下列何者不適當？", "options": ["返回病房後應多喝開水，以利顯影劑排出", "檢查後應密切監測其心跳與血壓，觀察合併症之產生", "應指導病人多彎曲穿刺肢體，以免血栓產生", "告知病人返室，喝水後若無不適即可進食"], "answer": 2, "explanation": "答案：應指導病人多彎曲穿刺肢體，以免血栓產生\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「應指導病人多彎曲穿刺肢體，以免血栓產生」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「應指導病人多彎曲穿刺肢體，以免血栓產生」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「返回病房後應多喝開水，以利顯影劑排出、檢查後應密切監測其心跳與血壓，觀察合併症之產生」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit10-022", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何項檢查無法評估心輸出量？", "options": ["心臟超音波", "肺動脈導管", "心導管檢查", "運動心電圖"], "answer": 3, "explanation": "答案：運動心電圖\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「運動心電圖」；心導管題要注意穿刺部位出血與遠端循環\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「運動心電圖」之所以是答案，是因為它符合本題核心判斷。心導管術後需觀察穿刺處有無出血、血腫，評估遠端脈搏、膚色、溫度與感覺，並依穿刺部位維持臥床與肢體伸直。 其他選項如「心臟超音波、肺動脈導管」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：術後題先看出血、循環、疼痛與生命徵象變化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-023", "unit": "單元10 心臟血管系統疾病與護理1", "question": "王先生入院接受心導管檢查，此次檢查穿刺左側橈動脈，下列護理處置何者錯誤？", "options": ["教導病人加壓傷口至少2小時，並觀察有無出血", "檢查後，第1小時應每15分鐘測量雙手血壓，並做比較", "以6P(pain、pallor、pulselessness、poikilothermia、paralysis、paresthesia)評估病人雙手末梢，並做比較", "教導病人出院後，左手禁提重物"], "answer": 1, "explanation": "答案：檢查後，第1小時應每15分鐘測量雙手血壓，並做比較\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「檢查後，第1小時應每15分鐘測量雙手血壓，並做比較」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「檢查後，第1小時應每15分鐘測量雙手血壓，並做比較」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「教導病人加壓傷口至少2小時，並觀察有無出血、以6P(pain、pallor、pulselessness、poikilothermia、paralysis、paresthesia)評估病人雙手末梢，並做比較」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-024", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何項心臟檢查可同時測得心臟各腔室之壓力？", "options": ["動脈血管攝影 術", "心導管檢查", "心臟電氣生理檢查", "核磁共振影像"], "answer": 1, "explanation": "答案：心導管檢查\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「心導管檢查」；心導管題要注意穿刺部位出血與遠端循環\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「心導管檢查」之所以是答案，是因為它符合本題核心判斷。心導管術後需觀察穿刺處有無出血、血腫，評估遠端脈搏、膚色、溫度與感覺，並依穿刺部位維持臥床與肢體伸直。 其他選項如「動脈血管攝影 術、心臟電氣生理檢查」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：術後題先看出血、循環、疼痛與生命徵象變化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-025", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何者為正常的血液動力學檢查數值？", "options": ["肺動脈楔壓(PAWP)為25 mmHg", "心輸出量為2.5L/min", "平均動脈壓為85mmHg", "中心靜脈壓為14mmHg"], "answer": 2, "explanation": "答案：平均動脈壓為85mmHg\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「平均動脈壓為85mmHg」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「平均動脈壓為85mmHg」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「肺動脈楔壓(PAWP)為25 mmHg、心輸出量為2.5L/min」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-026", "unit": "單元10 心臟血管系統疾病與護理1", "question": "病人的血流動力學呈現心輸出量(cardiac output)下降，但肺動脈楔壓(PAWP)及全身性血管阻力(systemic vascular resistance)並無改變，下列處置何者適宜？", "options": ["降低右心房壓力", "降低心搏出量(stroke vo- lume)", "降低中央靜脈壓(CVP)", "增加心跳(heart rate)"], "answer": 3, "explanation": "答案：增加心跳(heart rate)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「增加心跳(heart rate)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「增加心跳(heart rate)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「降低右心房壓力、降低心搏出量(stroke vo- lume)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-027", "unit": "單元10 心臟血管系統疾病與護理1", "question": "下列何種病人不適合做核磁共振攝影(magnetic resonance imaging; MRI)檢查？", "options": ["接受過開顱手術的腦腫瘤病人", "使用抗凝血劑治療的腦中風病人", "有裝心臟節律器的心臟病病人", "有裝固定假牙的老年人"], "answer": 2, "explanation": "答案：有裝心臟節律器的心臟病病人\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「有裝心臟節律器的心臟病病人」；腫瘤概念題要分清良惡性、侵犯性與轉移能力\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「有裝心臟節律器的心臟病病人」之所以是答案，是因為它符合本題核心判斷。良性腫瘤多生長較慢、邊界較清楚且不轉移；惡性腫瘤常侵犯周邊組織、分化較差且可能經血液或淋巴轉移，癌細胞也常失去正常接觸抑制。 其他選項如「接受過開顱手術的腦腫瘤病人、使用抗凝血劑治療的腦中風病人」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：腫瘤題常考「侵犯、轉移、分化差、接觸抑制消失」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit10-028", "unit": "單元10 心臟血管系統疾病與護理1", "question": "病人主訴常有心悸的感覺，心尖脈速率98次/分鐘，節律不規則，橈動脈脈搏次數為80次/分鐘。下列何者為其最可能之診斷？", "options": ["心房纖維性顫動", "心室纖維性顫動", "心房撲動", "陣發性上心室性心搏過速"], "answer": 0, "explanation": "答案：心房纖維性顫動\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「心房纖維性顫動」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「心房纖維性顫動」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「心室纖維性顫動、心房撲動」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-029", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心律不整藥物之敘述，下列何者正確？", "options": ["Phenytoin(Dilantin)可用於治療毛地黃中毒引起之心律不整", "Lidocaine(Xylocaine)為鉀離子通道阻斷劑，須注意高血鉀問題", "心房早期收縮(APC)可使用鈣離子阻斷劑治療，但須注意低血壓問題", "Amiodarone(Cordarone)為鈉離子通道阻斷劑，可延緩心肌去極化時間"], "answer": 0, "explanation": "答案：Phenytoin(Dilantin)可用於治療毛地黃中毒引起之心律不整\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「Phenytoin(Dilantin)可用於治療毛地黃中毒引起之心律不整」；Digoxin 題要連到心尖脈、心搏過慢、血鉀與中毒症狀\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「Phenytoin(Dilantin)可用於治療毛地黃中毒引起之心律不整」之所以是答案，是因為它符合本題核心判斷。給 Digoxin 前需評估心尖脈，若心搏過慢要暫緩並通知醫師；低血鉀會增加毒性風險，噁心、嘔吐、視覺異常與心律不整都是警訊。 其他選項如「Lidocaine(Xylocaine)為鉀離子通道阻斷劑，須注意高血鉀問題、心房早期收縮(APC)可使用鈣離子阻斷劑治療，但須注意低血壓問題」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：記住 Digoxin：先量心尖脈，再看鉀離子與中毒表現。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-030", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心律不整的敘述，下列何者錯誤？", "options": ["心房纖維顫動(Af)容易產生血栓，可以使用 Heparin 來預防", "陣發性心室心搏過速(PSVT)可以使用按摩頸動脈竇的方式來使心律恢復正常", "竇性心搏過慢(sinus bradycardia)常見於運動員，不需要治療", "1°房室傳導阻斷(1°AV block)，通常不會出現症狀，不需要治療"], "answer": 0, "explanation": "答案：心房纖維顫動(Af)容易產生血栓，可以使用 Heparin 來預防\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「心房纖維顫動(Af)容易產生血栓，可以使用 Heparin 來預防」；Heparin 題要抓 aPTT 監測與拮抗劑\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「心房纖維顫動(Af)容易產生血栓，可以使用 Heparin 來預防」之所以是答案，是因為它符合本題核心判斷。Heparin 常以 aPTT 監測抗凝效果，主要風險是出血；發生嚴重出血時常用 protamine sulfate 作為拮抗劑。 其他選項如「陣發性心室心搏過速(PSVT)可以使用按摩頸動脈竇的方式來使心律恢復正常、竇性心搏過慢(sinus bradycardia)常見於運動員，不需要治療」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：抗凝藥題先分清楚：Heparin 看 aPTT，Warfarin 看 PT/INR。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-031", "unit": "單元10 心臟血管系統疾病與護理1", "question": "針對心房纖維顫動病人使用warfarin(Coumadin)之目的，下列何者正確？", "options": ["抑制心跳次數", "抑制血栓生成", "改善心悸症狀", "使心跳恢復規則"], "answer": 1, "explanation": "答案：抑制血栓生成\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「抑制血栓生成」；Warfarin 題要抓凝血監測與出血安全\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「抑制血栓生成」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「抑制心跳次數、改善心悸症狀」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit10-032", "unit": "單元10 心臟血管系統疾病與護理1", "question": "有關心房纖維顫動病人服用Warfarin之護理指導，下列何者錯誤？", "options": ["拔牙前，須告知醫師目前使用Warfarin治療心律不整", "避免食用深綠色食物，以免降低藥效", "避免補充黑木耳、銀杏等食品，以免增強藥效", "若忘記服藥，需於次日服用雙倍劑量，以維持藥物濃度"], "answer": 3, "explanation": "答案：若忘記服藥，需於次日服用雙倍劑量，以維持藥物濃度\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「若忘記服藥，需於次日服用雙倍劑量，以維持藥物濃度」；Warfarin 題要抓凝血監測與出血安全\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「若忘記服藥，需於次日服用雙倍劑量，以維持藥物濃度」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「拔牙前，須告知醫師目前使用Warfarin治療心律不整、避免食用深綠色食物，以免降低藥效」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit10-033", "unit": "單元10 心臟血管系統疾病與護理1"
