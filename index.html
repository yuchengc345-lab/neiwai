<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>內外護理刷題</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: rgba(255, 255, 255, 0.9);
      --line: #d5dde8;
      --text: #18324d;
      --muted: #6d7f95;
      --blue: #4b86d4;
      --green: #37a86e;
      --red: #dc6e64;
      --note: #fff8de;
      --shadow: 0 14px 32px rgba(24, 50, 77, 0.09);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(75, 134, 212, 0.18), transparent 30%),
        linear-gradient(180deg, #f8f4ee 0%, #edf4fb 100%);
      min-height: 100vh;
    }
    .shell {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 16px 16px 36px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .unit-selection {
      padding: 18px;
    }
    .selection-title {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
    }
    .selection-subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }
    .unit-list {
      display: grid;
      gap: 12px;
    }
    .unit-card {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      box-shadow: 0 5px 14px rgba(24, 50, 77, 0.04);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .unit-card:active {
      transform: scale(0.985);
    }
    .unit-card-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
    }
    .unit-card-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    .back-row {
      margin-bottom: 12px;
    }
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.82);
      color: var(--blue);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(24, 50, 77, 0.06);
    }
    .progress-panel {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 16px;
    }
    .meta-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }
    .unit-label {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--blue);
    }
    .progress-copy {
      margin-top: 8px;
      font-size: 19px;
      font-weight: 800;
    }
    .scoreboard {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    .progress-bar {
      margin-top: 12px;
      height: 10px;
      background: #dfe8f2;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #5c98df, #37a86e);
      transition: width 0.18s ease;
    }
    .question-panel {
      margin-top: 16px;
      padding: 18px;
    }
    .question-text {
      margin: 0;
      line-height: 1.7;
      font-size: 20px;
    }
    .options {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .option {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      font-size: 16px;
      line-height: 1.6;
      box-shadow: 0 5px 14px rgba(24, 50, 77, 0.04);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .option:active {
      transform: scale(0.985);
    }
    .option.correct {
      background: #e8f7ee;
      border-color: var(--green);
      color: #155638;
    }
    .option.wrong {
      background: #fdeceb;
      border-color: var(--red);
      color: #8b2d28;
    }
    .option:disabled {
      opacity: 1;
    }
    .explanation {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid #f0dd9c;
      background: var(--note);
      line-height: 1.75;
    }
    .explanation.show {
      display: block;
    }
    .explanation-title {
      font-weight: 800;
    }
    .explanation-text {
      margin: 8px 0 0;
      white-space: pre-line;
    }
    .next-button {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 17px;
      font-weight: 800;
      color: #f8fbff;
      background: #b9cade;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .next-button.enabled {
      background: linear-gradient(135deg, #4c88d6, #2f6ec7);
    }
    .next-button:active {
      transform: scale(0.99);
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="unit-selection" class="panel unit-selection">
      <h1 class="selection-title">選擇單元開始刷題</h1>
      <p class="selection-subtitle">先選一個單元，再進入該單元的練習模式。</p>
      <div id="unit-list" class="unit-list"></div>
    </section>

    <section id="quiz-screen" hidden>
      <div class="back-row">
        <button id="back-to-units" class="back-button" type="button">重選單元</button>
      </div>

      <section class="panel progress-panel">
        <div class="meta-top">
          <span>護理刷題</span>
          <span id="session-status">本輪進行中</span>
        </div>
        <div id="unit-label" class="unit-label"></div>
        <div class="progress-copy">第 <span id="current-number">1</span> / <span id="total-number">1</span> 題</div>
        <div class="scoreboard">答對 <span id="correct-count">0</span> · 錯題 <span id="wrong-count">0</span></div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </section>

      <section class="panel question-panel">
        <h1 id="question-text" class="question-text"></h1>
        <div id="options" class="options"></div>
        <section id="explanation" class="explanation">
          <div class="explanation-title">解析</div>
          <p id="explanation-text" class="explanation-text"></p>
        </section>
        <button id="next-button" class="next-button" disabled>下一題</button>
      </section>
    </section>
  </main>
  <script>
    const questions = [{"id": "unit5-001", "unit": "單元5 腫瘤疾病與護理", "question": "有關良性腫瘤及惡性腫瘤之敘述，下列何者正確？", "options": ["惡性腫瘤因沒有包膜，手術治療成效佳", "不管良性或惡性腫瘤，細胞排列皆不規則", "良性腫瘤以浸潤方式侵入周圍組織", "良性腫瘤若生長於密閉空間，會阻塞管腔產生各種症狀"], "answer": 3, "explanation": "答案：良性腫瘤若生長於密閉空間，會阻塞管腔產生各種症狀\n解析：良性腫瘤若生長於密閉空間，仍會阻塞管腔產生各種症狀；惡性腫瘤多無包膜且以浸潤方式生長"}, {"id": "unit5-002", "unit": "單元5 腫瘤疾病與護理", "question": "有關惡性腫瘤特徵的敘述，下列何者正確？①細胞通常分化不良②腫瘤通常有被膜包覆③生長速度通常很迅速④易轉移易復發：", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": 2, "explanation": "答案：①③④\n解析：惡性腫瘤通常無被膜包覆（②錯誤），其特徵為細胞分化不良、生長速度迅速且易轉移與復發"}, {"id": "unit5-003", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌細胞特性之敘述，下列何者錯誤？", "options": ["細胞上的P53基因容易受損而抑制細胞修復", "生長所需的養分比正常細胞少", "在生長時，會有接觸抑制(contact inhibition)作用", "細胞的有絲分裂指數(mito-tic index)高，增殖快"], "answer": 2, "explanation": "答案：在生長時，會有接觸抑制(contact inhibition)作用\n解析：癌細胞缺乏「接觸抑制（contact inhibition）」作用，因此會不受控地持續增生並堆疊"}, {"id": "unit5-004", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌細胞轉移之敘述，下列何者錯誤？", "options": ["轉移是指癌細胞從原發部位擴散至身體其他組織器官", "惡性肉瘤(sarcoma)常以淋巴轉移方式轉移到其他部位", "常見轉移方式為淋巴轉移、血流轉移及體腔內播種式生長", "肺、肝及骨骼為原發性癌症常見轉移部位"], "answer": 1, "explanation": "答案：惡性肉瘤(sarcoma)常以淋巴轉移方式轉移到其他部位\n解析：惡性肉瘤（sarcoma）常以「血流轉移」方式擴散到其他部位；癌（carcinoma）才較常以淋巴轉移"}, {"id": "unit5-005", "unit": "單元5 腫瘤疾病與護理", "question": "下列腫瘤何者源自結締組織？", "options": ["滑液膜肉瘤(synovial-sarcoma)", "軟骨肉瘤(chondrosarcoma)", "血管肉瘤(angiosarcoma)", "淋巴管肉瘤(lymphangiosarcoma)"], "answer": 1, "explanation": "答案：軟骨肉瘤(chondrosarcoma)\n解析：依據組織學分類，軟骨及硬骨屬於結締組織，因此軟骨肉瘤（chondrosarcoma）源自結締組織"}, {"id": "unit5-006", "unit": "單元5 腫瘤疾病與護理", "question": "有關病毒感染與罹患癌症相關性之敘述，下列何者錯誤？", "options": ["A型肝炎病毒導致肝癌", "EB病毒導致鼻咽癌", "巨細胞病毒導致子宮頸癌", "幽門螺旋桿菌導致胃癌"], "answer": 0, "explanation": "答案：A型肝炎病毒導致肝癌\n解析：A型肝炎病毒通常不會導致肝癌，B型與C型肝炎病毒才是引發肝癌的主要危險因子"}, {"id": "unit5-007", "unit": "單元5 腫瘤疾病與護理", "question": "周女士，52歲，本身有高血壓及乳癌家族史，有抽菸，在一次回診時表示自己年紀越來越大，很擔心會跟媽媽一樣罹癌，下列建議何者錯誤？", "options": ["不用過度擔心，若自覺乳房有異狀再做乳房攝影", "鼓勵戒菸、轉介戒菸門診", "將運動融入生活，可以走樓梯代替搭電梯等", "適度日曬，促進維生素D合成"], "answer": 0, "explanation": "答案：不用過度擔心，若自覺乳房有異狀再做乳房攝影\n解析：本身具有乳癌家族史為罹癌高危險群，應定期接受乳房攝影篩檢，而非「自覺有異狀才做」"}, {"id": "unit5-008", "unit": "單元5 腫瘤疾病與護理", "question": "王先生，67歲，體重90公斤，BMI：30 kg/m2，平時菸酒不離手且愛吃醃漬食品，下列護理措施何者不適宜？", "options": ["飲食可不用限制", "轉介減重門診", "建議增加蔬菜水果攝取，每天至少攝取5份", "轉介院內戒菸門診"], "answer": 0, "explanation": "答案：飲食可不用限制\n解析：此個案體重過重且有菸酒習慣、愛吃醃漬食品，為癌症高危險群，必須嚴格限制不良飲食並增加蔬果攝取"}, {"id": "unit5-009", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症危險因子的敘述，下列何者錯誤？", "options": ["吃檳榔會增加口腔癌的發生率", "荷爾蒙治療會增加子宮內膜癌的發生率", "長期接觸甲醛會增加大腸癌的發生率", "長期吸入石綿會增加肺癌的發生率"], "answer": 2, "explanation": "答案：長期接觸甲醛會增加大腸癌的發生率\n解析：長期接觸甲醛與鼻咽癌及白血病有關。長期攝取低纖維或精緻飲食才是增加大腸癌發生率的主因"}, {"id": "unit5-010", "unit": "單元5 腫瘤疾病與護理", "question": "下列何者為避免結腸癌的保護因子？①鼓勵食用紅肉②不需限制油脂的攝取③維持適當的體重④維持規律運動⑤補充適當的纖維攝取：", "options": ["①③⑤", "②③④", "②④⑤", "③④⑤"], "answer": 3, "explanation": "答案：③④⑤\n解析：避免結腸癌的保護因子包括維持適當體重、規律運動及補充適當纖維。①應減少紅肉攝取，②應限制油脂"}, {"id": "unit5-011", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症初級預防之敘述，下列何者錯誤？", "options": ["避免隨便服藥、減少菸酒", "均衡飲食，多吃新鮮蔬菜、水果", "養成規律運動習慣", "定期接受身體檢查"], "answer": 3, "explanation": "答案：定期接受身體檢查\n解析：定期接受身體檢查（強調早期發現、早期治療）屬於「次級預防」，而非初級預防（去除致病因子以預防疾病發生）"}, {"id": "unit5-012", "unit": "單元5 腫瘤疾病與護理", "question": "長期攝取低纖維或精緻飲食，可能與下列何種癌症的發生最有關？", "options": ["胃癌", "肝癌", "大腸癌", "乳癌"], "answer": 2, "explanation": "答案：大腸癌\n解析：長期攝取低纖維或精緻飲食會使致癌物在腸道停留時間增加，最容易誘發大腸癌"}, {"id": "unit5-013", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症與腫瘤標記間的關係，下列何者較具顯著性？①肝癌-CEA②前列腺癌-PSA③乳癌-AFB④鼻咽癌-EBV：", "options": ["①②", "②③", "②④", "③④"], "answer": 2, "explanation": "答案：②④\n解析：正確的腫瘤標記配對為②前列腺癌-PSA及④鼻咽癌-EBV。肝癌應為AFP，乳癌常檢測CA15-3"}, {"id": "unit5-014", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症常見的腫瘤標記之敘述，下列何者錯誤？", "options": ["CA19-9為乳癌的腫瘤標記", "CA125為卵巢癌的腫瘤標記", "AFP為肝癌的腫瘤標記", "CEA為大腸直腸癌的腫瘤標記"], "answer": 0, "explanation": "答案：CA19-9為乳癌的腫瘤標記\n解析：CA19-9主要為胰臟癌及消化道腫瘤標記，乳癌的腫瘤標記為CA15-3"}, {"id": "unit5-015", "unit": "單元5 腫瘤疾病與護理", "question": "有關常見腫瘤標記的應用，下列何者正確？①癌胚抗原(CEA)可監測結腸直腸癌治療效果②癌抗原125(CA125)可監測胰臟癌與消化道腫瘤③前列腺特異抗原(PSA)為前列腺癌的偵測與治療指標④癌抗原15-3(CA15-3)可監測晚期或合併遠端轉移乳癌之治療反應⑤α-胎兒蛋白(AFP)為監測肺癌治療後的指標：", "options": ["①②⑤", "①③④", "②③④", "②③⑤"], "answer": 1, "explanation": "答案：①③④\n解析：正確應用為①CEA測結腸直腸癌、③PSA測前列腺癌、④CA15-3測乳癌。②CA125為卵巢癌指標，⑤AFP為肝癌指標"}, {"id": "unit5-016", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症診斷檢查之敘述，下列何者錯誤？", "options": ["自組織中刮取而得，所做之細胞學檢查是確立癌症診斷最有效的方法", "血糖過高之糖尿病病人接受正子掃描檢查，易造成偽陽性結果", "裝有心臟節律器的病人不能接受核磁共振攝影檢查", "接受需注射顯影劑的胸部電腦斷層檢查者，在檢查前數小時需禁食"], "answer": 0, "explanation": "答案：自組織中刮取而得，所做之細胞學檢查是確立癌症診斷最有效的方法\n解析：確立癌症診斷最有效且確定的方法是「組織病理學檢查（活體組織切片）」，單純細胞學檢查有其侷限，非唯一或最有效"}, {"id": "unit5-017", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症病人臨床實驗室檢查結果之敘述，下列何者正確？", "options": ["白血球數目一定是低於正常值", "骨骼轉移，常出現高血鈣情形", "化學治療破壞細胞，會使尿酸降低", "腫瘤指標可作為診斷的依據"], "answer": 1, "explanation": "答案：骨骼轉移，常出現高血鈣情形\n解析：癌症發生骨骼轉移時，骨質破壞會將鈣離子釋放入血，臨床上極常出現高血鈣情形"}, {"id": "unit5-018", "unit": "單元5 腫瘤疾病與護理", "question": "下列何種檢查沒有輻射危害？", "options": ["骨掃描", "電腦斷層", "正子掃描", "核磁共振攝影"], "answer": 3, "explanation": "答案：核磁共振攝影\n解析：核磁共振攝影（MRI）是利用強磁場與無線電波成像，沒有游離輻射的危害"}, {"id": "unit5-019", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症手術治療特性之敘述，下列何者正確？", "options": ["冷凍手術是一種診斷疾病分期的手術", "手術治療是切除原發癌或已轉移的固態實質腫瘤", "手術適用於細胞分化差、生長快速且局部的腫瘤", "雷射手術優點是切除腫瘤組織，但會增加手術出血的危險"], "answer": 1, "explanation": "答案：手術治療是切除原發癌或已轉移的固態實質腫瘤\n解析：手術治療癌症的主要目的，是為了切除原發癌或已轉移的固態實質腫瘤"}, {"id": "unit5-020", "unit": "單元5 腫瘤疾病與護理", "question": "有關原發性癌症最常轉移的部位，下列何者較少發生？", "options": ["肝", "腎", "腦", "骨骼"], "answer": 1, "explanation": "答案：腎\n解析：原發性癌症最常見的轉移部位為肺、肝、腦與骨骼，腎臟相對較少作為首發轉移部位"}, {"id": "unit5-021", "unit": "單元5 腫瘤疾病與護理", "question": "有關TNM分類系統之敘述，下列何者錯誤？", "options": ["TIS代表原位癌", "NX代表臨床上無法評估局部淋巴結", "M1代表遠端轉移有固定部位", "G4代表癌症細胞分化良好"], "answer": 3, "explanation": "答案：G4代表癌症細胞分化良好\n解析：在TNM分級系統中，G4代表癌症細胞「分化極差（分化不良）」，惡性度最高，而非分化良好"}, {"id": "unit5-022", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症分期系統類型之敘述，下列何者錯誤？", "options": ["治療前的臨床分期，可以cTNM表示", "手術後切除病理組織做的分期，可以sTNM表示", "復發或再次治療，可以rTNM表示", "治療後分期，可用ycTNM表示"], "answer": 1, "explanation": "答案：手術後切除病理組織做的分期，可以sTNM表示\n解析：手術後切除病理組織做出的準確分期，屬於病理分期，應以「pTNM」表示，而非sTNM"}, {"id": "unit5-023", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症治療的敘述，下列何者正確？", "options": ["採取單一治療方式效果最好", "疾病分期是治療方式的唯一考量", "姑息性治療以減輕症狀為考量", "控制癌症的治療目標是將腫瘤完全切除"], "answer": 2, "explanation": "答案：姑息性治療以減輕症狀為考量\n解析：姑息性（緩解性）治療的主要考量是減輕病人痛苦與症狀，以提升生活品質，而非追求完全治癒"}, {"id": "unit5-024", "unit": "單元5 腫瘤疾病與護理", "question": "下列何種細胞的分裂速度最慢？", "options": ["神經元細胞", "骨髓幹細胞", "毛囊上皮細胞", "生殖細胞"], "answer": 0, "explanation": "答案：神經元細胞\n解析：神經元細胞幾乎不進行細胞分裂（分裂速度最慢），因此對攻擊快速分裂細胞的化學治療較不敏感，副作用較小"}, {"id": "unit5-025", "unit": "單元5 腫瘤疾病與護理", "question": "化學治療經常是利用癌細胞不易進入細胞週期中的那一時期，以達到毒殺癌細胞的目的？", "options": ["G0休止期", "G1準備/合成前期", "G2合成後期", "S合成期"], "answer": 0, "explanation": "答案：G0休止期\n解析：化療藥物多針對處於分裂週期中的細胞產生毒殺作用。G0期為休止期，細胞不分裂，化療對其毒殺效果最差"}, {"id": "unit5-026", "unit": "單元5 腫瘤疾病與護理", "question": "長春花鹼類(vinca alkaloids)藥物，如vincristine，主要作用於細胞週期的那一期？", "options": ["M期", "G1期", "S期", "G2期"], "answer": 0, "explanation": "答案：M期\n解析：長春花鹼類藥物（如Vincristine）的作用機制主要是干擾細胞有絲分裂紡錘體的形成，因此專一作用於M期"}, {"id": "unit5-027", "unit": "單元5 腫瘤疾病與護理", "question": "病人接受doxorubicin(Adriamycin®)注射時，發現點滴不順、針頭附近有微發紅及刺痛情形，下列處置何者不適當？", "options": ["可能為熱反應，注射後給予0.9% N/S及dexamethasone", "懷疑是藥物外滲時，停止注射以原針頭回抽藥物", "墊高注射部位且局部避免加壓", "評估為藥物外滲則可給予溫熱敷"], "answer": 3, "explanation": "答案：評估為藥物外滲則可給予溫熱敷\n解析：Doxorubicin屬於起泡性藥物，發生外滲時應給予「冷敷」以減少組織吸收及藥物擴散，不可溫熱敷"}, {"id": "unit5-028", "unit": "單元5 腫瘤疾病與護理", "question": "有關化學藥物cyclophosphamide(Cytoxan)的副作用或毒性，不包括下列何者？", "options": ["出血性膀胱炎", "骨髓抑制", "心臟毒性", "畏光"], "answer": 3, "explanation": "答案：畏光\n解析：Cyclophosphamide常見的毒性包括出血性膀胱炎、心臟毒性與骨髓抑制，畏光並非其副作用"}, {"id": "unit5-029", "unit": "單元5 腫瘤疾病與護理", "question": "化學治療最常見的副作用，下列何者正確？①便秘②白血球增加③紅血球減少④口腔黏膜破損⑤掉頭髮：", "options": ["①②⑤", "①③④", "②④⑤", "③④⑤"], "answer": 3, "explanation": "答案：③④⑤\n解析：化療會抑制骨髓及攻擊快速生長細胞，常見副作用為③紅血球減少(貧血)④口腔黏膜破損⑤掉頭髮。①因藥而異，②應為白血球減少"}, {"id": "unit5-030", "unit": "單元5 腫瘤疾病與護理", "question": "有關化學治療藥物作用機轉與副作用之敘述，下列何者錯誤？", "options": ["Cisplatin屬烴基化合物，常見副作用是噁心嘔吐、耳毒性和周邊神經病變等", "Fluorouracil(5-FU)屬抗代謝藥物，常見副作用是口腔炎、骨髓抑制等", "Doxorubicin屬類固醇藥物，可促進G0期癌細胞進入分裂期", "Vincristine屬植物鹼類藥物，作用於M期，干擾有絲分裂"], "answer": 2, "explanation": "答案：Doxorubicin屬類固醇藥物，可促進G0期癌細胞進入分裂期\n解析：Doxorubicin屬於抗腫瘤抗生素，無法促使G0期休止期的癌細胞進入分裂期"}, {"id": "unit5-031", "unit": "單元5 腫瘤疾病與護理", "question": "接受同步化學放射治療(CCRT)的病人，其抽血報告顯示 WBC 3000/μL、seg 20%、band 5%、monocyte 12%、Hb 10.5 g/dL、platelet 50000/μL，下列敘述何者錯誤？", "options": ["發燒時避免使用NSAID退燒", "轉至負壓式單人病房保護隔離", "避免攝食未妥善處理之生鮮蔬果", "注射G-CSF以提升嗜中性白血球數"], "answer": 1, "explanation": "答案：轉至負壓式單人病房保護隔離\n解析：病人白血球過低免疫力低下時，應安排住進「正壓」單人病房保護隔離，而非防範傳染病擴散用的負壓病房"}, {"id": "unit5-032", "unit": "單元5 腫瘤疾病與護理", "question": "型肝炎帶原者接受化學治療時之護理指導，下列何者錯誤？", "options": ["可以採用親朋好友所提供的保肝偏方", "出入公共場所儘量戴口罩", "若白血球數目太低，可多吃剝皮的水果補充維生素", "若皮膚或眼白變黃、食慾變差，則趕快就醫"], "answer": 0, "explanation": "答案：可以採用親朋好友所提供的保肝偏方\n解析：B型肝炎帶原者接受化療極易引發病毒活化及猛爆性肝炎，絕不可隨意採用來路不明的保肝偏方加重肝負擔"}, {"id": "unit5-033", "unit": "單元5 腫瘤疾病與護理", "question": "有關化學治療的適應症，下列何者正確？", "options": ["急性淋巴性白血病合併肺炎", "何杰金氏病合併肝功能不良", "多發性骨髓瘤合併腎功能不良", "惡性淋巴瘤第Ⅱ、Ⅲ期"], "answer": 3, "explanation": "答案：惡性淋巴瘤第Ⅱ、Ⅲ期\n解析：惡性淋巴瘤第Ⅱ、Ⅲ期是化學治療的適應症。若合併嚴重感染或嚴重肝腎衰竭，通常為化療禁忌症"}, {"id": "unit5-034", "unit": "單元5 腫瘤疾病與護理", "question": "有關化學治療靜脈給藥之敘述，下列何者正確？", "options": ["Port-A最常植入的位置是上腔靜脈", "植入Port-A時，通常採用全身麻醉", "選擇注射部位時，建議先從近心端，再選擇遠心端", "靜脈注射之血管，選擇直徑大、有彈性的為原則"], "answer": 3, "explanation": "答案：靜脈注射之血管，選擇直徑大、有彈性的為原則\n解析：靜脈注射化療藥物時應選擇直徑大、有彈性的血管。Port-A最常植入鎖骨下靜脈，且常採局部麻醉"}, {"id": "unit5-035", "unit": "單元5 腫瘤疾病與護理", "question": "以高劑量合併多種藥物的化學治療方式，是指下列何種化學治療？", "options": ["誘導性", "增強性", "輔助性", "救援性"], "answer": 0, "explanation": "答案：誘導性\n解析：誘導性（Induction）化學治療是指初期即使用高劑量合併多種藥物，期望達到腫瘤最大幅度的縮減或緩解"}, {"id": "unit5-036", "unit": "單元5 腫瘤疾病與護理", "question": "有關準備化學治療藥劑的注意事項，下列何者錯誤？", "options": ["配藥區限制他人接近，最好用垂直型層流操作櫃來調配藥物，保護工作人員及藥品本身", "戴上聚氯乙烯(PVC)手套，穿長袖隔離衣，戴口罩、帽子、護目鏡，並以無菌技術來操作", "抽取vial內藥物時，須保持瓶內呈正壓，以避免藥液濺出", "抽取藥物時勿讓藥液量達針筒的3/4 以上，以避免針筒因觸碰脫落造成污染"], "answer": 2, "explanation": "答案：抽取vial內藥物時，須保持瓶內呈正壓，以避免藥液濺出\n解析：抽取藥瓶（vial）內化療藥物時，須保持瓶內呈「負壓」，避免拔針時藥液因正壓向外噴濺造成暴露污染"}, {"id": "unit5-037", "unit": "單元5 腫瘤疾病與護理", "question": "有關化學藥物發生滲漏之處置，下列何者正確？", "options": ["迅速停止化學藥物注射，且拔除針頭", "由原針頭處回抽，以除去殘留藥液", "依醫囑以18號針頭注射解毒劑", "Vincristine滲漏時，應冰敷外滲部位"], "answer": 1, "explanation": "答案：由原針頭處回抽，以除去殘留藥液\n解析：發現化療藥物發生滲漏時，應迅速停止注射，且「不可」立即拔除針頭，必須先由原針頭處盡量回抽殘留藥液"}, {"id": "unit5-038", "unit": "單元5 腫瘤疾病與護理", "question": "當癌症病人出現下列何種血液檢驗數據時，要考慮停止化學治療？①白血球1,500/μL②紅血球500萬/μL③血小板11萬/μL④絕對嗜中性球1,000/μL：", "options": ["①②", "①④", "②③", "③④"], "answer": 1, "explanation": "答案：①④\n解析：當白血球低於1500/μL（①）或絕對嗜中性球（ANC）低於1000/μL（④）時，感染風險極高，需考慮暫停化療"}, {"id": "unit5-039", "unit": "單元5 腫瘤疾病與護理", "question": "病人於化學治療後抽血報告顯示WBC 3,000/μL、Platelet30,000/μL、Hb 12g/dL，下列照護措施何者最適宜？", "options": ["給予非類固醇抗發炎藥物治療發燒、疼痛", "建議病人使用電動牙刷徹底清潔口腔", "給予甘油灌腸避免便秘而閉氣用力", "天冷時鼻黏膜塗擦凡士林保濕"], "answer": 3, "explanation": "答案：天冷時鼻黏膜塗擦凡士林保濕\n解析：血小板僅30,000/μL極易出血。天冷時於鼻黏膜塗擦凡士林可防出血；應避免使用NSAID退燒及甘油灌腸用力"}, {"id": "unit5-040", "unit": "單元5 腫瘤疾病與護理", "question": "一位正接受化學治療合併放射線治療的頭頸癌病人，檢驗結果：白血球1,900/μL、血紅素10.8g/dL、血小板99,000/μL，下列那些臨床表徵會對病人造成最嚴重之影響？", "options": ["咳嗽、流鼻水、喉嚨痛", "疲憊、噁心、放射部位皮膚發紅", "體溫39℃、疲憊、呼吸喘", "放射部位皮膚發紅、頭痛、便秘"], "answer": 2, "explanation": "答案：體溫39℃、疲憊、呼吸喘\n解析：病人白血球極低（1,900/μL）又出現高燒（體溫39℃）且呼吸喘，顯示可能發生嚴重的敗血症，最為致命"}, {"id": "unit5-041", "unit": "單元5 腫瘤疾病與護理", "question": "接受化學治療後的病人出現白血球減少及貧血之原因，下列何者正確？", "options": ["脾臟細胞破壞", "肝細胞損傷", "腎細胞損傷", "骨髓功能受抑制"], "answer": 3, "explanation": "答案：骨髓功能受抑制\n解析：化學治療的藥物會嚴重抑制骨髓的造血功能，進而導致白血球減少（易感染）及紅血球減少（貧血）"}, {"id": "unit5-042", "unit": "單元5 腫瘤疾病與護理", "question": "有關病人使用cisplatin(Platinol)的護理措施，下列何者錯誤？", "options": ["建議少量多餐", "觀察小便性質及顏色", "評估病人的聽力", "避免投予鎂離子製劑"], "answer": 3, "explanation": "答案：避免投予鎂離子製劑\n解析：Cisplatin具有腎毒性，常導致低血鎂症，因此臨床上需密切監測並可能需要補充鎂離子，而非避免投予"}, {"id": "unit5-043", "unit": "單元5 腫瘤疾病與護理", "question": "針對中樞神經系統腫瘤化學治療之給藥方式，下列何者正確？①靜脈②Port-A③腰椎穿刺④Ommaya藥物儲存槽：", "options": ["①②", "①③", "②④", "③④"], "answer": 3, "explanation": "答案：③④\n解析：中樞神經系統有血腦屏障，常規靜脈注射藥物難以進入，故常經由③腰椎穿刺（Intrathecal）或④Ommaya藥物儲存槽直接給藥"}, {"id": "unit5-044", "unit": "單元5 腫瘤疾病與護理", "question": "下列何者不屬於分裂快速細胞，故在化學治療時的副作用較小？", "options": ["骨髓", "頭髮毛囊", "神經細胞", "腸胃道黏膜"], "answer": 2, "explanation": "答案：神經細胞\n解析：神經細胞幾乎不再進行細胞分裂，故針對快速分裂細胞的化學治療對其造成的傷害與副作用相對較小"}, {"id": "unit5-045", "unit": "單元5 腫瘤疾病與護理", "question": "下列何種化學藥物外滲時，會使組織產生水疱、壞死的現象？", "options": ["Ifos-famide", "Methotrexate", "Bleomycin", "Vincristine"], "answer": 3, "explanation": "答案：Vincristine\n解析：Vincristine屬於強烈起泡性化療藥物，一旦發生外滲會嚴重破壞周邊組織，產生水疱及組織壞死現象"}, {"id": "unit5-046", "unit": "單元5 腫瘤疾病與護理", "question": "王小姐罹患乳癌第4期，醫生建議放射線合併化學治療，此種放射線治療是屬於何種治療方式？", "options": ["根除性", "輔助性", "誘導性", "預防性"], "answer": 1, "explanation": "答案：輔助性\n解析：手術或主治療後，為消滅可能殘存的微小轉移病灶而進行的放射線/化學治療，稱為「輔助性（Adjuvant）」治療"}, {"id": "unit5-047", "unit": "單元5 腫瘤疾病與護理", "question": "有關化學治療特性的敘述，下列何者正確？", "options": ["使用具細胞毒性藥物來縮小腫瘤或控制症狀", "化學治療藥物大多可以通過血腦屏障", "使用多種不同抗癌藥物來增加療效，但副作用也會增加", "目前治療方式多採高劑量、較無毒性，減少次數、增加休息時間方式進行"], "answer": 0, "explanation": "答案：使用具細胞毒性藥物來縮小腫瘤或控制症狀\n解析：化學治療的核心是利用具細胞毒性的化學藥物來毒殺癌細胞，以達到縮小腫瘤或控制症狀的目的"}, {"id": "unit5-048", "unit": "單元5 腫瘤疾病與護理", "question": "有關靜脈導管Port-A之敘述，下列何者正確？①放置Port-A人工血管，須採全身麻醉方式②Port-A導管可由腋靜脈放置到鎖骨下靜脈③注射起泡性藥物時，應測試是否有回血④注射藥物時，使用一般空針90度插入，以免發生外滲：", "options": ["①③", "①④", "②③", "②④"], "answer": 2, "explanation": "答案：②③\n解析：放置Port-A採局部麻醉（①錯）；打藥時需使用特殊無損傷針（Huber needle）以90度角插入（④錯）。②③正確"}, {"id": "unit5-049", "unit": "單元5 腫瘤疾病與護理", "question": "有關放射線治療癌症之敘述，下列何者正確？", "options": ["放射線強度與距離的平方成反比，距離放射源越遠暴露量越少", "要採集中式護理，穿隔離衣以減少放射線的暴露量", "封閉式體內放射線治療病人的排泄物具大量放射性，倒入馬桶需多沖水", "非封閉式體內放射線治療在移除植入器後，病人身上就不具放射性"], "answer": 0, "explanation": "答案：放射線強度與距離的平方成反比，距離放射源越遠暴露量越少\n解析：輻射暴露量與距離平方成反比。非封閉式體內放療排泄物具放射性；封閉式治療移除植入器後即無放射性"}, {"id": "unit5-050", "unit": "單元5 腫瘤疾病與護理", "question": "罹患腦下垂體腫瘤病人，醫師建議使用伽馬刀療法，下列何者顯示病人已了解本項治療？", "options": ["治療時我的頭部會有一個切開傷口", "治療時我不會疼痛也不會流血", "治療後我的頭部會有留一條小型引流管", "治療後我的腦瘤會立即消失"], "answer": 1, "explanation": "答案：治療時我不會疼痛也不會流血\n解析：伽馬刀是一種精密的立體定位放射線治療，不需傳統開顱手術，因此治療時不會疼痛、不會流血也無傷口"}, {"id": "unit5-051", "unit": "單元5 腫瘤疾病與護理", "question": "有關化學藥物發生滲漏的敘述，下列何者正確？", "options": ["化學藥物滲漏時，都會有疼痛和紅腫的現象", "發生化學藥物滲漏，須立即停止注射藥物，並拔除針頭", "植物鹼類化學藥物發生滲漏時，應溫熱敷外滲部位", "加壓滲漏部位，並抬高患肢以減輕腫脹"], "answer": 2, "explanation": "答案：植物鹼類化學藥物發生滲漏時，應溫熱敷外滲部位\n解析：植物鹼類藥物（如Vincristine）發生外滲時，應給予溫熱敷；外滲時應先回抽藥液，絕不可加壓或立即拔針"}, {"id": "unit5-052", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症化學治療藥物毒性之敘述，下列何者錯誤？", "options": ["MTX會引起神經性毒性", "Ara-C會引起肺毒性", "Adriamycin會引起心肌毒性", "6-MP會引起腎毒性"], "answer": 3, "explanation": "答案：6-MP會引起腎毒性\n解析：6-MP主要是引起骨髓抑制與肝毒性，較少引起腎毒性。Adriamycin引發心毒性，MTX引發神經毒性為真"}, {"id": "unit5-053", "unit": "單元5 腫瘤疾病與護理", "question": "病人接受Adriamycin化學治療注射部位出現刺痛、腫脹時，最優先的護理措施是下列何者？", "options": ["立即停止注射，以另一注射空針，由原注射部位儘量回抽藥物", "立即拔除注射部位靜脈留置針", "減慢注射藥物速度，繼續觀察病人反應", "立即加壓注射部位，並給予熱敷"], "answer": 0, "explanation": "答案：立即停止注射，以另一注射空針，由原注射部位儘量回抽藥物\n解析：Adriamycin外滲時，最優先的急救措施是立即停止注射，並由原注射部位盡量回抽殘留藥物，以減少組織吸收壞死"}, {"id": "unit5-054", "unit": "單元5 腫瘤疾病與護理", "question": "癌症病人接受化學藥rituximab(Rituxan)連續滴注5分鐘後，病人主訴發冷、寒顫，下列護理處置何者最優先？", "options": ["給予靜脈注射sodium bicar-bonate一支", "給予病人添加衣服及被蓋", "立即停止滴注並給予生理食鹽水滴注", "準備急救藥物及急救設備"], "answer": 2, "explanation": "答案：立即停止滴注並給予生理食鹽水滴注\n解析：Rituximab常見嚴重的輸注反應（發冷、寒顫）。一旦發生，首要處置應立即停止滴注並改滴生理食鹽水維持靜脈通暢"}, {"id": "unit5-055", "unit": "單元5 腫瘤疾病與護理", "question": "注射mitomycin化學藥物發生外滲現象之處置，下列何者錯誤？", "options": ["檢查靜脈導管有無回血及注射部位之腫脹情形", "應停止注射藥物，並立刻拔出針頭套管", "在外滲部位注射解毒劑，減少組織傷害", "屬於發泡類藥物，外滲後應冷敷注射部位"], "answer": 1, "explanation": "答案：應停止注射藥物，並立刻拔出針頭套管\n解析：注射Mitomycin這類發泡性藥物發生外滲時，「不可」立刻拔出針頭套管，必須先回抽殘存藥液"}, {"id": "unit5-056", "unit": "單元5 腫瘤疾病與護理", "question": "接受靜脈注射放射性同位素治療病人的保護措施，下列何者錯誤？", "options": ["室內需放置長鑷與鉛製容器", "戴手套處理體液和排泄物", "更換的床單應留在病室內，等檢查不具放射性後才處理", "皮膚接觸到病人體液時，應用肥皂及大量清水清洗"], "answer": 0, "explanation": "答案：室內需放置長鑷與鉛製容器\n解析：靜脈注射放射性同位素屬於「非封閉式」治療，室內不需要放置處理「封閉式放射源脫落」用的長鑷與鉛桶"}, {"id": "unit5-057", "unit": "單元5 腫瘤疾病與護理", "question": "有關化學治療的禁忌症，下列何者錯誤？", "options": ["感染", "昨天接受腹部手術", "肝腎功能損傷", "白血球8,000/μL"], "answer": 3, "explanation": "答案：白血球8,000/μL\n解析：白血球8,000/μL為正常範圍（4000-10000），並非禁忌症。嚴重感染、近期手術或肝腎損傷才是化療禁忌症"}, {"id": "unit5-058", "unit": "單元5 腫瘤疾病與護理", "question": "有關頭頸部放射治療對口腔造成的影響，下列處置何者正確？", "options": ["採高纖飲食訓練口頰肌肉，以避免牙關緊閉", "整天持續配戴活動假牙，以避免齒齦萎縮後不合口", "nystatin (Mycostatin®)含漱後吞服治療細菌感染", "四級口腔黏膜炎可規律給予全身性止痛劑緩解"], "answer": 3, "explanation": "答案：四級口腔黏膜炎可規律給予全身性止痛劑緩解\n解析：嚴重的四級口腔黏膜炎會導致極度疼痛，應規律給予全身性止痛劑。Nystatin需含漱後吐掉不可吞服"}, {"id": "unit5-059", "unit": "單元5 腫瘤疾病與護理", "question": "放射線治療對下列何類細胞的治療效果較差？", "options": ["骨髓", "毛囊", "神經細胞", "含氧量高的細胞"], "answer": 2, "explanation": "答案：神經細胞\n解析：神經細胞屬於分裂極為緩慢的細胞，對放射線的敏感度低，因此放射線治療效果較差"}, {"id": "unit5-060", "unit": "單元5 腫瘤疾病與護理", "question": "有關封閉式體內放射線治療之敘述，下列何者錯誤？", "options": ["需限制訪客接觸病人的時間與距離", "住單人房可減少對其他人的影響", "病人排泄物具有放射性", "植入物掉地時要用長柄鑷子夾起"], "answer": 2, "explanation": "答案：病人排泄物具有放射性\n解析：封閉式體內放射線治療的放射源密封於容器中不會代謝，因此病人的「排泄物（如尿液、糞便）不具有放射性」"}, {"id": "unit5-061", "unit": "單元5 腫瘤疾病與護理", "question": "有關子宮頸癌行後荷式(after loading)體內放射線治療之照護措施，下列何者錯誤？", "options": ["穿鉛衣，可降低接觸輻射線的暴露量", "若放射源脫落，用長柄鑷子夾起再放入鉛桶中", "病人尿液要放入鉛桶，待過了半衰期再處理", "採集中護理，以減少暴露放射線的危險"], "answer": 2, "explanation": "答案：病人尿液要放入鉛桶，待過了半衰期再處理\n解析：子宮頸癌的後荷式治療屬於封閉式體內放射治療，病人的排泄物與尿液「無」放射性，不需要放入鉛桶等待半衰期"}, {"id": "unit5-062", "unit": "單元5 腫瘤疾病與護理", "question": "有關頭頸部放射線治療的敘述，下列何者錯誤？", "options": ["照射部位發紅可以熱敷促進舒適", "最大張口及咀嚼運動可預防牙關緊閉", "唾液腺破壞會有口乾問題", "進食前使用止痛劑可減輕疼痛"], "answer": 0, "explanation": "答案：照射部位發紅可以熱敷促進舒適\n解析：頭頸部放療照射部位的皮膚非常脆弱，發紅時「絕對不可」熱敷或冷敷，以免加重皮膚組織受損與壞死"}, {"id": "unit5-063", "unit": "單元5 腫瘤疾病與護理", "question": "張先生將接受頭頸部放射線治療，維持口腔黏膜完整及濕潤之措施，下列何者較不適當？", "options": ["用軟毛牙刷清潔口腔", "進食完立即清潔口腔", "盡量勿由口進食", "使用維生素C片"], "answer": 2, "explanation": "答案：盡量勿由口進食\n解析：放射治療期間，應鼓勵病人進食非刺激性軟食以維持充足營養，而非消極地「盡量勿由口進食」"}, {"id": "unit5-064", "unit": "單元5 腫瘤疾病與護理", "question": "化學藥物治療的病人，出現輕微的口腔炎時，下列護理措施何者最適宜？", "options": ["保持口腔乾燥，以避免刺激", "依醫囑禁食，等口腔粘膜癒合後再進食", "鼓勵進食非刺激性食物，用餐後清潔口腔", "建議多攝取高纖維飲食，以促進口腔粘膜的癒合"], "answer": 2, "explanation": "答案：鼓勵進食非刺激性食物，用餐後清潔口腔\n解析：出現輕微口腔炎時，應鼓勵進食溫和非刺激性食物，並於用餐後徹底清潔口腔，以維持舒適並預防感染"}, {"id": "unit5-065", "unit": "單元5 腫瘤疾病與護理", "question": "護理師在照護放射線治療部位的皮膚時，下列措施何者錯誤？", "options": ["治療過程中不可自行洗去皮膚上標記", "照射部位皮膚以清水清洗", "出現皮膚脫屑時，可擦拭乳液", "皮膚出現滲液時，要保持皮膚乾燥"], "answer": 2, "explanation": "答案：出現皮膚脫屑時，可擦拭乳液\n解析：放射線治療部位的皮膚若出現脫屑，不可自行隨便擦拭市售乳液（含酒精或重金屬成分會干擾放療），需依醫囑處理"}, {"id": "unit5-066", "unit": "單元5 腫瘤疾病與護理", "question": "有關干擾素治療之敘述，下列何者正確？", "options": ["屬主動免疫，使人體產生抗癌細胞的抗體", "常使用深部肌肉注射方式給藥", "高劑量可增加抗體合成及淋巴球增殖", "常見副作用為頭痛、發燒、食慾降低等類似感冒症狀"], "answer": 3, "explanation": "答案：常見副作用為頭痛、發燒、食慾降低等類似感冒症狀\n解析：干擾素（Interferon）生物治療最常見的副作用為出現頭痛、發燒、畏寒等「類似感冒的症狀」"}, {"id": "unit5-067", "unit": "單元5 腫瘤疾病與護理", "question": "有關骨髓抑制病人的保護隔離措施，下列何者錯誤？", "options": ["絕對嗜中性白血球低於500/μL應採保護隔離", "使用負壓的單人病房", "依醫囑給予預防性抗生素治療", "衛教選擇有完整果皮包覆的水果"], "answer": 1, "explanation": "答案：使用負壓的單人病房\n解析：骨髓抑制導致絕對嗜中性白血球過低時，為防止外界病原進入，應住「正壓」單人病房保護隔離，而非負壓病房"}, {"id": "unit5-068", "unit": "單元5 腫瘤疾病與護理", "question": "針對接受trastuzumab(Herceptin®)治療的癌症病人之護理，下列何者正確？①靜脈滴注給藥②空腹口服給藥③監測丘疹、手足症候群④監測心臟功能：", "options": ["①③", "①④", "②③", "②④"], "answer": 1, "explanation": "答案：①④\n解析：Trastuzumab（Herceptin）採靜脈滴注給藥，且具有引發心臟衰竭的風險，故需密切監測心臟功能（①④正確）"}, {"id": "unit5-069", "unit": "單元5 腫瘤疾病與護理", "question": "有關腫瘤溶解症候群的處置，下列何者錯誤？", "options": ["預防性給與類固醇及抗組織胺劑", "水分補充", "預防性給與降尿酸藥物", "密切監控病人尿量及小便酸鹼值"], "answer": 0, "explanation": "答案：預防性給與類固醇及抗組織胺劑\n解析：腫瘤溶解症候群處置為補充水分、降尿酸及降血鉀。給予類固醇及抗組織胺是預防藥物過敏，並非此症候群的處置"}, {"id": "unit5-070", "unit": "單元5 腫瘤疾病與護理", "question": "減少腫瘤溶解症候群發生之處置，下列何者錯誤？", "options": ["治療前後減少輸液，以降低心臟負擔", "給與Allopurinol，以降低尿酸", "Kayexalate可降低血鉀", "Sodium Bicarbonate可鹼化尿液"], "answer": 0, "explanation": "答案：治療前後減少輸液，以降低心臟負擔\n解析：預防腫瘤溶解症候群，應在治療前後「大量補充輸液（水分）」以促進大量尿酸排出，而非減少輸液"}, {"id": "unit5-071", "unit": "單元5 腫瘤疾病與護理", "question": "有關腫瘤溶解症候群之敘述，下列何者正確？①高血鉀症②高血鈣症③要補充大量水分④使用kayexalate可降低鈉離子⑤allopurinol可降尿酸：", "options": ["①②③", "①③⑤", "②④⑤", "③④⑤"], "answer": 1, "explanation": "答案：①③⑤\n解析：腫瘤溶解症候群特徵為高血鉀、高尿酸、高血磷與「低血鈣」（②錯）。處置需補水並給予Allopurinol降尿酸 (①③⑤對)"}, {"id": "unit5-072", "unit": "單元5 腫瘤疾病與護理", "question": "下列何種癌症是最常引起上腔靜脈症候群？", "options": ["肺癌", "乳癌", "頭頸癌", "胃癌"], "answer": 0, "explanation": "答案：肺癌\n解析：上腔靜脈症候群（SVCS）多因縱膈腔腫瘤壓迫上腔靜脈血液回流，臨床上最常由「肺癌」引起"}, {"id": "unit5-073", "unit": "單元5 腫瘤疾病與護理", "question": "有關上腔靜脈症候群之敘述，下列何者錯誤？", "options": ["常見原因是淋巴結腫大壓迫，影響血液回流", "臨床症狀在晚上最為明顯", "體外放射線照射是最常用的治療方式", "呼吸困難時宜採半坐臥"], "answer": 1, "explanation": "答案：臨床症狀在晚上最為明顯\n解析：上腔靜脈症候群的病人在平躺一晚後血液回流受阻最嚴重，因此臉頸腫脹與頭痛等症狀在「早上（剛起床時）」最明顯"}, {"id": "unit5-074", "unit": "單元5 腫瘤疾病與護理", "question": "有關上腔靜脈症候群之敘述，下列何者正確？", "options": ["以淋巴瘤的病人最常發生", "常見症狀有臉部腫脹、頭痛、呼吸困難等", "協助病人採側臥平躺的姿勢，較能改善此症狀", "非小細胞癌病人可用化學治療來改善此症狀"], "answer": 1, "explanation": "答案：常見症狀有臉部腫脹、頭痛、呼吸困難等\n解析：上腔靜脈症候群常見症狀包含臉部與頸部腫脹、頭痛及呼吸困難。發作時應協助病人採「半坐臥」以改善呼吸"}, {"id": "unit5-075", "unit": "單元5 腫瘤疾病與護理", "question": "有關乳癌轉移壓迫脊髓最常見之部位，下列何者正確？", "options": ["頸椎", "胸椎", "腰椎", "薦椎"], "answer": 1, "explanation": "答案：胸椎\n解析：乳癌發生骨轉移時，最常壓迫的脊髓部位為「胸椎」"}, {"id": "unit5-076", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症病人發生口腔炎之護理指導，下列何者錯誤？", "options": ["教導飯前使用0.1% xylocaine漱口，以減輕疼痛", "鼓勵飯後30分鐘內，以軟毛牙刷清潔口腔", "教導食用冷的流質食物，增加維生素攝取", "鼓勵自行購買漱口水清潔口腔"], "answer": 3, "explanation": "答案：鼓勵自行購買漱口水清潔口腔\n解析：市售漱口水多含酒精成分，會刺激發炎破損的口腔黏膜引起劇痛，應教導病人避免自行購買，需使用無酒精漱口液"}, {"id": "unit5-077", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症病人口腔黏膜障礙照護的敘述，下列何者正確？①使用含類固醇的口內膏，可緩解疼痛和發炎②Nystatin可預防白色念珠菌感染，漱口後要吐掉不可吞服③病人對苦味的敏感度減少，故可以吃苦瓜和芥菜，補充纖維素④使用口香糖可維持口腔濕潤：", "options": ["①②", "①④", "②③", "③④"], "answer": 1, "explanation": "答案：①④\n解析：口內膏含類固醇恐加重黴菌感染；Nystatin應含漱後吐掉（②對）；應避免吃苦瓜等粗糙食物；口香糖可刺激唾液維持濕潤（④對）"}, {"id": "unit5-078", "unit": "單元5 腫瘤疾病與護理", "question": "下列何項處置最能減緩因接受化學治療而發生口腔黏膜損傷所造成的疼痛？", "options": ["暫時停止化學治療", "監測病人的全血球計數", "持續良好的口腔清潔", "定期檢查口腔黏膜炎症狀與徵象"], "answer": 2, "explanation": "答案：持續良好的口腔清潔\n解析：持續維持良好的口腔清潔，能有效減少口腔細菌孳生、預防嚴重感染，是最能減緩黏膜損傷發炎疼痛惡化的護理措施"}, {"id": "unit5-079", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症治療對口腔黏膜之影響與處置，下列敘述何者正確？", "options": ["舌頭味蕾易被破壞，且治療後味覺不會恢復", "唾液腺會受破壞，使得唾液分泌減少", "進食後使用止痛噴劑，可改善病人進食的困擾", "使用Mycostatin(Nystatin)漱口液，漱口後吐掉"], "answer": 1, "explanation": "答案：唾液腺會受破壞，使得唾液分泌減少\n解析：頭頸部放射線治療會破壞唾液腺，使得唾液分泌減少造成口乾。味蕾破壞引起的味覺喪失通常在治療後可漸漸恢復"}, {"id": "unit5-080", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症病人血小板減少症之處置，下列何者正確？", "options": ["可給與非類固醇抗發炎藥物緩解疼痛", "必要時輸注凝血因子避免自發性出血", "給與Bisacodyl supp避免便秘而閉氣用力", "天冷時鼻黏膜塗擦凡士林保濕"], "answer": 3, "explanation": "答案：天冷時鼻黏膜塗擦凡士林保濕\n解析：血小板減少易出血，天冷時在鼻黏膜塗擦凡士林保濕可防鼻出血。應絕對避免NSAID藥物、肛門塞劑及防閉氣用力"}, {"id": "unit5-081", "unit": "單元5 腫瘤疾病與護理", "question": "有關血小板減少症照護的敘述，下列何者正確？", "options": ["病人可使用非類固醇抗發炎之止痛藥物", "教導病人使用牙線代替牙籤", "教導病人避免做閉氣用力的動作", "鼻黏膜乾燥不適，不可塗抹凡士林"], "answer": 2, "explanation": "答案：教導病人避免做閉氣用力的動作\n解析：血小板減少病人有極高出血風險，應教導避免做閉氣用力的動作（如用力排便），以預防致命的顱內出血"}, {"id": "unit5-082", "unit": "單元5 腫瘤疾病與護理", "question": "有關骨髓抑制病人之敘述，下列何者錯誤？", "options": ["絕對嗜中性白血球下降容易導致感染", "血小板低於50,000/μL容易引起自發性出血", "絕對嗜中性白血球低於500/μL要採取保護隔離", "血紅素過低可補充紅血球濃厚液"], "answer": 1, "explanation": "答案：血小板低於50,000/μL容易引起自發性出血\n解析：血小板低於50,000/μL時有出血傾向，但臨床上低於「20,000/μL」時，才極易引起嚴重的「自發性出血」"}, {"id": "unit5-083", "unit": "單元5 腫瘤疾病與護理", "question": "病人接受化學治療後血小板數值為10,000 cells/mm，下列何者為護理評估重點？", "options": ["意識狀態", "體溫變化", "腸蠕動音", "皮膚飽和度"], "answer": 0, "explanation": "答案：意識狀態\n解析：病人血小板僅剩10,000 cells/mm3，面臨極高的自發性顱內出血危險，護理評估最優先且關鍵的是監測「意識狀態」"}, {"id": "unit5-084", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症病人出血問題之敘述，下列何者錯誤？", "options": ["血小板數目8萬/μL是正常的數據", "消化道出血時，可使用冰鹽水灌洗", "有出血傾向的病人要限制使用Coumadin和Heparine", "要避免肌肉注射或量肛溫等侵入性處置"], "answer": 0, "explanation": "答案：血小板數目8萬/μL是正常的數據\n解析：正常人血小板數目約為15萬~40萬/μL，8萬/μL屬於偏低異常數據，已有潛在的出血風險"}, {"id": "unit5-085", "unit": "單元5 腫瘤疾病與護理", "question": "'有關癌症病人感染問題的敘述，下列何者錯誤？", "options": ["感染是造成病人死亡的主要原因", "感染與癌症治療骨髓功能受抑制有關", "白血球比嗜中性球更能反映病人是否易受感染", "G-CSF皮下注射可增加白血球數目"], "answer": 2, "explanation": "答案：白血球比嗜中性球更能反映病人是否易受感染\n解析：相較於總白血球，絕對嗜中性白血球（ANC）是身體抵抗細菌的第一道防線，更能精確反映病人免疫力與是否易受感染"}, {"id": "unit5-086", "unit": "單元5 腫瘤疾病與護理", "question": "有關放射線治療病人照射處皮膚照護之敘述，下列何者錯誤？", "options": ["要用中性肥皂搓洗避免感染", "不可塗抹含酒精的乳液", "可依醫囑塗抹氧化鋅", "只能使用電動刮鬍刀"], "answer": 0, "explanation": "答案：要用中性肥皂搓洗避免感染\n解析：放射線治療照射處的皮膚極度敏感脆弱，只能用清水輕柔沖洗，不可用中性肥皂搓洗，以免造成皮膚破損與感染"}, {"id": "unit5-087", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症病人貧血問題之敘述，下列何者錯誤？", "options": ["全胃或脾臟切除手術會影響病人紅血球的生成", "貧血症狀包括蒼白、心跳變慢、血壓上升、易疲倦等", "鼓勵病人補充鐵質和含葉酸食物，如牛肉、綠色蔬菜", "集中護理可讓病人獲得充分的休息"], "answer": 1, "explanation": "答案：貧血症狀包括蒼白、心跳變慢、血壓上升、易疲倦等\n解析：貧血會導致周邊組織供氧不足，身體為了代償缺氧狀態會使心搏出量增加，導致心跳「變快」（心搏過速），而非變慢"}, {"id": "unit5-088", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症病人感染問題的照護與護理指導，下列何者正確？", "options": ["嗜中性白血球低下病人都會出現典型發炎症狀，如發燒等", "多吃養樂多和優格等食品對病人是有益處的", "絕對嗜中性白血球低於500/mm3要採取保護隔離", "家屬接種活性疫苗3週後即可探視病人"], "answer": 2, "explanation": "答案：絕對嗜中性白血球低於500/mm3要採取保護隔離\n解析：當絕對嗜中性白血球（ANC）低於500/mm3時，病人處於極度免疫低下狀態，必須立刻採取嚴格的保護隔離"}, {"id": "unit5-089", "unit": "單元5 腫瘤疾病與護理", "question": "乳腺癌病人出現意識混亂、嗜睡、虛弱、心律不整、嘔吐及便秘，下列何者為其最可能發生的癌症合併症？", "options": ["腫瘤溶解症候群", "上腔靜脈症候群", "脊髓壓迫", "高血鈣症"], "answer": 3, "explanation": "答案：高血鈣症\n解析：乳腺癌及骨轉移病人極易因骨質破壞引發「高血鈣症」，高血鈣會抑制神經與肌肉，導致意識混亂、嗜睡、虛弱及便秘"}, {"id": "unit5-090", "unit": "單元5 腫瘤疾病與護理", "question": "\"有關癌症病人使用干擾素治療之敘述，下列何者正確？", "options": ["高劑量使用時，可以增加抗體及淋巴球", "會出現如低血壓、肺水腫、腎功能低下等嚴重副作用", "會出現類似流行性感冒症狀", "採靜脈、肌肉或皮內等注射方式"], "answer": 2, "explanation": "答案：會出現類似流行性感冒症狀\n解析：干擾素治療屬於生物製劑（免疫療法），其最常見的副作用為出現「類似流行性感冒的症狀」（如發燒、寒顫、疲倦等）"}, {"id": "unit7-001", "unit": "單元7 呼吸系統疾病與護理1", "question": "在正常生理狀態下，下列何者為刺激呼吸中樞而影響呼吸之主要物質？", "options": ["二氧化碳", "氧", "鈣離子", "鉀離子"], "answer": 0, "explanation": "答案：二氧化碳\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「二氧化碳」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「二氧化碳」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「氧、鈣離子」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-002", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關庫斯莫爾氏呼吸(Kussmaul’s breathing)的特徵，下列何者正確？", "options": ["呼吸快而深", "呼吸慢而淺", "呼吸快而淺", "呼吸慢而深"], "answer": 0, "explanation": "答案：呼吸快而深\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「呼吸快而深」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「呼吸快而深」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「呼吸慢而淺、呼吸快而淺」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-003", "unit": "單元7 呼吸系統疾病與護理1", "question": "費力呼吸時主要使用的呼氣輔助肌，下列何者正確？", "options": ["腹肌", "斜方肌", "內肋間肌", "胸鎖乳突肌"], "answer": 0, "explanation": "答案：腹肌\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「腹肌」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「腹肌」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「斜方肌、內肋間肌」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-004", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關呼吸困難之徵象，下列何者最不常見？", "options": ["端坐呼吸", "噘嘴式呼吸", "使用胸鎖乳突肌", "咳血"], "answer": 3, "explanation": "答案：咳血\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「咳血」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「咳血」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「端坐呼吸、噘嘴式呼吸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-005", "unit": "單元7 呼吸系統疾病與護理1", "question": "護理師對一位嚴重呼吸困難、剛住院的病人進行初次評估時，下列何者適當？", "options": ["先收集完整性的健康史，再決定處理病人健康問題的優先次序", "先執行完整性身體檢查與評估，以利了解呼吸困難對其全身所造成的影響", "先獲取呼吸困難相關的重要訊息，等情況穩定再執行完整性身體檢查與評估", "先執行完整性身體檢查與評估，再詢問家屬有關這次發生呼吸困難之相關訊息"], "answer": 2, "explanation": "答案：先獲取呼吸困難相關的重要訊息，等情況穩定再執行完整性身體檢查與評估\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「先獲取呼吸困難相關的重要訊息，等情況穩定再執行完整性身體檢查與評估」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「先獲取呼吸困難相關的重要訊息，等情況穩定再執行完整性身體檢查與評估」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「先收集完整性的健康史，再決定處理病人健康問題的優先次序、先執行完整性身體檢查與評估，以利了解呼吸困難對其全身所造成的影響」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-006", "unit": "單元7 呼吸系統疾病與護理1", "question": "疑似肺擴張不全病人之護理評估，下列何者最有可能出現？", "options": ["正常口溫", "乾咳", "呼吸音減弱", "慢而深的呼吸"], "answer": 2, "explanation": "答案：呼吸音減弱\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「呼吸音減弱」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「呼吸音減弱」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「正常口溫、乾咳」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-007", "unit": "單元7 呼吸系統疾病與護理1", "question": "肺擴張不全病人的身體評估，下列發現何者正確？", "options": ["視診氣管明顯向健側擴張", "觸診患側觸覺震顫明顯變大", "叩診患側有明顯濁音出現", "聽診患側呼吸音變大"], "answer": 2, "explanation": "答案：叩診患側有明顯濁音出現\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「叩診患側有明顯濁音出現」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「叩診患側有明顯濁音出現」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「視診氣管明顯向健側擴張、觸診患側觸覺震顫明顯變大」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-008", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關呼吸系統評估結果之敘述，下列何者正確？", "options": ["視診肺膿瘍病人胸部時，常出現胸部前後徑加大", "觸診肺氣腫病人胸部時，常出現觸覺震顫增強", "叩診肋膜積水病人胸部時，常出現過度反響音(hyper-resonance)", "聽診呼吸道狹窄病人胸部時，常出現喘鳴音(stridor)"], "answer": 3, "explanation": "答案：聽診呼吸道狹窄病人胸部時，常出現喘鳴音(stridor)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「聽診呼吸道狹窄病人胸部時，常出現喘鳴音(stridor)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「聽診呼吸道狹窄病人胸部時，常出現喘鳴音(stridor)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「視診肺膿瘍病人胸部時，常出現胸部前後徑加大、觸診肺氣腫病人胸部時，常出現觸覺震顫增強」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-009", "unit": "單元7 呼吸系統疾病與護理1", "question": "評估右下肺葉時叩診出現濁音及聽診時呼吸音減弱，胸部X光檢查結果右側肋膜橫膈角呈鈍角，下列何者為病人最可能之診斷？", "options": ["右下肺葉肺炎", "右側氣胸", "右側肋膜積水", "右下肺葉腫瘤"], "answer": 2, "explanation": "答案：右側肋膜積水\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「右側肋膜積水」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「右側肋膜積水」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「右下肺葉肺炎、右側氣胸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-010", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關病人的肺部身體評估，下列結果何者異常？", "options": ["吸氣時胸廓對稱性往外擴張", "肺部基底部出現反響音", "下肺區出現支氣管呼吸音", "胸廓左右徑大於前後徑"], "answer": 2, "explanation": "答案：下肺區出現支氣管呼吸音\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「下肺區出現支氣管呼吸音」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「下肺區出現支氣管呼吸音」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「吸氣時胸廓對稱性往外擴張、肺部基底部出現反響音」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-011", "unit": "單元7 呼吸系統疾病與護理1", "question": "評估呼吸道阻塞嚴重度的指標，下列何者最重要？", "options": ["吸氣容量", "功能性肺餘量", "最大吸氣壓力", "第1秒之用力吐氣量"], "answer": 3, "explanation": "答案：第1秒之用力吐氣量\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「第1秒之用力吐氣量」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「第1秒之用力吐氣量」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「吸氣容量、功能性肺餘量」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-012", "unit": "單元7 呼吸系統疾病與護理1", "question": "檢查肺功能時，在一次緩慢最大程度吸氣後，所測得之最大呼氣容積代表下列何者？", "options": ["呼氣量", "肺活量", "潮氣容積", "功能性肺餘量"], "answer": 1, "explanation": "答案：肺活量\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「肺活量」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「肺活量」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「呼氣量、潮氣容積」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-013", "unit": "單元7 呼吸系統疾病與護理1", "question": "使用非侵入性週邊血氧濃度監測儀時，下列何者會影響血氧濃度數值的判讀？", "options": ["發燒", "心搏過速", "呼吸急促", "低血壓"], "answer": 3, "explanation": "答案：低血壓\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「低血壓」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「低血壓」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「發燒、心搏過速」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-014", "unit": "單元7 呼吸系統疾病與護理1", "question": "病人的動脈血氧分析結果PaO2值為50mmHg，此病人PaO2的判讀及處置，下列何者正確？", "options": ["此病人有嚴重的缺氧(hypoxia)", "血氧氣值低但對病人不會造成威脅", "病人的PaO2在正常範圍", "可使用低流量的氧氣治療"], "answer": 0, "explanation": "答案：此病人有嚴重的缺氧(hypoxia)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「此病人有嚴重的缺氧(hypoxia)」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「此病人有嚴重的缺氧(hypoxia)」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「血氧氣值低但對病人不會造成威脅、病人的PaO2在正常範圍」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-015", "unit": "單元7 呼吸系統疾病與護理1", "question": "當動脈氣體分析值為 pH：7.40、PaCO2：42 mmHg、HCO3-：24 mEq/L、PaO2：80 mmHg 時，有關病人呼吸器脫離(ventilator weaning)的敘述，下列何者正確？", "options": ["動脈氣體分析值正常，應可考慮開始脫離呼吸器", "動脈氣體分析值為呼吸性酸中毒，必須先行矯正，尚不宜脫離呼吸器", "動脈氣體分析值為呼吸性酸中毒，可刺激病人呼吸，所以應適合脫離呼吸器", "PaCO2 及PaO2 為正常但可能阻礙呼吸，故不宜脫離呼吸器"], "answer": 0, "explanation": "答案：動脈氣體分析值正常，應可考慮開始脫離呼吸器\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「動脈氣體分析值正常，應可考慮開始脫離呼吸器」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「動脈氣體分析值正常，應可考慮開始脫離呼吸器」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「動脈氣體分析值為呼吸性酸中毒，必須先行矯正，尚不宜脫離呼吸器、動脈氣體分析值為呼吸性酸中毒，可刺激病人呼吸，所以應適合脫離呼吸器」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-016", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關慢性咳嗽病人進行支氣管鏡檢查後，下列護理措施何者最適宜？", "options": ["床頭抬高至80～90度", "禁食直到作嘔反射恢復", "臥床休息至少4小時", "咳出微量血絲痰應立即通知醫師"], "answer": 1, "explanation": "答案：禁食直到作嘔反射恢復\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「禁食直到作嘔反射恢復」；肺炎題要抓感染、痰液清除與氧合\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「禁食直到作嘔反射恢復」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「床頭抬高至80～90度、臥床休息至少4小時」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-017", "unit": "單元7 呼吸系統疾病與護理1", "question": "教導慢性阻塞性肺疾病病人採用橫膈式呼吸與噘嘴式呼吸的目的，下列何者正確？①降低呼吸作功②增加呼吸速率③減少潮氣容積④促進二氧化碳的排出：", "options": ["①②", "①④", "②③", "③④"], "answer": 1, "explanation": "答案：①④\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「①④」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「①④」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「①②、②③」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-018", "unit": "單元7 呼吸系統疾病與護理1", "question": "胸腔手術後病人進行深呼吸運動之主要成效，下列何者正確？", "options": ["可以提高橫膈膜，使胸腔擴大且增加肺部進行氣體交換的表面積", "可增加到肺部的血流量，使術後復原較快", "可控制氣體的流速，使病人不會過度通氣", "可擴張肺泡，增加氣體交換的表面積"], "answer": 3, "explanation": "答案：可擴張肺泡，增加氣體交換的表面積\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「可擴張肺泡，增加氣體交換的表面積」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「可擴張肺泡，增加氣體交換的表面積」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「可以提高橫膈膜，使胸腔擴大且增加肺部進行氣體交換的表面積、可增加到肺部的血流量，使術後復原較快」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-019", "unit": "單元7 呼吸系統疾病與護理1", "question": "以鼻套管4 L/min 所提供的氧氣濃度約為何？", "options": ["28%", "32%", "36%", "40%"], "answer": 2, "explanation": "答案：36%\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「36%」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「36%」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「28%、32%」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-020", "unit": "單元7 呼吸系統疾病與護理1", "question": "以鼻導管供給氧氣，如流速為3公升／分鐘，則病人吸入氣體中的氧含量約為多少？", "options": ["24%", "32%", "40%", "48%"], "answer": 1, "explanation": "答案：32%\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「32%」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「32%」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「24%、40%」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-021", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關氧氣治療的護理措施，下列何者正確？", "options": ["為避免細菌滋生，應儘量減少潮濕瓶的使用", "非再吸入面罩適合用於短期需高氧治療者", "單純面罩最適合的氧氣流速為每分鐘4公升以下", "鼻套管適用於躁動不安的病人"], "answer": 1, "explanation": "答案：非再吸入面罩適合用於短期需高氧治療者\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「非再吸入面罩適合用於短期需高氧治療者」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「非再吸入面罩適合用於短期需高氧治療者」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「為避免細菌滋生，應儘量減少潮濕瓶的使用、單純面罩最適合的氧氣流速為每分鐘4公升以下」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-022", "unit": "單元7 呼吸系統疾病與護理1", "question": "使用卞德里氧氣面罩(Venturi mask)給氧的最主要特點為何？", "options": ["可提供70%以上濃度的氧氣", "可增加用氧的溼度", "可提供較精確的用氧濃度", "可用於病人進食時"], "answer": 2, "explanation": "答案：可提供較精確的用氧濃度\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「可提供較精確的用氧濃度」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「可提供較精確的用氧濃度」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「可提供70%以上濃度的氧氣、可增加用氧的溼度」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-023", "unit": "單元7 呼吸系統疾病與護理1", "question": "接受噴霧治療(aerosal therapy)的患者出現下列何種主訴時，表示須再給與護理指導？", "options": ["「半坐臥姿勢比較合適」", "「做完後要深呼吸咳嗽」", "「使用加熱的噴霧器，容易發生支氣管痙攣」", "「吸氣的時候要深而慢才好」"], "answer": 2, "explanation": "答案：「使用加熱的噴霧器，容易發生支氣管痙攣」\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「「使用加熱的噴霧器，容易發生支氣管痙攣」」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「「使用加熱的噴霧器，容易發生支氣管痙攣」」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「「半坐臥姿勢比較合適」、「做完後要深呼吸咳嗽」」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-024", "unit": "單元7 呼吸系統疾病與護理1", "question": "當肺炎病人出現呼吸道清除功能失效與分泌物增加，且無法進行有效性咳嗽。下列護理措施何者最能促進其清除痰液？", "options": ["鼓勵病人採胸式呼吸", "鼓勵病人增加飲水量", "教導病人用噘嘴式呼吸", "協助病人採半坐臥式"], "answer": 1, "explanation": "答案：鼓勵病人增加飲水量\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「鼓勵病人增加飲水量」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「鼓勵病人增加飲水量」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「鼓勵病人採胸式呼吸、教導病人用噘嘴式呼吸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-025", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關協助肺心症病人清除呼吸道分泌物之措施，下列何者錯誤？", "options": ["教導深呼吸、咳嗽", "執行胸部扣擊、震顫", "攝取大量水分", "執行姿位引流"], "answer": 2, "explanation": "答案：攝取大量水分\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「攝取大量水分」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「攝取大量水分」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「教導深呼吸、咳嗽、執行胸部扣擊、震顫」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit7-026", "unit": "單元7 呼吸系統疾病與護理1", "question": "接受胸腔放液穿刺術後的病人，需監測的合併症，不包括下列何者？", "options": ["凝血功能變差", "氣胸", "肺水腫", "低血壓"], "answer": 0, "explanation": "答案：凝血功能變差\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「凝血功能變差」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「凝血功能變差」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「氣胸、肺水腫」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-027", "unit": "單元7 呼吸系統疾病與護理1", "question": "接受胸腔放液後的病人，下列何者最需緊急處理？", "options": ["主訴疼痛為5分(以0～10分的疼痛量表作評估)", "周邊血氧濃度為88%", "血壓156/88 mmHg", "平躺時呼吸次數為24 次／分"], "answer": 1, "explanation": "答案：周邊血氧濃度為88%\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「周邊血氧濃度為88%」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「周邊血氧濃度為88%」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「主訴疼痛為5分(以0～10分的疼痛量表作評估)、血壓156/88 mmHg」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-028", "unit": "單元7 呼吸系統疾病與護理1", "question": "醫生為外傷急診病人放置兩條胸管，一條放置在第二肋間、另一條放置在肺底，下列何者為放置在第二肋間胸管之主要目的？", "options": ["從肋膜腔內引流血水", "排除肋膜腔內的空氣", "維持肋膜腔的正壓", "提供注射藥物至肋膜腔的管道"], "answer": 1, "explanation": "答案：排除肋膜腔內的空氣\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「排除肋膜腔內的空氣」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「排除肋膜腔內的空氣」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「從肋膜腔內引流血水、維持肋膜腔的正壓」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-029", "unit": "單元7 呼吸系統疾病與護理1", "question": "評估一位氣胸且剛接上胸管病人的胸腔水下引流系統裝置，下列何者為不正常現象？", "options": ["水封瓶內長玻管保持在液面下2～3公分", "水封瓶內會出現連續性氣泡", "水封瓶中液面在吸氣時上升", "水封瓶中液面在呼氣時下降"], "answer": 1, "explanation": "答案：水封瓶內會出現連續性氣泡\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「水封瓶內會出現連續性氣泡」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「水封瓶內會出現連續性氣泡」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「水封瓶內長玻管保持在液面下2～3公分、水封瓶中液面在吸氣時上升」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-030", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關放置胸管(chest tube)病人的照護，下列何者正確？", "options": ["為避免胸管滑脫，應限制病人活動", "平時應間歇性的夾住管路，避免過度引流", "水封瓶內出現大量氣泡，為正常現象", "負壓引流時，抽吸控制瓶應使用持續性抽吸"], "answer": 3, "explanation": "答案：負壓引流時，抽吸控制瓶應使用持續性抽吸\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「負壓引流時，抽吸控制瓶應使用持續性抽吸」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「負壓引流時，抽吸控制瓶應使用持續性抽吸」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「為避免胸管滑脫，應限制病人活動、平時應間歇性的夾住管路，避免過度引流」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-031", "unit": "單元7 呼吸系統疾病與護理1", "question": "觀察到胸腔水下引流的水封瓶內持續有小量氣泡時之處置，下列何者正確？", "options": ["持續觀察，這是正常的現象", "檢查引流裝置各部位的連接是否密合", "減少抽吸壓力至15 cmH2O並持續觀察", "將水封瓶內的水倒掉一半"], "answer": 1, "explanation": "答案：檢查引流裝置各部位的連接是否密合\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「檢查引流裝置各部位的連接是否密合」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「檢查引流裝置各部位的連接是否密合」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「持續觀察，這是正常的現象、減少抽吸壓力至15 cmH2O並持續觀察」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-032", "unit": "單元7 呼吸系統疾病與護理1", "question": "評估插胸管病人是否出現皮下氣腫之方法，下列何者正確？", "options": ["比較吸氣和吐氣的時間長度", "視診是否有桶狀胸", "觸診胸管插入部位周圍皮膚是否有輾軋音(crepitus)", "聽診是否有鼾音/乾囉音(rhon-chi)"], "answer": 2, "explanation": "答案：觸診胸管插入部位周圍皮膚是否有輾軋音(crepitus)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「觸診胸管插入部位周圍皮膚是否有輾軋音(crepitus)」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「觸診胸管插入部位周圍皮膚是否有輾軋音(crepitus)」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「比較吸氣和吐氣的時間長度、視診是否有桶狀胸」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-033", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關胸腔水下引流護理之敘述，下列何者正確？", "options": ["水封瓶內應有持續性氣泡出現", "夾緊管路以減少壓力快速下降", "水封瓶內玻管內液面會隨呼吸上下移動", "須每天更換胸瓶內的無菌蒸餾水"], "answer": 2, "explanation": "答案：水封瓶內玻管內液面會隨呼吸上下移動\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「水封瓶內玻管內液面會隨呼吸上下移動」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「水封瓶內玻管內液面會隨呼吸上下移動」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「水封瓶內應有持續性氣泡出現、夾緊管路以減少壓力快速下降」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-034", "unit": "單元7 呼吸系統疾病與護理1", "question": "病人接受左肺切除術後使用胸管，下列護理措施何者最適當？", "options": ["監測水封瓶內液面的波動", "每班夾住胸管一次", "鼓勵咳嗽和深呼吸", "每2小時擠壓胸管一次"], "answer": 2, "explanation": "答案：鼓勵咳嗽和深呼吸\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「鼓勵咳嗽和深呼吸」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「鼓勵咳嗽和深呼吸」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「監測水封瓶內液面的波動、每班夾住胸管一次」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-035", "unit": "單元7 呼吸系統疾病與護理1", "question": "評估使用胸腔水下引流系統之病人，發現水封瓶長玻管內液面的高度隨著呼吸上下移動，下列何者正確？", "options": ["可能是胸管阻塞", "可能有皮下氣腫", "胸管引流功能正常", "胸管有漏氣情形"], "answer": 2, "explanation": "答案：胸管引流功能正常\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「胸管引流功能正常」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「胸管引流功能正常」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「可能是胸管阻塞、可能有皮下氣腫」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-036", "unit": "單元7 呼吸系統疾病與護理1", "question": "當發現胸腔術後病人的胸腔水下引流系統的水封瓶內出現大量氣泡時之處置，下列何者最適當？", "options": ["扭擠胸管", "減少抽吸壓力", "檢查引流系統有無漏氣處", "代表引流系統功能完好，無需處置"], "answer": 2, "explanation": "答案：檢查引流系統有無漏氣處\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「檢查引流系統有無漏氣處」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「檢查引流系統有無漏氣處」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「扭擠胸管、減少抽吸壓力」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-037", "unit": "單元7 呼吸系統疾病與護理1", "question": "協助醫師拔除胸管時，應指導病人採取下列何種呼吸方式？", "options": ["緩慢吸吐氣", "哈氣", "快速吸吐氣", "深吸氣後閉氣"], "answer": 3, "explanation": "答案：深吸氣後閉氣\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「深吸氣後閉氣」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「深吸氣後閉氣」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「緩慢吸吐氣、哈氣」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-038", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關移除胸管的護理措施，下列何者錯誤？", "options": ["水封瓶液面，隨呼吸上下浮動，表示可拔除胸管", "拔管前，應提前給予止痛劑", "拔管時，應請病人深吸氣後閉氣再拔出胸管", "拔管後，應以無菌凡士林紗布覆蓋傷口"], "answer": 0, "explanation": "答案：水封瓶液面，隨呼吸上下浮動，表示可拔除胸管\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「水封瓶液面，隨呼吸上下浮動，表示可拔除胸管」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「水封瓶液面，隨呼吸上下浮動，表示可拔除胸管」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「拔管前，應提前給予止痛劑、拔管時，應請病人深吸氣後閉氣再拔出胸管」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit7-039", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關氣管內管插管過程之敘述，下列何者正確？", "options": ["若病人有頭顱骨骨折時，較適合使用經鼻腔氣管內插管", "使用鼻腔氣管內插管時，病人為呼吸所需做的功較口腔氣管內插管者為大", "插管過程中應快速擠壓甦醒球，使達到高濃度氧氣的供應", "插管後測量吐氣中二氧化碳分壓為0時，表示插管位置正確"], "answer": 1, "explanation": "答案：使用鼻腔氣管內插管時，病人為呼吸所需做的功較口腔氣管內插管者為大\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「使用鼻腔氣管內插管時，病人為呼吸所需做的功較口腔氣管內插管者為大」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「使用鼻腔氣管內插管時，病人為呼吸所需做的功較口腔氣管內插管者為大」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「若病人有頭顱骨骨折時，較適合使用經鼻腔氣管內插管、插管過程中應快速擠壓甦醒球，使達到高濃度氧氣的供應」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-040", "unit": "單元7 呼吸系統疾病與護理1", "question": "在急救過程中需為成年病人放置氣管內插管之敘述，下列何者錯誤？", "options": ["依據病人的性別來做選擇", "氣管內管由口插入深度大約為25～27公分", "插管過程中，若血氧濃度下降至80%，應立即停止插管並給病人100%氧氣吸入3～5分鐘後，再嘗試插管", "插管過程中可執行沙立克操作法(Sellick Maneauver)以防止發生食物逆流導致吸入性危險"], "answer": 1, "explanation": "答案：氣管內管由口插入深度大約為25～27公分\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「氣管內管由口插入深度大約為25～27公分」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「氣管內管由口插入深度大約為25～27公分」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「依據病人的性別來做選擇、插管過程中，若血氧濃度下降至80%，應立即停止插管並給病人100%氧氣吸入3～5分鐘後，再嘗試插管」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit7-041", "unit": "單元7 呼吸系統疾病與護理1", "question": "評估接受氣管切開術後之病人，下列何者顯示病人可能發生皮下氣腫的合併症？", "options": ["在雙側上肺葉聽到爆裂音(crackles)", "觸診氣切周圍組織出現腫脹及爆裂感(crackling sensation)", "在雙側上肺葉聽到過度反響音(hyperresonance)", "出現呼吸困難"], "answer": 1, "explanation": "答案：觸診氣切周圍組織出現腫脹及爆裂感(crackling sensation)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「觸診氣切周圍組織出現腫脹及爆裂感(crackling sensation)」；氣胸與胸管題要抓胸腔壓力、引流系統與呼吸惡化\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「觸診氣切周圍組織出現腫脹及爆裂感(crackling sensation)」之所以是答案，是因為它符合本題核心判斷。胸管照護需保持系統低於胸腔、避免管路扭曲或牽拉、觀察水封波動與氣泡、評估引流量與呼吸狀態；不可任意夾管或抬高引流瓶。 其他選項如「在雙側上肺葉聽到爆裂音(crackles)、在雙側上肺葉聽到過度反響音(hyperresonance)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸管題先看位置、密閉性、波動氣泡與病人呼吸狀態。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-042", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關護理師給予氣切造口(tracheostomy)病人抽痰時，下列措施何者最重要？", "options": ["執行氣切造口護理", "聽診呼吸音", "給予抗焦慮劑", "評估血氧的變化"], "answer": 3, "explanation": "答案：評估血氧的變化\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「評估血氧的變化」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「評估血氧的變化」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「執行氣切造口護理、聽診呼吸音」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-043", "unit": "單元7 呼吸系統疾病與護理1", "question": "為病人由氣切口抽痰時，下列何種情況應停止抽吸？", "options": ["每分鐘心跳增加20次", "每分鐘心跳下降10次", "抽痰管放入氣切口達15秒", "週邊血氧飽和度下降至95%"], "answer": 2, "explanation": "答案：抽痰管放入氣切口達15秒\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「抽痰管放入氣切口達15秒」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「抽痰管放入氣切口達15秒」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「每分鐘心跳增加20次、每分鐘心跳下降10次」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-044", "unit": "單元7 呼吸系統疾病與護理1", "question": "評估使用呼吸器病人其氣管內管位置正確性的方式，下列何者最適當？", "options": ["評估病人的膚色", "監測病人的呼吸速率", "確認cuff內氣體的量", "聽診雙側呼吸音"], "answer": 3, "explanation": "答案：聽診雙側呼吸音\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「聽診雙側呼吸音」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「聽診雙側呼吸音」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「評估病人的膚色、監測病人的呼吸速率」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-045", "unit": "單元7 呼吸系統疾病與護理1", "question": "病人行氣管內插管後聽診呼吸音時，發現左側肺部呼吸音減弱但右側正常，下列何者為導致此情形最可能的原因？", "options": ["氣管內管插到食道中", "氣管內管插到右主支氣管內", "氣管內管插到氣管分叉處上", "病人有左肺肺炎"], "answer": 1, "explanation": "答案：氣管內管插到右主支氣管內\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「氣管內管插到右主支氣管內」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「氣管內管插到右主支氣管內」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「氣管內管插到食道中、氣管內管插到氣管分叉處上」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-046", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關呼吸器的使用，通常會設定每分鐘數次深呼吸，其所要預防之首要合併症，下列何者正確？", "options": ["氣胸", "肺栓塞", "肺炎", "肺擴張不全"], "answer": 3, "explanation": "答案：肺擴張不全\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「肺擴張不全」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「肺擴張不全」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「氣胸、肺栓塞」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-047", "unit": "單元7 呼吸系統疾病與護理1", "question": "照護因呼吸衰竭而使用呼吸器的病人，若呼吸器一直出現壓力過高的警示聲時，下列何者是可能導因？", "options": ["呼吸器管路扭結", "呼吸器管路鬆脫", "人工氣管內管的氣囊漏氣", "抽痰後的氧氣濃度未調回原設定"], "answer": 0, "explanation": "答案：呼吸器管路扭結\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「呼吸器管路扭結」；肺炎題要抓感染、痰液清除與氧合\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「呼吸器管路扭結」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「呼吸器管路鬆脫、人工氣管內管的氣囊漏氣」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit7-048", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關呼吸器出現壓力過低警示(low pressure alarm)之處理，下列何者最適當？", "options": ["給予抽痰", "檢查所有呼吸器管路的接頭是否鬆脫", "給予鎮靜劑及止痛劑", "安撫病人不要咬住口中的氣管內管"], "answer": 1, "explanation": "答案：檢查所有呼吸器管路的接頭是否鬆脫\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「檢查所有呼吸器管路的接頭是否鬆脫」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「檢查所有呼吸器管路的接頭是否鬆脫」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「給予抽痰、給予鎮靜劑及止痛劑」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-049", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關使用陽壓呼吸輔助器可能導致的合併症，下列何者正確？", "options": ["氣管擴張", "吐氣量增加", "靜脈回流減少", "交感神經興奮"], "answer": 2, "explanation": "答案：靜脈回流減少\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「靜脈回流減少」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「靜脈回流減少」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「氣管擴張、吐氣量增加」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-050", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關脫離呼吸器之護理措施，下列何者正確？", "options": ["採平躺姿勢讓病人休息", "避免家屬陪伴以免干擾治療", "依醫囑給予肌肉鬆弛劑以降低焦慮", "出現呼吸肌疲乏時，應接回呼吸器"], "answer": 3, "explanation": "答案：出現呼吸肌疲乏時，應接回呼吸器\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「出現呼吸肌疲乏時，應接回呼吸器」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「出現呼吸肌疲乏時，應接回呼吸器」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「採平躺姿勢讓病人休息、避免家屬陪伴以免干擾治療」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-051", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關氣管內插管病人之護理措施，下列何者錯誤？", "options": ["定時評估病人抽痰的需要以維持管路通暢", "維持氣管內管氣囊壓力在35 mmHg以預防管路滑脫", "灌食時搖高病人床頭30～45度以避免吸入性肺炎", "依醫囑給與鎮靜劑以預防非預期性拔管"], "answer": 1, "explanation": "答案：維持氣管內管氣囊壓力在35 mmHg以預防管路滑脫\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「維持氣管內管氣囊壓力在35 mmHg以預防管路滑脫」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「維持氣管內管氣囊壓力在35 mmHg以預防管路滑脫」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「定時評估病人抽痰的需要以維持管路通暢、灌食時搖高病人床頭30～45度以避免吸入性肺炎」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit7-052", "unit": "單元7 呼吸系統疾病與護理1", "question": "王先生病情穩定，拔除氣管內管後，主訴「我的痰多又黏稠，左邊胸部一咳就痛，我該怎麼辦？」下列護理措施何者錯誤？", "options": ["教導肌肉鬆弛技巧以降低焦慮", "教導橫膈式呼吸與噘嘴吐氣以改善通氣狀況", "教導每天攝取1000mL液體以防肺水腫", "協助下床活動以促進肺部擴張"], "answer": 2, "explanation": "答案：教導每天攝取1000mL液體以防肺水腫\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「教導每天攝取1000mL液體以防肺水腫」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「教導每天攝取1000mL液體以防肺水腫」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「教導肌肉鬆弛技巧以降低焦慮、教導橫膈式呼吸與噘嘴吐氣以改善通氣狀況」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit7-053", "unit": "單元7 呼吸系統疾病與護理1", "question": "病人移除人工氣道後，出現下列何種現象應做緊急處理？", "options": ["喘鳴", "偶有粉紅色痰", "聽診右側肺底有爆裂音", "每分鐘呼吸速率為26 次"], "answer": 0, "explanation": "答案：喘鳴\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「喘鳴」；氣喘題要抓支氣管收縮、發炎與可逆性呼氣氣流受限\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「喘鳴」之所以是答案，是因為它符合本題核心判斷。氣喘急性發作常有喘鳴、呼氣延長與呼吸困難，護理重點是評估呼吸音與尖峰呼氣流速、避免誘發因子、依醫囑使用支氣管擴張劑與抗發炎藥物。 其他選項如「偶有粉紅色痰、聽診右側肺底有爆裂音」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：氣喘常考短效支氣管擴張劑、誘發因子與發作時呼氣困難。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit7-054", "unit": "單元7 呼吸系統疾病與護理1", "question": "有關執行氣切造口術病人抽痰的敘述，下列何者不適當？", "options": ["抽吸壓力120～150 mmHg", "抽吸前給予氧氣吸入30～60秒", "抽痰管插入深度15～20公分", "抽痰完成後聽診呼吸音"], "answer": 2, "explanation": "答案：抽痰管插入深度15～20公分\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「抽痰管插入深度15～20公分」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「抽痰管插入深度15～20公分」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「抽吸壓力120～150 mmHg、抽吸前給予氧氣吸入30～60秒」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit8-001", "unit": "單元8 呼吸系統疾病與護理2", "question": "預防病人發生吸入性肺炎，下列護理措施何者錯誤？", "options": ["至少每2小時為無法活動的病人翻身", "意識不清的病人維持平臥", "吞嚥困難病人進食前要評估作嘔反射", "監測鼻胃管灌食病人的胃殘餘量"], "answer": 1, "explanation": "答案：意識不清的病人維持平臥\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「意識不清的病人維持平臥」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「意識不清的病人維持平臥」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「至少每2小時為無法活動的病人翻身、吞嚥困難病人進食前要評估作嘔反射」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit8-002", "unit": "單元8 呼吸系統疾病與護理2", "question": "一位被診斷為「疑似細菌性肺炎」的病人剛入院，最優先執行下列那一個醫囑？", "options": ["給與靜脈輸液1,000mL 0.9% Saline", "給與抗生素Ceftriaxone 1 gm IVF 60 minutes", "收集尿液標本送尿液分析", "收集痰液標本送培養檢驗"], "answer": 3, "explanation": "答案：收集痰液標本送培養檢驗\n作答關鍵：題目考優先順序，先處理會威脅生命或造成病情快速惡化的問題。 本題答案指向「收集痰液標本送培養檢驗」；肺炎題要抓感染、痰液清除與氧合\n解析：優先題要以 ABC、循環穩定、安全風險與急性變化來排序，而不是只選看起來常見的照護。 「收集痰液標本送培養檢驗」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「給與靜脈輸液1,000mL 0.9% Saline、給與抗生素Ceftriaxone 1 gm IVF 60 minutes」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 優先題先問自己：哪一項不先做會最快造成危險"}, {"id": "unit8-003", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者為肺炎病人最可能出現的臨床表徵？", "options": ["呼吸過慢(bradypnea)", "頸靜脈怒張(jugular vein distension)", "泡沫狀痰(frothy sputum)", "意識混亂(confusion)"], "answer": 3, "explanation": "答案：意識混亂(confusion)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「意識混亂(confusion)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「意識混亂(confusion)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「呼吸過慢(bradypnea)、頸靜脈怒張(jugular vein distension)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-004", "unit": "單元8 呼吸系統疾病與護理2", "question": "肺炎球菌感染之肺炎病人，其肺部檢查與評估會有下列何種異常發現？", "options": ["叩診胸腔會出現過度反響音(hyperresonance)", "觸診時觸覺震顫(tactile fremitus)會增強", "聽診全肺均有微細的爆裂音(fine crackles)", "視診兩側有不對稱的胸廓擴張"], "answer": 1, "explanation": "答案：觸診時觸覺震顫(tactile fremitus)會增強\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「觸診時觸覺震顫(tactile fremitus)會增強」；肺炎題要抓感染、痰液清除與氧合\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「觸診時觸覺震顫(tactile fremitus)會增強」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「叩診胸腔會出現過度反響音(hyperresonance)、聽診全肺均有微細的爆裂音(fine crackles)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-005", "unit": "單元8 呼吸系統疾病與護理2", "question": "肺炎發生時，於肺實質所產生的病生理變化，不包括下列何者？", "options": ["肺塌陷", "支氣管擴張症", "肺積水", "發炎反應"], "answer": 1, "explanation": "答案：支氣管擴張症\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「支氣管擴張症」；肺炎題要抓感染、痰液清除與氧合\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「支氣管擴張症」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「肺塌陷、肺積水」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-006", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者為細菌性肺炎病人必要的診斷檢查？①胸部電腦斷層②胸部X光攝影③肺功能檢查④痰液檢查：", "options": ["①③", "①④", "②③", "②④"], "answer": 3, "explanation": "答案：②④\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「②④」；肺炎題要抓感染、痰液清除與氧合\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「②④」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「①③、①④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-007", "unit": "單元8 呼吸系統疾病與護理2", "question": "細菌性肺炎病人在給予抗生素治療前，應先執行下列何項處置？", "options": ["血液檢體培養", "靜脈點滴輸液", "胸部X光攝影", "口服阿斯匹林"], "answer": 0, "explanation": "答案：血液檢體培養\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「血液檢體培養」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「血液檢體培養」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生 優先題要以 ABC、循環穩定、安全風險與急性變化來排序，而不是只選看起來常見的照護。 「調高給氧的流速，周邊血氧仍繼續下降且低於90%」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「咳出帶血絲(blood-tinged)的痰、聽診後側肺底出現些許的爆裂音(crackles)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 優先題先問自己：哪一項不先做會最快造成危險"}, {"id": "unit8-012", "unit": "單元8 呼吸系統疾病與護理2", "question": "病人因肺炎導致有膿痰不易咳出之護理措施，下列何者正確？", "options": ["每小時執行姿位引流", "限制水分的給予，以減少痰液", "給予氧氣，使血中氧氣濃度達到最高", "教導有效的咳嗽方式，使痰咳出"], "answer": 3, "explanation": "答案：教導有效的咳嗽方式，使痰咳出\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「教導有效的咳嗽方式，使痰咳出」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「教導有效的咳嗽方式，使痰咳出」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「每小時執行姿位引流、限制水分的給予，以減少痰液」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-013", "unit": "單元8 呼吸系統疾病與護理2", "question": "照護右上肺葉肺炎病人之護理措施，下列何者不適當？", "options": ["協助病人右側臥", "教導病人抱胸咳嗽", "將病人床頭抬高45度", "鼓勵病人下床活動"], "answer": 0, "explanation": "答案：協助病人右側臥\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「協助病人右側臥」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「協助病人右側臥」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「教導病人抱胸咳嗽、將病人床頭抬高45度」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit8-014", "unit": "單元8 呼吸系統疾病與護理2", "question": "張先生患有多重抗藥性結核病(MDR-TB)，表示其對何種藥物產生抗藥性？①Ethambutol ②Isoniazid③Pyrazinamide④Rifampin：", "options": ["①③", "①④", "②③", "②④"], "answer": 3, "explanation": "答案：②④\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「②④」；肺結核題要抓空氣傳染與完整服藥\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「②④」之所以是答案，是因為它符合本題核心判斷。肺結核需採空氣傳染防護，常見措施包括負壓病室、N95 防護與規則完成多重抗結核藥物療程，避免因症狀改善就停藥。 其他選項如「①③、①④」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：TB 題記住空氣隔離、N95、負壓與服藥完整性。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-015", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者為確診病人有無肺結核感染最準確的方式？", "options": ["支氣管鏡", "痰液培養", "胸部X光", "結核菌素皮膚試驗"], "answer": 1, "explanation": "答案：痰液培養\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「痰液培養」；肺炎題要抓感染、痰液清除與氧合\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「痰液培養」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「支氣管鏡、胸部X光」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-016", "unit": "單元8 呼吸系統疾病與護理2", "question": "肺結核初期最常見的症狀，下列何者正確？", "options": ["呼吸變慢", "乾咳", "咳嗽帶血", "咳嗽帶化膿性痰"], "answer": 1, "explanation": "答案：乾咳\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「乾咳」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「乾咳」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「呼吸變慢、咳嗽帶血」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-017", "unit": "單元8 呼吸系統疾病與護理2", "question": "住在護理之家的黃老先生因跌倒骨折送進醫院進行內固定，從胸部X光片中發現疑似肺結核感染，下列敘述何者錯誤？", "options": ["肺結核是屬於第三類法定傳染病，須在1週內通報", "若發現痰液培養有結核桿菌，表示具有傳染力，需進行呼吸道隔離措施", "第一線抗結核藥物包括Isoniazid(INH)、Rifampicin(RMP)、Rifabutin(RFB)與Kanamycin(KM)", "若為多重抗藥性結核病則屬第二類法定傳染病，須在24小時內通報"], "answer": 2, "explanation": "答案：第一線抗結核藥物包括Isoniazid(INH)、Rifampicin(RMP)、Rifabutin(RFB)與Kanamycin(KM)\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「第一線抗結核藥物包括Isoniazid(INH)、Rifampicin(RMP)、Rifabutin(RFB)與Kanamycin(KM)」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「第一線抗結核藥物包括Isoniazid(INH)、Rifampicin(RMP)、Rifabutin(RFB)與Kanamycin(KM)」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「肺結核是屬於第三類法定傳染病，須在1週內通報、若發現痰液培養有結核桿菌，表示具有傳染力，需進行呼吸道隔離措施」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit8-018", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關肺結核病之敘述，下列何者正確？", "options": ["原發性感染2～6個月後，結核菌素皮膚試驗才會呈現陽性反應", "原發性感染後，常見有咳嗽、發燒，不易診斷", "結核桿菌會經由無生命的物品傳染，急性期病人需要接觸性隔離", "結核菌感染治癒後，會產生終生免疫"], "answer": 1, "explanation": "答案：原發性感染後，常見有咳嗽、發燒，不易診斷\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「原發性感染後，常見有咳嗽、發燒，不易診斷」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「原發性感染後，常見有咳嗽、發燒，不易診斷」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「原發性感染2～6個月後，結核菌素皮膚試驗才會呈現陽性反應、結核桿菌會經由無生命的物品傳染，急性期病人需要接觸性隔離」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-019", "unit": "單元8 呼吸系統疾病與護理2", "question": "使用下列那一種肺結核治療藥物不需監測肝功能？", "options": ["Ethambutol (EMB)", "Isoniazid(INH)", "Pyrazinamide(PZA)", "Rifampin (RMP)"], "answer": 0, "explanation": "答案：Ethambutol (EMB)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「Ethambutol (EMB)」；肺結核題要抓空氣傳染與完整服藥\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「Ethambutol (EMB)」之所以是答案，是因為它符合本題核心判斷。肺結核需採空氣傳染防護，常見措施包括負壓病室、N95 防護與規則完成多重抗結核藥物療程，避免因症狀改善就停藥。 其他選項如「Isoniazid(INH)、Pyrazinamide(PZA)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：TB 題記住空氣隔離、N95、負壓與服藥完整性。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-020", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關服用抗結核菌藥物(Rifampin)病人尿液之顏色，下列何者正確？", "options": ["綠色", "橙色", "黑褐色", "藍色"], "answer": 1, "explanation": "答案：橙色\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「橙色」；肺結核題要抓空氣傳染與完整服藥\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「橙色」之所以是答案，是因為它符合本題核心判斷。肺結核需採空氣傳染防護，常見措施包括負壓病室、N95 防護與規則完成多重抗結核藥物療程，避免因症狀改善就停藥。 其他選項如「綠色、黑褐色」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：TB 題記住空氣隔離、N95、負壓與服藥完整性。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-021", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關肺結核藥物副作用的敘述，下列何者正確？", "options": ["Rifampin(RMP)容易加速口服避孕藥的代謝", "Pyrazinamide(PZA)容易造成視神經炎引起紅綠色區辨困難", "Isoniazid(INH)容易出現周邊神經炎以及第8對腦神經損傷", "Ethambutol(EMB)容易造成高尿酸血症"], "answer": 0, "explanation": "答案：Rifampin(RMP)容易加速口服避孕藥的代謝\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「Rifampin(RMP)容易加速口服避孕藥的代謝」；肺結核題要抓空氣傳染與完整服藥\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「Rifampin(RMP)容易加速口服避孕藥的代謝」之所以是答案，是因為它符合本題核心判斷。肺結核需採空氣傳染防護，常見措施包括負壓病室、N95 防護與規則完成多重抗結核藥物療程，避免因症狀改善就停藥。 其他選項如「Pyrazinamide(PZA)容易造成視神經炎引起紅綠色區辨困難、Isoniazid(INH)容易出現周邊神經炎以及第8對腦神經損傷」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：TB 題記住空氣隔離、N95、負壓與服藥完整性。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-022", "unit": "單元8 呼吸系統疾病與護理2", "question": "評估是否中止肺結核病人空氣傳染防護措施(airborne precaution)之指標，下列何者正確？", "options": ["病人痊癒", "皮膚測試結果為陰性", "體溫恢復正常", "痰液培養連續2次陰性反應"], "answer": 3, "explanation": "答案：痰液培養連續2次陰性反應\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「痰液培養連續2次陰性反應」；肺炎題要抓感染、痰液清除與氧合\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「痰液培養連續2次陰性反應」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「病人痊癒、皮膚測試結果為陰性」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-023", "unit": "單元8 呼吸系統疾病與護理2", "question": "肺結核病人若無法遵從醫師所開立的醫囑規則服藥時之護理措施，下列何者最適當？", "options": ["請照顧者監督病人定時服藥", "請病人每週回診，並詢問是否規則服藥", "告訴醫師病人未能遵從規則服藥，是否使用其他治療方式", "跟病人強調若不規則服藥，肺結核可能導致死亡"], "answer": 0, "explanation": "答案：請照顧者監督病人定時服藥\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「請照顧者監督病人定時服藥」；肺結核題要抓空氣傳染與完整服藥\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「請照顧者監督病人定時服藥」之所以是答案，是因為它符合本題核心判斷。肺結核需採空氣傳染防護，常見措施包括負壓病室、N95 防護與規則完成多重抗結核藥物療程，避免因症狀改善就停藥。 其他選項如「請病人每週回診，並詢問是否規則服藥、告訴醫師病人未能遵從規則服藥，是否使用其他治療方式」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：TB 題記住空氣隔離、N95、負壓與服藥完整性。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-024", "unit": "單元8 呼吸系統疾病與護理2", "question": "正在接受治療的開放性肺結核病人，其疾病對別人的傳染力將存在到何時為止？", "options": ["胸部X光顯示肺結核已痊癒", "連續3次痰液的抗酸菌(acid-fast bacilli)抹片檢體均為陰性反應", "持續按時服用肺結核藥物達6個月", "連續2次皮膚試驗(PPD)為陽性反應"], "answer": 1, "explanation": "答案：連續3次痰液的抗酸菌(acid-fast bacilli)抹片檢體均為陰性反應\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「連續3次痰液的抗酸菌(acid-fast bacilli)抹片檢體均為陰性反應」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「連續3次痰液的抗酸菌(acid-fast bacilli)抹片檢體均為陰性反應」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「胸部X光顯示肺結核已痊癒、持續按時服用肺結核藥物達6個月」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-025", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關治療肺結核常用藥物副作用之敘述，下列何者正確？", "options": ["Etham- butol會引起視神經炎", "Streptomycin 會引起周邊神經炎", "Pyra- zinamide 會引起聽力問題", "Isoniazid 會引起高尿酸血症"], "answer": 0, "explanation": "答案：Etham- butol會引起視神經炎\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「Etham- butol會引起視神經炎」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「Etham- butol會引起視神經炎」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「Streptomycin 會引起周邊神經炎、Pyra- zinamide 會引起聽力問題」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit8-026", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列動脈血液氣體分析的報告，何者最能顯示慢性阻塞性肺疾病(COPD)病人的情況惡化？", "options": ["pH 7.30，PaCO2 60mmHg，PaO2 70mmHg，HCO3- 30mEq/L", "pH 7.38，PaCO2 45mmHg，PaO2 88mmHg，HCO3- 24mEq/L", "pH 7.40，PaCO2 40mmHg，PaO2 94mmHg，HCO3- 22mEq/L", "pH 7.55，PaCO2 30mmHg，PaO2 80mmHg，HCO3- 26mEq/L"], "answer": 0, "explanation": "答案：pH 7.30，PaCO2 60mmHg，PaO2 70mmHg，HCO3- 30mEq/L\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「pH 7.30，PaCO2 60mmHg，PaO2 70mmHg，HCO3- 30mEq/L」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「pH 7.30，PaCO2 60mmHg，PaO2 70mmHg，HCO3- 30mEq/L」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「pH 7.38，PaCO2 45mmHg，PaO2 88mmHg，HCO3- 24mEq/L、pH 7.40，PaCO2 40mmHg，PaO2 94mmHg，HCO3- 22mEq/L」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-027", "unit": "單元8 呼吸系統疾病與護理2", "question": "全球慢性阻塞性肺疾病倡議組織(Global Initiative for Chronic Obstruc-tive Lung Disease; GOLD)將COPD嚴重度分為GOLD 1～4級，下列何者為分級依據？", "options": ["肺餘容積(RV)", "第一秒用力呼氣容積(FEV1)", "血氧濃度(SaO2)", "急性惡化的次數"], "answer": 1, "explanation": "答案：第一秒用力呼氣容積(FEV1)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「第一秒用力呼氣容積(FEV1)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「第一秒用力呼氣容積(FEV1)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「肺餘容積(RV)、血氧濃度(SaO2)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-028", "unit": "單元8 呼吸系統疾病與護理2", "question": "當慢性阻塞性肺疾病(COPD)病人出現下列何種評估結果時，護理師須優先採取因應措施？", "options": ["杵狀指", "白色濃痰", "使用呼吸輔助肌", "桶狀胸"], "answer": 2, "explanation": "答案：使用呼吸輔助肌\n作答關鍵：題目考優先順序，先處理會威脅生命或造成病情快速惡化的問題。 本題答案指向「使用呼吸輔助肌」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：優先題要以 ABC、循環穩定、安全風險與急性變化來排序，而不是只選看起來常見的照護。 「使用呼吸輔助肌」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「杵狀指、白色濃痰」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 優先題先問自己：哪一項不先做會最快造成危險"}, {"id": "unit8-029", "unit": "單元8 呼吸系統疾病與護理2", "question": "評估慢性阻塞性肺病(COPD)病人的呼吸道阻塞嚴重度，下列何者為最重要的評估指標？", "options": ["用力肺活量(FVC)", "第一秒鐘用力呼氣容積(FEV1)", "肺活量(VC)", "全肺容量(TLC)"], "answer": 1, "explanation": "答案：第一秒鐘用力呼氣容積(FEV1)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「第一秒鐘用力呼氣容積(FEV1)」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「第一秒鐘用力呼氣容積(FEV1)」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「用力肺活量(FVC)、肺活量(VC)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit8-030", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關慢性支氣管炎(chronic bronchitis)常見的臨床表徵下列何者錯誤？", "options": ["血比容＞60%", "夜間低血氧", "紅血球減少", "咳嗽有痰"], "answer": 2, "explanation": "答案：紅血球減少\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「紅血球減少」；COPD 題要抓慢性氣流受限、換氣效率差與呼吸訓練\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「紅血球減少」之所以是答案，是因為它符合本題核心判斷。COPD 護理重點是戒菸、噘嘴式呼吸、活動耐受訓練、營養支持與依醫囑給氧；若有 CO2 滯留風險，氧療需謹慎監測。 其他選項如「血比容＞60%、夜間低血氧」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：COPD 常考噘嘴式呼吸、低流量氧氣與避免呼吸抑制。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit8-031", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列何者降低時，可作為阻塞性肺疾病的特徵？", "options": ["DLCO(一氧化碳擴散容量)", "FEV1/FVC", "FEV25～75%", "RV"], "answer": 1, "explanation": "答案：FEV1/FVC\n作答關鍵：先判斷題幹是在
