幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「該疾病好發於年輕女性、容易因為冷的環境或壓力誘發」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-017", "unit": "單元12 心臟血管系統疾病與護理3", "question": "下肢動脈血管阻塞疾病病人會出現何種特徵？", "options": ["進食冰冷的食物後，下肢疼痛加劇", "平躺且下肢抬高時，下肢疼痛加劇", "步行時下肢疼痛，休息時疼痛消失", "抽菸時下肢疼痛，戒菸後疼痛消失"], "answer": 2, "explanation": "答案：步行時下肢疼痛，休息時疼痛消失\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「步行時下肢疼痛，休息時疼痛消失」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「步行時下肢疼痛，休息時疼痛消失」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「進食冰冷的食物後，下肢疼痛加劇、平躺且下肢抬高時，下肢疼痛加劇」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-018", "unit": "單元12 心臟血管系統疾病與護理3", "question": "下肢動脈功能不全病人最常出現下列何項臨床表徵？", "options": ["間歇性跛行", "內腳踝潰瘍", "下肢脈搏增強", "腳踝色素沈著"], "answer": 0, "explanation": "答案：間歇性跛行\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「間歇性跛行」；周邊動脈疾病題要抓組織灌流不足\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「間歇性跛行」之所以是答案，是因為它符合本題核心判斷。動脈灌流不足常見肢端冰冷、蒼白、疼痛、脈搏減弱與間歇性跛行；照護重點是戒菸、規律步行訓練、保護足部並避免受傷。 其他選項如「內腳踝潰瘍、下肢脈搏增強」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：動脈問題記「冷、痛、白、脈弱」；靜脈問題多是腫脹、沉重與色素沉著。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-019", "unit": "單元12 心臟血管系統疾病與護理3", "question": "為增進下肢動脈功能不全病人的下肢動脈血液循環，下列措施何者  最有效？", "options": ["步行活動", "下肢抬高", "腳底按摩", "下肢保暖"], "answer": 0, "explanation": "答案：步行活動\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「步行活動」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「步行活動」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「下肢抬高、腳底按摩」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-020", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關動脈硬化阻塞疾病(arteriosclerosis obliterans)的敘述，下列何者錯誤？", "options": ["病人會出現間歇性跛行、肢體蒼白、週邊觸診不到脈動", "晚期病人休息時肢體末端會有持續性、隱隱不適的疼痛", "手壓測定法(manual compression test)檢查時會發現病人微血管充盈緩慢", "指導病人勿穿過緊衣物以免影響循環"], "answer": 2, "explanation": "答案：手壓測定法(manual compression test)檢查時會發現病人微血管充盈緩慢\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「手壓測定法(manual compression test)檢查時會發現病人微血管充盈緩慢」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「手壓測定法(manual compression test)檢查時會發現病人微血管充盈緩慢」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「病人會出現間歇性跛行、肢體蒼白、週邊觸診不到脈動、晚期病人休息時肢體末端會有持續性、隱隱不適的疼痛」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-021", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關吸菸對動脈硬化阻塞疾病病人之影響，下列何者錯誤？", "options": ["動脈血管收縮", "心跳加快，心輸出量增加", "血液攜氧能力增加", "心肌需氧量增加"], "answer": 2, "explanation": "答案：血液攜氧能力增加\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「血液攜氧能力增加」；周邊動脈疾病題要抓組織灌流不足\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「血液攜氧能力增加」之所以是答案，是因為它符合本題核心判斷。動脈灌流不足常見肢端冰冷、蒼白、疼痛、脈搏減弱與間歇性跛行；照護重點是戒菸、規律步行訓練、保護足部並避免受傷。 其他選項如「動脈血管收縮、心跳加快，心輸出量增加」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：動脈問題記「冷、痛、白、脈弱」；靜脈問題多是腫脹、沉重與色素沉著。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-022", "unit": "單元12 心臟血管系統疾病與護理3", "question": "下列何者最可能為腹主動脈瘤病人的病史或身體檢查與評估的結果？", "options": ["出現腹部腫塊與血壓上升等現象", "聽診腹部，會聽到舒張期血管嘈音", "主訴腹部有心跳搏動感", "當疼痛轉移至下背部，表示症狀緩解"], "answer": 2, "explanation": "答案：主訴腹部有心跳搏動感\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「主訴腹部有心跳搏動感」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「主訴腹部有心跳搏動感」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「出現腹部腫塊與血壓上升等現象、聽診腹部，會聽到舒張期血管嘈音」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-023", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關腹主動脈瘤病人的護理措施，下列何者錯誤？", "options": ["維持收縮壓在100～120 mmHg 之間", "指導病人避免閉氣用力的動作", "協助手術後的病人採高坐臥姿", "詳細記錄病人輸出入量"], "answer": 2, "explanation": "答案：協助手術後的病人採高坐臥姿\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「協助手術後的病人採高坐臥姿」；主動脈瘤題要抓破裂風險與血壓控制\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「協助手術後的病人採高坐臥姿」之所以是答案，是因為它符合本題核心判斷。主動脈瘤需觀察腹背痛、搏動性腫塊、低血壓或休克等破裂徵象；護理上要避免增加腹壓並控制血壓，突發劇痛是危急警訊。 其他選項如「維持收縮壓在100～120 mmHg 之間、指導病人避免閉氣用力的動作」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：動脈瘤題看到突發腹痛、背痛、休克，要優先想到破裂。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-024", "unit": "單元12 心臟血管系統疾病與護理3", "question": "王先生經醫生診斷為柏格氏病(Buerger’s Disease)，下列敘述何者正確？", "options": ["與抽菸有關", "主要是周邊靜脈之阻塞", "好發在上肢", "走路無異狀"], "answer": 0, "explanation": "答案：與抽菸有關\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「與抽菸有關」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「與抽菸有關」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「主要是周邊靜脈之阻塞、好發在上肢」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-025", "unit": "單元12 心臟血管系統疾病與護理3", "question": "下肢周邊血管動脈疾病的護理指導，下列敘述何者正確？", "options": ["多攝取高飽和脂肪酸食物", "鼓勵促進下肢血循運動", "鼓勵抬高患肢", "給予局部熱敷"], "answer": 1, "explanation": "答案：鼓勵促進下肢血循運動\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「鼓勵促進下肢血循運動」；把題幹歸類到疾病表現、檢查判讀、藥物安全或護理措施，再用臨床安全原則排除干擾項\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「鼓勵促進下肢血循運動」之所以是答案，是因為它符合本題核心判斷。本題要從題幹情境判斷最合適的臨床概念；作答時不只看單一字眼，也要看選項是否符合病人安全、疾病機轉與照護優先順序。 其他選項如「多攝取高飽和脂肪酸食物、鼓勵抬高患肢」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：複習時把同類題整理成「關鍵症狀、危險徵象、檢查指標、護理禁忌」四欄，會比背單題更穩。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-026", "unit": "單元12 心臟血管系統疾病與護理3", "question": "周邊靜脈功能不足的臨床表徵，下列何者正確？", "options": ["間歇性跛行", "脈搏消失", "肢體水腫", "膚色蒼白"], "answer": 2, "explanation": "答案：肢體水腫\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「肢體水腫」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「肢體水腫」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「間歇性跛行、脈搏消失」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-027", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關深部血栓靜脈炎病人會出現之徵象，下列何者正確？", "options": ["Bulge sign", "Puddle sign", "Homan sign", "Tinel sign"], "answer": 2, "explanation": "答案：Homan sign\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「Homan sign」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「Homan sign」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「Bulge sign、Puddle sign」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-028", "unit": "單元12 心臟血管系統疾病與護理3", "question": "長期臥床不動病人容易出現靜脈血栓，主要原因為下列何者？", "options": ["靜脈血流鬱積", "血液凝集結塊", "血球異常增生", "靜脈管壁損傷"], "answer": 0, "explanation": "答案：靜脈血流鬱積\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「靜脈血流鬱積」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「靜脈血流鬱積」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「血液凝集結塊、血球異常增生」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-029", "unit": "單元12 心臟血管系統疾病與護理3", "question": "針對下肢深部靜脈血栓炎病人出現紅、腫、熱、痛的徵象與症狀之護理措施，下列何者不適宜？", "options": ["適度抬高下肢減輕腫脹", "按摩患處，以促進血液循環", "患肢應避免注射或其他侵入性治療", "每日評估並記錄患肢的腫脹情形"], "answer": 1, "explanation": "答案：按摩患處，以促進血液循環\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「按摩患處，以促進血液循環」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「按摩患處，以促進血液循環」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「適度抬高下肢減輕腫脹、患肢應避免注射或其他侵入性治療」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-030", "unit": "單元12 心臟血管系統疾病與護理3", "question": "病人下肢出現腫脹、發紅、溫熱感且霍曼氏徵象(Homan’s sign)呈陽性反應，下列何者為其最有可能的診斷？", "options": ["靜脈曲張", "周邊動脈阻塞", "深部靜脈栓塞", "右心衰竭"], "answer": 2, "explanation": "答案：深部靜脈栓塞\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「深部靜脈栓塞」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「深部靜脈栓塞」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「靜脈曲張、周邊動脈阻塞」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-031", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關評估交通靜脈與隱靜脈瓣功能之檢查，下列何者正確？", "options": ["逆流填充測驗(Retrograde filling test)", "霍曼氏徵象測驗(Homans’ sign test)", "墨菲氏徵象測驗(Murphy’s sign test)", "灌注測驗(Perfusion test)"], "answer": 0, "explanation": "答案：逆流填充測驗(Retrograde filling test)\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「逆流填充測驗(Retrograde filling test)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「逆流填充測驗(Retrograde filling test)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「霍曼氏徵象測驗(Homans’ sign test)、墨菲氏徵象測驗(Murphy’s sign test)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-032", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關低血壓的治療，下列敘述何者錯誤？", "options": ["給與β1接受器拮抗劑可以增加心跳速率，提高心輸出量", "給與α1接受器促進劑可以增加周邊血管阻力，使血壓升高", "採頭低腳高的姿勢是為了增加前負荷，提高心輸出量", "使用中劑量Dopamine 可以同時增加心輸出量與增加周邊血管阻力"], "answer": 0, "explanation": "答案：給與β1接受器拮抗劑可以增加心跳速率，提高心輸出量\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「給與β1接受器拮抗劑可以增加心跳速率，提高心輸出量」；高血壓題要抓長期控制、器官損傷與服藥遵從性\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「給與β1接受器拮抗劑可以增加心跳速率，提高心輸出量」之所以是答案，是因為它符合本題核心判斷。高血壓護理強調規律服藥、低鈉飲食、體重控制、運動、戒菸限酒與定期量血壓；即使症狀改善也不應自行停藥。 其他選項如「給與α1接受器促進劑可以增加周邊血管阻力，使血壓升高、採頭低腳高的姿勢是為了增加前負荷，提高心輸出量」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：高血壓常考「無症狀也要治療」與「不可自行停藥」。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-033", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關深部血栓靜脈炎病人之護理措施，下列何者不適當？", "options": ["協助抬高患肢臥床休息", "教導穿彈性襪", "注意是否有肺栓塞徵候", "提供患肢按摩以緩解不適"], "answer": 3, "explanation": "答案：提供患肢按摩以緩解不適\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「提供患肢按摩以緩解不適」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「提供患肢按摩以緩解不適」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「協助抬高患肢臥床休息、教導穿彈性襪」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit12-034", "unit": "單元12 心臟血管系統疾病與護理3", "question": "林空服員近日覺得小腿不適，護理師採取下列何項評估其深部靜脈栓塞？", "options": ["艾倫試驗(Allen test)", "霍曼氏徵象(Homan’s sign)", "抬腿試驗(leg raising test)", "克尼格氏徵象(Kernig’s sign)"], "answer": 1, "explanation": "答案：霍曼氏徵象(Homan’s sign)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「霍曼氏徵象(Homan’s sign)」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「霍曼氏徵象(Homan’s sign)」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「艾倫試驗(Allen test)、抬腿試驗(leg raising test)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-035", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關長時間靜脈注射抗生素引發靜脈炎的護理措施，下列何者錯誤？", "options": ["抬高患肢", "鼓勵活動", "立即拔除靜脈導管", "給予局部溫敷"], "answer": 1, "explanation": "答案：鼓勵活動\n作答關鍵：題目問的是錯誤敘述，要找出與疾病機轉、檢查或護理原則不一致的選項。 本題答案指向「鼓勵活動」；肺炎題要抓感染、痰液清除與氧合\n解析：題目問的是錯誤，因此正確答案不是要照做，而是指出該敘述與臨床概念不符。 「鼓勵活動」之所以是答案，是因為它符合本題核心判斷。肺炎照護包括評估發燒、咳嗽、痰液性質、呼吸音與血氧，鼓勵深呼吸咳嗽、補充水分、依醫囑使用抗生素並觀察療效。 其他選項如「抬高患肢、立即拔除靜脈導管」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：肺炎題常用「感染徵象＋呼吸評估＋促進排痰」來判斷。 遇到「錯誤／不正確」題，先標記否定字，避免把正確照護原則誤選掉"}, {"id": "unit12-036", "unit": "單元12 心臟血管系統疾病與護理3", "question": "預防靜脈曲張的護理指導，下列何者最適當？①避免外傷②下肢不宜抬高③不需特別控制體重④應規律運動：", "options": ["①③", "①④", "②③", "②④"], "answer": 1, "explanation": "答案：①④\n作答關鍵：題目問的是不適當或不可採用的敘述，要反向作答，找出最需要避免的選項。 本題答案指向「①④」；心衰竭題要分辨左心衰竭的肺部鬱血與右心衰竭的全身靜脈鬱血\n解析：題目問的是不適當，因此正確答案代表臨床上不應採取、需排除或與原則相反的內容。 「①④」之所以是答案，是因為它符合本題核心判斷。心衰竭護理重點包括每日同一時間量體重、評估呼吸困難與水腫、限制鈉與水分、依醫囑使用利尿劑並監測電解質。 其他選項如「①③、②③」多半代表較符合原則的敘述或較不危險的作法；本題真正要抓的是哪一項需要排除\n複習提醒：看到體重突然上升、端坐呼吸、濕囉音或下肢水腫，要想到體液滯留與心衰竭惡化。 看到「不適當／不宜／不可」時，先把題目轉成「哪一項不能做」，再判斷安全性"}, {"id": "unit12-037", "unit": "單元12 心臟血管系統疾病與護理3", "question": "使用Warfarin(CoumadinⓇ)預防深部靜脈栓塞(deep vein thrombosis; DVT)之護理指導，下列何者正確？①需定期監測凝血酶原時間(PT)②鼓勵多攝取銀杏、當歸③若出現血尿是正常的現象不需理會④宜使用電動刮鬍刀：", "options": ["①③", "①④", "②③", "②④"], "answer": 1, "explanation": "答案：①④\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「①④」；Warfarin 題要抓凝血監測與出血安全\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「①④」之所以是答案，是因為它符合本題核心判斷。Warfarin 主要以 PT/INR 追蹤抗凝效果，需注意牙齦出血、血尿、黑便、瘀青等出血徵象；維生素 K 攝取需穩定，不是完全禁食。 其他選項如「①③、②③」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：抗凝藥題看到 Warfarin 就想到 PT/INR、出血觀察與維生素 K。 作答時優先抓疾病關鍵字，再排除與安全、藥物或檢查原則相衝突的選項"}, {"id": "unit12-038", "unit": "單元12 心臟血管系統疾病與護理3", "question": "評估時請病人快速彎曲足背，如果出現小腿疼痛，表示為下列何種徵象？", "options": ["霍夫曼徵象(Hoffmann’s sign)", "霍克尼氏徵象(Hochne’s sign)", "霍伯氏徵象(Hope’s sign)", "霍曼氏徵象(Homan’s sign)"], "answer": 3, "explanation": "答案：霍曼氏徵象(Homan’s sign)\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「霍曼氏徵象(Homan’s sign)」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「霍曼氏徵象(Homan’s sign)」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺突發呼吸困難或胸痛等肺栓塞徵象。 其他選項如「霍夫曼徵象(Hoffmann’s sign)、霍克尼氏徵象(Hochne’s sign)」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：看到 DVT 或 Homan sign，最怕的是血栓脫落；按摩患肢通常是危險干擾項。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-039", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關下列狀況之病人，何者最不需服用抗凝血劑治療？", "options": ["心房纖維顫動", "剝離性動脈瘤", "心肌梗塞", "二尖瓣置換術"], "answer": 1, "explanation": "答案：剝離性動脈瘤\n作答關鍵：先判斷題幹是在考定義、症狀、檢查、治療或護理措施，再回到選項比對。 本題答案指向「剝離性動脈瘤」；缺血性心臟病題要先判斷疼痛型態、是否休息可緩解，以及是否已有心肌壞死證據\n解析：本題重點在辨認題幹所描述的核心概念，答案要能直接解釋題幹情境。 「剝離性動脈瘤」之所以是答案，是因為它符合本題核心判斷。心絞痛多與暫時性心肌缺氧有關；心肌梗塞則代表心肌壞死，常需評估心電圖、心肌酵素與持續胸痛，護理上要重視氧合、疼痛、生命徵象與再灌流時機。 其他選項如「心房纖維顫動、心肌梗塞」是干擾項，常見問題是太絕對、偏離題幹情境，或與病人安全及照護原則不一致\n複習提醒：胸痛題先抓「持續時間、休息或硝酸甘油是否緩解、心電圖與酵素變化」。 複習時把題目整理成「病因／表現／檢查／治療／護理」其中一類，會更容易判斷"}, {"id": "unit12-040", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關搭飛機長程旅行後常會出現深部靜脈栓塞的主要原因，下列何者正確？", "options": ["靜脈內皮細胞受損", "血液凝固性增加", "血液鬱積", "血管收縮"], "answer": 2, "explanation": "答案：血液鬱積\n作答關鍵：題目問正確或適當作法，要選出最符合病理機轉、檢查目的與護理安全的選項。 本題答案指向「血液鬱積」；深部靜脈栓塞題要連到血栓脫落與肺栓塞風險\n解析：這類題要把題幹情境與選項逐一比對，選出最符合照護原則的一項。 「血液鬱積」之所以是答案，是因為它符合本題核心判斷。DVT 照護重點是觀察腫脹疼痛、避免按摩患肢、依醫囑抗凝、促進安全活動並警覺     const GROUP_SIZE = 20;

      unit5: '單元5 腫瘤疾病與護理',

    };
    let currentIndex = 0;

    const wrongCountNode = document.getElementById('wrong-count');
    const progressFill = document.getElementById('progress-fill');

    function buildUnits() {
      const unitMap = new Map();
      questions.forEach((item) => {
        if (!unitMap.has(item.unit)) unitMap.set(item.unit, []);
        unitMap.get(item.unit).push(item);
      });
      return [...unitMap.entries()].map(([name, unitQuestions]) => {
        const unitKey = unitQuestions[0]?.id.split('-')[0] ?? '';
        return {
          name,
          displayName: unitNameMap[unitKey] ?? name,
          questions: unitQuestions
        };
      });
    }

    const units = buildUnits();

    function buildPracticeGroups() {
      return units.flatMap((unit) => {
        const unitKey = unit.questions[0]?.id.split('-')[0] ?? '';
        const groups = [];
        for (let start = 0; start < unit.questions.length; start += GROUP_SIZE) {
          const questionStart = start + 1;
          const questionEnd = Math.min(start + GROUP_SIZE, unit.questions.length);
          const groupNumber = Math.floor(start / GROUP_SIZE) + 1;
          groups.push({
            id: `${unitKey}-group-${groupNumber}`,
            unitName: unit.name,
            unitDisplayName: unit.displayName,
            groupNumber,
            questionStart,
            questionEnd,
            questions: unit.questions.slice(start, start + GROUP_SIZE)
          });
        }
        return groups;
      });
    }

    const practiceGroups = buildPracticeGroups();

    function updateProgress() {
      currentNumber.textContent = String(Math.min(currentIndex + 1, Math.max(activeQuestions.length, 1)));
      totalNumber.textContent = String(activeQuestions.length);
      correctCountNode.textContent = String(correctCount);
      wrongCountNode.textContent = String(wrongCount);
      const ratio = activeQuestions.length ? (currentIndex / activeQuestions.length) * 100 : 0;
      progressFill.style.width = `${ratio}%`;
      nextButton.disabled = !answeredCurrent;
      nextButton.classList.toggle('enabled', answeredCurrent);
    }

    function renderUnitSelection() {
      currentScreen = 'units';
      unitSelection.hidden = false;
      quizScreen.hidden = true;
      unitList.innerHTML = '';

      practiceGroups.forEach((group) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'unit-card';
        button.innerHTML = `
          <div class="unit-card-title">${group.unitDisplayName} · 第 ${group.groupNumber} 組</div>
          <div class="unit-card-meta">第 ${group.questionStart}-${group.questionEnd} 題 · ${group.questions.length} 題</div>
        `;
        button.addEventListener('click', () => startGroup(group.id));
        unitList.appendChild(button);
      });
    }

    function startGroup(groupId) {
      const match = practiceGroups.find((group) => group.id === groupId);
      if (!match || !match.questions.length) {
        return;
      }
      activeUnitName = `${match.unitDisplayName} · 第 ${match.groupNumber} 組`;
      activeQuestions = match.questions;
      currentIndex = 0;
      correctCount = 0;
      wrongCount = 0;
      answeredCurrent = false;
      currentScreen = 'quiz';
      renderScreen();
    }

    function renderQuestion() {
      const item = activeQuestions[currentIndex];
      answeredCurrent = false;
      sessionStatus.textContent = '本輪進行中';
      unitLabel.textContent = activeUnitName;
      questionText.textContent = item.question;
      explanationText.textContent = item.explanation;
      explanation.classList.remove('show');
      options.innerHTML = '';
      item.options.forEach((label, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        button.textContent = `${String.fromCharCode(65 + index)}. ${label}`;
        button.addEventListener('click', () => handleAnswer(index));
        options.appendChild(button);
      });
      nextButton.textContent = '下一題';
      updateProgress();
    }

    function handleAnswer(selectedIndex) {
      if (answeredCurrent) return;
      answeredCurrent = true;
      const item = activeQuestions[currentIndex];
      const buttons = [...options.querySelectorAll('.option')];
      buttons.forEach((button) => {
        button.disabled = true;
      });
      if (selectedIndex === item.answer) {
        correctCount += 1;
        buttons[selectedIndex].classList.add('correct');
      } else {
        wrongCount += 1;
        buttons[selectedIndex].classList.add('wrong');
        buttons[item.answer].classList.add('correct');
      }
      explanation.classList.add('show');
      updateProgress();
    }

    function showCompletion() {
      sessionStatus.textContent = '本輪完成';
      unitLabel.textContent = activeUnitName;
      questionText.textContent = `你已完成 ${activeQuestions.length} 題`;
      options.innerHTML = '';
      answeredCurrent = true;
      explanation.classList.add('show');
      explanationText.textContent = `答對 ${correctCount} 題，錯題 ${wrongCount} 題。按下方按鈕可重新開始本單元。`;
      nextButton.textContent = '重新開始';
      nextButton.disabled = false;
      nextButton.classList.add('enabled');
      progressFill.style.width = '100%';
    }

    function renderScreen() {
      if (currentScreen === 'units') {
        renderUnitSelection();
        return;
      }
      unitSelection.hidden = true;
      quizScreen.hidden = false;
      renderQuestion();
    }

    nextButton.addEventListener('click', () => {
      if (!answeredCurrent && activeQuestions.length) return;
      if (!activeQuestions.length) return;
      if (currentIndex === activeQuestions.length - 1 && nextButton.textContent === '下一題') {
        showCompletion();
        return;
      }
      if (nextButton.textContent === '重新開始') {
        currentIndex = 0;
        correctCount = 0;
        wrongCount = 0;
        renderQuestion();
        return;
      }
      currentIndex += 1;
      renderQuestion();
    });

    backToUnitsButton.addEventListener('click', () => {
      activeUnitName = '';
      activeQuestions = [];
      currentIndex = 0;
      correctCount = 0;
      wrongCount = 0;
      answeredCurrent = false;
      currentScreen = 'units';
      renderScreen();
    });

    renderScreen();
  </script>
</body>
</html>
