<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>內外護理刷題</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: rgba(255, 255, 255, 0.9);
      --line: #d5dde8;
      --text: #18324d;
      --muted: #6d7f95;
      --blue: #4b86d4;
      --green: #37a86e;
      --red: #dc6e64;
      --note: #fff8de;
      --shadow: 0 14px 32px rgba(24, 50, 77, 0.09);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(75, 134, 212, 0.18), transparent 30%),
        linear-gradient(180deg, #f8f4ee 0%, #edf4fb 100%);
      min-height: 100vh;
    }
    .shell {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 16px 16px 36px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .progress-panel {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 16px;
    }
    .meta-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }
    .unit-label {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--blue);
    }
    .progress-copy {
      margin-top: 8px;
      font-size: 19px;
      font-weight: 800;
    }
    .scoreboard {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    .progress-bar {
      margin-top: 12px;
      height: 10px;
      background: #dfe8f2;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #5c98df, #37a86e);
      transition: width 0.18s ease;
    }
    .question-panel {
      margin-top: 16px;
      padding: 18px;
    }
    .question-text {
      margin: 0;
      line-height: 1.7;
      font-size: 20px;
    }
    .options {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .option {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      font-size: 16px;
      line-height: 1.6;
      box-shadow: 0 5px 14px rgba(24, 50, 77, 0.04);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .option:active {
      transform: scale(0.985);
    }
    .option.correct {
      background: #e8f7ee;
      border-color: var(--green);
      color: #155638;
    }
    .option.wrong {
      background: #fdeceb;
      border-color: var(--red);
      color: #8b2d28;
    }
    .option:disabled {
      opacity: 1;
    }
    .explanation {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid #f0dd9c;
      background: var(--note);
      line-height: 1.75;
    }
    .explanation.show {
      display: block;
    }
    .explanation-title {
      font-weight: 800;
    }
    .explanation-text {
      margin: 8px 0 0;
    }
    .next-button {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 17px;
      font-weight: 800;
      color: #f8fbff;
      background: #b9cade;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .next-button.enabled {
      background: linear-gradient(135deg, #4c88d6, #2f6ec7);
    }
    .next-button:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel progress-panel">
      <div class="meta-top">
        <span>護理刷題</span>
        <span id="session-status">本輪進行中</span>
      </div>
      <div id="unit-label" class="unit-label"></div>
      <div class="progress-copy">第 <span id="current-number">1</span> / <span id="total-number">1</span> 題</div>
      <div class="scoreboard">答對 <span id="correct-count">0</span> · 錯題 <span id="wrong-count">0</span></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    </section>
    <section class="panel question-panel">
      <h1 id="question-text" class="question-text"></h1>
      <div id="options" class="options"></div>
      <section id="explanation" class="explanation">
        <div class="explanation-title">解析</div>
        <p id="explanation-text" class="explanation-text"></p>
      </section>
      <button id="next-button" class="next-button" disabled>下一題</button>
    </section>
  </main>
  <script>
    const questions = [{"id": "unit5-001", "unit": "單元5 腫瘤疾病與護理", "question": "有關良性腫瘤及惡性腫瘤之敘述，下列何者正確？", "options": ["惡性腫瘤因沒有包膜，手術治療成效佳", "不管良性或惡性腫瘤，細胞排列皆不規則", "良性腫瘤以浸潤方式侵入周圍組織", "良性腫瘤若生長於密閉空間，會阻塞管腔產生各種症狀"], "answer": 3, "explanation": "本題正確答案為「良性腫瘤若生長於密閉空間，會阻塞管腔產生各種症狀」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-002", "unit": "單元5 腫瘤疾病與護理", "question": "有關惡性腫瘤特徵的敘述，下列何者正確？①細胞通常分化不良②腫瘤通常有被膜包覆③生長速度通常很迅速④易轉移易復發：", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": 2, "explanation": "本題正確答案為「①③④」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-003", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌細胞特性之敘述，下列何者錯誤？", "options": ["細胞上的P53基因容易受損而抑制細胞修復", "生長所需的養分比正常細胞少", "在生長時，會有接觸抑制(contact inhibition)作用", "細胞的有絲分裂指數(mito-tic index)高，增殖快"], "answer": 2, "explanation": "本題正確答案為「在生長時，會有接觸抑制(contact inhibition)作用」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-004", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌細胞轉移之敘述，下列何者錯誤？", "options": ["轉移是指癌細胞從原發部位擴散至身體其他組織器官", "惡性肉瘤(sarcoma)常以淋巴轉移方式轉移到其他部位", "常見轉移方式為淋巴轉移、血流轉移及體腔內播種式生長", "肺、肝及骨骼為原發性癌症常見轉移部位"], "answer": 1, "explanation": "本題正確答案為「惡性肉瘤(sarcoma)常以淋巴轉移方式轉移到其他部位」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-005", "unit": "單元5 腫瘤疾病與護理", "question": "下列腫瘤何者源自結締組織？", "options": ["滑液膜肉瘤(synovial-sarcoma)", "軟骨肉瘤(chondrosarcoma)", "血管肉瘤(angiosarcoma)", "淋巴管肉瘤(lymphangiosarcoma)"], "answer": 1, "explanation": "軟骨、硬骨屬於結締組織；滑液膜屬於滑膜組織；血管依據種類含有上皮組織、平滑肌、膜、膠原纖維。"}, {"id": "unit5-006", "unit": "單元5 腫瘤疾病與護理", "question": "有關病毒感染與罹患癌症相關性之敘述，下列何者錯誤？", "options": ["A型肝炎病毒導致肝癌", "EB病毒導致鼻咽癌", "巨細胞病毒導致子宮頸癌", "幽門螺旋桿菌導致胃癌"], "answer": 0, "explanation": "本題正確答案為「A型肝炎病毒導致肝癌」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-007", "unit": "單元5 腫瘤疾病與護理", "question": "周女士，52歲，本身有高血壓及乳癌家族史，有抽菸，在一次回診時表示自己年紀越來越大，很擔心會跟媽媽一樣罹癌，下列建議何者錯誤？", "options": ["不用過度擔心，若自覺乳房有異狀再做乳房攝影", "鼓勵戒菸、轉介戒菸門診", "將運動融入生活，可以走樓梯代替搭電梯等", "適度日曬，促進維生素D合成"], "answer": 0, "explanation": "本題正確答案為「不用過度擔心，若自覺乳房有異狀再做乳房攝影」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-008", "unit": "單元5 腫瘤疾病與護理", "question": "王先生，67歲，體重90公斤，BMI：30 kg/m2，平時菸酒不離手且愛吃醃漬食品，下列護理措施何者不適宜？", "options": ["飲食可不用限制", "轉介減重門診", "建議增加蔬菜水果攝取，每天至少攝取5份", "轉介院內戒菸門診"], "answer": 0, "explanation": "本題正確答案為「飲食可不用限制」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-009", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症危險因子的敘述，下列何者錯誤？", "options": ["吃檳榔會增加口腔癌的發生率", "荷爾蒙治療會增加子宮內膜癌的發生率", "長期接觸甲醛會增加大腸癌的發生率", "長期吸入石綿會增加肺癌的發生率"], "answer": 2, "explanation": "本題正確答案為「長期接觸甲醛會增加大腸癌的發生率」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-010", "unit": "單元5 腫瘤疾病與護理", "question": "下列何者為避免結腸癌的保護因子？①鼓勵食用紅肉②不需限制油脂的攝取③維持適當的體重④維持規律運動⑤補充適當的纖維攝取：", "options": ["①③⑤", "②③④", "②④⑤", "③④⑤"], "answer": 3, "explanation": "本題正確答案為「③④⑤」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-011", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症初級預防之敘述，下列何者錯誤？", "options": ["避免隨便服藥、減少菸酒", "均衡飲食，多吃新鮮蔬菜、水果", "養成規律運動習慣", "定期接受身體檢查"], "answer": 3, "explanation": "本題正確答案為「定期接受身體檢查」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-012", "unit": "單元5 腫瘤疾病與護理", "question": "長期攝取低纖維或精緻飲食，可能與下列何種癌症的發生最有關？", "options": ["胃癌", "肝癌", "大腸癌", "乳癌"], "answer": 2, "explanation": "本題正確答案為「大腸癌」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-013", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症與腫瘤標記間的關係，下列何者較具顯著性？①肝癌-CEA②前列腺癌-PSA③乳癌-AFB④鼻咽癌-EBV：", "options": ["①②", "②③", "②④", "③④"], "answer": 2, "explanation": "本題正確答案為「②④」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-014", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症常見的腫瘤標記之敘述，下列何者錯誤？", "options": ["CA19-9為乳癌的腫瘤標記", "CA125為卵巢癌的腫瘤標記", "AFP為肝癌的腫瘤標記", "CEA為大腸直腸癌的腫瘤標記"], "answer": 0, "explanation": "本題正確答案為「CA19-9為乳癌的腫瘤標記」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-015", "unit": "單元5 腫瘤疾病與護理", "question": "有關常見腫瘤標記的應用，下列何者正確？①癌胚抗原(CEA)可監測結腸直腸癌治療效果②癌抗原125(CA125)可監測胰臟癌與消化道腫瘤③前列腺特異抗原(PSA)為前列腺癌的偵測與治療指標④癌抗原15-3(CA15-3)可監測晚期或合併遠端轉移乳癌之治療反應⑤α-胎兒蛋白(AFP)為監測肺癌治療後的指標：", "options": ["①②⑤", "①③④", "②③④", "②③⑤"], "answer": 1, "explanation": "本題正確答案為「①③④」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-016", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症診斷檢查之敘述，下列何者錯誤？", "options": ["自組織中刮取而得，所做之細胞學檢查是確立癌症診斷最有效的方法", "血糖過高之糖尿病病人接受正子掃描檢查，易造成偽陽性結果", "裝有心臟節律器的病人不能接受核磁共振攝影檢查", "接受需注射顯影劑的胸部電腦斷層檢查者，在檢查前數小時需禁食"], "answer": 0, "explanation": "本題正確答案為「自組織中刮取而得，所做之細胞學檢查是確立癌症診斷最有效的方法」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-017", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症病人臨床實驗室檢查結果之敘述，下列何者正確？", "options": ["白血球數目一定是低於正常值", "骨骼轉移，常出現高血鈣情形", "化學治療破壞細胞，會使尿酸降低", "腫瘤指標可作為診斷的依據"], "answer": 1, "explanation": "本題正確答案為「骨骼轉移，常出現高血鈣情形」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-018", "unit": "單元5 腫瘤疾病與護理", "question": "下列何種檢查沒有輻射危害？", "options": ["骨掃描", "電腦斷層", "正子掃描", "核磁共振攝影"], "answer": 3, "explanation": "本題正確答案為「核磁共振攝影」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-019", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症手術治療特性之敘述，下列何者正確？", "options": ["冷凍手術是一種診斷疾病分期的手術", "手術治療是切除原發癌或已轉移的固態實質腫瘤", "手術適用於細胞分化差、生長快速且局部的腫瘤", "雷射手術優點是切除腫瘤組織，但會增加手術出血的危險"], "answer": 1, "explanation": "本題正確答案為「手術治療是切除原發癌或已轉移的固態實質腫瘤」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-020", "unit": "單元5 腫瘤疾病與護理", "question": "有關原發性癌症最常轉移的部位，下列何者較少發生？", "options": ["肝", "腎", "腦", "骨骼"], "answer": 1, "explanation": "本題正確答案為「腎」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-021", "unit": "單元5 腫瘤疾病與護理", "question": "有關TNM分類系統之敘述，下列何者錯誤？", "options": ["TIS代表原位癌", "NX代表臨床上無法評估局部淋巴結", "M1代表遠端轉移有固定部位", "G4代表癌症細胞分化良好"], "answer": 3, "explanation": "本題正確答案為「G4代表癌症細胞分化良好」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-022", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症分期系統類型之敘述，下列何者錯誤？", "options": ["治療前的臨床分期，可以cTNM表示", "手術後切除病理組織做的分期，可以sTNM表示", "復發或再次治療，可以rTNM表示", "治療後分期，可用ycTNM表示"], "answer": 1, "explanation": "本題正確答案為「手術後切除病理組織做的分期，可以sTNM表示」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-023", "unit": "單元5 腫瘤疾病與護理", "question": "有關癌症治療的敘述，下列何者正確？", "options": ["採取單一治療方式效果最好", "疾病分期是治療方式的唯一考量", "姑息性治療以減輕症狀為考量", "控制癌症的治療目標是將腫瘤完全切除"], "answer": 2, "explanation": "本題正確答案為「姑息性治療以減輕症狀為考量」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-024", "unit": "單元5 腫瘤疾病與護理", "question": "下列何種細胞的分裂速度最慢？", "options": ["神經元細胞", "骨髓幹細胞", "毛囊上皮細胞", "生殖細胞"], "answer": 0, "explanation": "本題正確答案為「神經元細胞」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit5-025", "unit": "單元5 腫瘤疾病與護理", "question": "化學治療經常是利用癌細胞不易進入細胞週期中的那一時期，以達到毒殺癌細胞的目的？", "options": ["G0休止期", "G1準備/合成前期", "G2合成後期", "S合 t8-060", "unit": "單元8 呼吸系統疾病與護理2", "question": "有關氣喘病人常用藥物作用之敘述，下列何者錯誤？", "options": ["使用吸入型乙二型交感神經興奮劑緩解支氣管痙攣", "使用類固醇抑制呼吸道黏膜炎症反應", "使用吸入型巨細胞抑制劑減輕呼吸道炎症程度", "使用抗生素治療病毒感染"], "answer": 3, "explanation": "本題正確答案為「使用抗生素治療病毒感染」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit8-061", "unit": "單元8 呼吸系統疾病與護理2", "question": "李先生為氣喘病人，目前使用Aminophylline靜脈輸注溶液，護理師得知李先生血清中的Theophylline濃度為12μg/mL，此時最適當的護理措施為何？", "options": ["立即告知主治醫師檢驗報告的數值", "繼續使用Aminophylline輸注溶液", "將輸注溶液更換為不含Aminophylline的點滴溶液", "聯絡檢驗部門確認數值是否有誤"], "answer": 1, "explanation": "本題正確答案為「繼續使用Aminophylline輸注溶液」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit8-062", "unit": "單元8 呼吸系統疾病與護理2", "question": "氣喘病人使用下列何種定量吸入劑後要漱口？", "options": ["Aminophylline", "Pulmicort(budesonide)", "Atrovent(ipratropium)", "Intal(cromolyn sodium)"], "answer": 1, "explanation": "本題正確答案為「Pulmicort(budesonide)」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit8-063", "unit": "單元8 呼吸系統疾病與護理2", "question": "關以定量吸入器(MDI)方式給藥的敘述，下列何者錯誤？", "options": ["全身副作用較小", "使用後需要漱口", "使用時需快速深吸氣", "吸完藥物後要閉氣約5～10 秒"], "answer": 2, "explanation": "本題正確答案為「使用時需快速深吸氣」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit8-064", "unit": "單元8 呼吸系統疾病與護理2", "question": "氣喘病人使用尖峰吐氣流量器(peak flow meter)的護理指導，下列何者正確？", "options": ["可以反應氣道狹窄的程度", "尖峰吐氣流量落於紅色區段時，應增加長效型的支氣管擴張劑", "每一次測量連續作3次，取其最低的數據作為記錄", "測量時應先將氣吐盡，然後經由含口器大量吸氣"], "answer": 0, "explanation": "本題正確答案為「可以反應氣道狹窄的程度」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit8-065", "unit": "單元8 呼吸系統疾病與護理2", "question": "下列氣喘病人自我照顧之敘述，何者顯示其有正確的認知？", "options": ["當我一感到呼吸不順，就會立即使用類固醇吸入劑", "我只有在與醫師溝通後，才會調整我家中使用的氧氣濃度", "如果我每天夜裡僅出現一次呼吸困難，那就表示我的藥物已發生效用", "如果我的尖峰吐氣流速維持在預期值80%以上，就不需做藥物的調整"], "answer": 3, "explanation": "本題正確答案為「如果我的尖峰吐氣流速維持在預期值80%以上，就不需做藥物的調整」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit8-066", "unit": "單元8 呼吸系統疾病與護理2", "question": "陳女士是氣喘病人，過去四週內發生：日間出現氣喘症狀每週一次、因氣喘在夜間醒來兩次、日常活動未因氣喘受影響、需要使用藥物緩解症狀每週超過兩次。依照GINA(Global Initiative for Asthma, 2019)對氣喘控制程度，其屬於下列何者？", "options": ["控制良好", "部分控制", "控制不佳", "控制很差"], "answer": 1, "explanation": "本題正確答案為「部分控制」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit8-067", "unit": "單元 表面張力素", "第3類巨噬細胞吞噬外來物", "柯恩氏孔(pores of Kohn)的氣體流通"], "answer": 1, "explanation": "本題正確答案為「第2類細胞分泌表面張力素」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-006", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關急性呼吸窘迫症候群(ARDS)病生理變化的敘述，下列何者正確？", "options": ["微血管細胞膜的通透性增加，導致肺水腫", "肺泡過度擴張導致呼吸道阻力下降", "肺泡表面張力素過度分泌，導致肺泡過度撐大", "支氣管擴張導致進入肺的氣體流量下降"], "answer": 0, "explanation": "本題正確答案為「微血管細胞膜的通透性增加，導致肺水腫」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-007", "unit": "單元9 呼吸系統疾病與護理3", "question": "急性呼吸窘迫症候群(ARDS)主要的臨床表徵包括那些？①白肺(white out)②D(A-a)O2增至200～500mmHg③功能性肺餘容量(FRC)增加④治療無效的血氧過低(refractory hypoxemia)⑤肺微血管楔壓(PCWP)＞12 mmHg：", "options": ["①②④", "①③⑤", "②③④", "②④⑤"], "answer": 0, "explanation": "本題正確答案為「①②④」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-008", "unit": "單元9 呼吸系統疾病與護理3", "question": "急性呼吸窘迫症候群病人使用呼氣末正壓(PEEP)的目的，下列何者正確？", "options": ["協助打開氣管及支氣管", "減少功能性肺餘容積", "減少分流情形", "可增加胸內靜脈回流"], "answer": 2, "explanation": "本題正確答案為「減少分流情形」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-009", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關促進急性呼吸窘迫症候群(ARDS)病人有效呼吸道清除的護理措施，下列何者正確？", "options": ["每2小時給氧", "每4小時翻身", "給予鎮靜劑以促進休息", "若咳嗽無效，可進行抽痰"], "answer": 3, "explanation": "本題正確答案為「若咳嗽無效，可進行抽痰」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-010", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關急性呼吸窘迫症候群(ARDS)的處置，下列何者錯誤？", "options": ["使用濃縮紅血球以維持正常血色素來增加攜氧能力", "使用膠質溶液以減少微血管滲漏程度", "使用升壓劑以改善心輸出量不足現象", "使用陽壓呼吸器以降低功能性肺餘容積"], "answer": 3, "explanation": "本題正確答案為「使用陽壓呼吸器以降低功能性肺餘容積」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-011", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關使用呼氣末期陽壓(PEEP)治療急性呼吸窘迫症候群的主要目的，下列何者正確？", "options": ["可避免肺纖維化的產生", "可使吸氣時有更多氣體帶入肺內", "可將100%的氧氣帶入肺內", "可避免吐氣時肺泡塌陷"], "answer": 3, "explanation": "本題正確答案為「可避免吐氣時肺泡塌陷」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-012", "unit": "單元9 呼吸系統疾病與護理3", "question": "下列那一種肺癌生長最快速，且最惡性但對化學及放射線治療敏感？", "options": ["小細胞肺癌", "鱗狀細胞癌", "肺腺癌", "大細胞肺癌"], "answer": 0, "explanation": "本題正確答案為「小細胞肺癌」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-013", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺癌常見的轉移部位，下列何者錯誤？", "options": ["腦部", "胰臟", "骨骼", "肝臟"], "answer": 1, "explanation": "本題正確答案為「胰臟」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-014", "unit": "單元9 呼吸系統疾病與護理3", "question": "一位有抽菸習慣的病人向護理師詢問：「你們說抽菸傷肺，抽菸到底是如何傷害我的肺？」，護理師應如何正確回答？", "options": ["抽菸會影響你咳嗽及嘔吐反射的能力", "抽菸會影響你呼吸道黏膜纖毛排除分泌物的能力", "抽菸會影響你呼吸道濕潤吸入空氣的能力", "抽菸會影響你呼吸道過濾吸入空氣的能力"], "answer": 1, "explanation": "本題正確答案為「抽菸會影響你呼吸道黏膜纖毛排除分泌物的能力」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-015", "unit": "單元9 呼吸系統疾病與護理3", "question": "肺葉切除手術後右側胸管留置病人，胸管抽吸控制瓶中持續有氣泡產生，應提供下列何項護理處置？", "options": ["調高抽吸的壓力", "更換新的抽吸控制瓶", "可能發生氣胸，需立即通知醫師", "正常現象，繼續觀察"], "answer": 2, "explanation": "本題正確答案為「可能發生氣胸，需立即通知醫師」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-016", "unit": "單元9 呼吸系統疾病與護理3", "question": "肺癌病人接受下列何種手術後，不需要使用胸腔水下引流裝置？", "options": ["全肺切除術(pneumonectomy)", "肺葉切除術(lobectomy)", "肺節切除術(segmentectomy)", "楔形切除術(wedge resection)"], "answer": 0, "explanation": "本題正確答案為「全肺切除術(pneumonectomy)」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-017", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺癌手術治療之敘述，下列何者正確？", "options": ["手術切除較適合於IIIB期以上病人", "胸部X光檢查發現腫塊＞，即可接受手術", "手術前評估FEV1時，須注意切除範圍，以保留術後至少", "全肺切除術後，較少使用胸腔引流"], "answer": 3, "explanation": "本題正確答案為「全肺切除術後，較少使用胸腔引流」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-018", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關肺癌病人進行肺葉切除(lobectomy)手術前護理指導之敘述，下列何者錯誤？", "options": ["術前戒菸是為了要減少痰液的分泌，增加氧合能力", "行心肺功能檢查的目的是為了確認術後的功能所受影響及恢復情形", "教導吸氣較吐氣為長的胸式呼吸，以降低術後疼痛及增加氧合", "實施全關節運動是為預防關節攣縮及維持肌肉張力"], "answer": 2, "explanation": "本題正確答案為「教導吸氣較吐氣為長的胸式呼吸，以降低術後疼痛及增加氧合」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-019", "unit": "單元9 呼吸系統疾病與護理3", "question": "為肺葉切除術後病人進行胸部評估時，發現傷口周圍皮膚組織像海綿狀且有爆裂音，下列何者是病人最可能的問題？", "options": ["皮下氣腫", "肋膜積水", "氣胸", "連枷胸"], "answer": 0, "explanation": "本題正確答案為「皮下氣腫」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-020", "unit": "單元9 呼吸系統疾病與護理3", "question": "右肺葉切除術後病人的姿勢擺位，下列何者最適當？", "options": ["左或右側臥", "平躺或高坐臥", "平躺或右側臥", "左側臥或半坐臥"], "answer": 3, "explanation": "本題正確答案為「左側臥或半坐臥」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit9-021", "unit": "單元9 呼吸系統疾病與護理3", "question": "有關全肺切除術(penumonectomy)後之護理措施，下列何者正確？", "options": ["教導誘導性肺量 ，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-004", "unit": "單元11 心臟血管系統疾病與護理2", "question": "針對左心室射出率(EVEF)為12%，有端坐呼吸且雙側下肢水腫厲害的心臟衰竭病人之護理，下列何者較不適當？", "options": ["協助採半坐臥姿勢以維持呼吸順暢", "指導飲食限水、限鹽的方法", "抬高雙腳30度以上以利改善水腫", "監測並記錄體重變化及攝入與排出量"], "answer": 2, "explanation": "本題正確答案為「抬高雙腳30度以上以利改善水腫」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-005", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列何者為左心室衰竭早期常見的症狀？", "options": ["咳嗽", "頸靜脈怒張", "端坐呼吸", "陣發性夜間呼吸困難"], "answer": 0, "explanation": "本題正確答案為「咳嗽」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-006", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列何者為右心衰竭之早期臨床表徵？", "options": ["端坐呼吸", "下垂性水腫", "尿液減少", "肺水腫"], "answer": 1, "explanation": "本題正確答案為「下垂性水腫」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-007", "unit": "單元11 心臟血管系統疾病與護理2", "question": "歲的王太太是退休公務員，平日在家日常生活活動都靠家人幫忙，休息時仍感呼吸喘，晚上常因呼吸不順無法入睡，根據美國紐約心臟學會(NYHA)的心臟功能分級標準，上述情況何者正確？", "options": ["第一級", "第二級", "第三級", "第四級"], "answer": 3, "explanation": "本題正確答案為「第四級」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-008", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關心臟衰竭臨床處置之敘述，下列何者錯誤？", "options": ["使用主動脈內氣球幫浦(IABP)，可以增加冠狀動脈血流且減少心臟後負荷", "毛地黃與Thiazide類利尿劑並用，可以避免發生毛地黃中毒", "低鹽飲食可以減少心臟前負荷", "使用Dobutamine可以增加心肌收縮力，提高心輸出量"], "answer": 1, "explanation": "本題正確答案為「毛地黃與Thiazide類利尿劑並用，可以避免發生毛地黃中毒」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-009", "unit": "單元11 心臟血管系統疾病與護理2", "question": "下列那些藥物可以增加心輸出量？①毛地黃②dobutamine③中劑量dopamine④硝化甘油⑤鈣離子阻斷劑：", "options": ["①②③", "①②④", "②③⑤", "③④⑤"], "answer": 0, "explanation": "本題正確答案為「①②③」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-010", "unit": "單元11 心臟血管系統疾病與護理2", "question": "曾先生心臟衰竭住院，住院時出現臉色蒼白、冒冷汗、陣發性夜間呼吸困難及咳出大量帶有血絲的泡沫痰。請問曾先生出現那一種合併症？", "options": ["氣喘", "肺結核", "肺栓塞", "肺水腫"], "answer": 3, "explanation": "本題正確答案為「肺水腫」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-011", "unit": "單元11 心臟血管系統疾病與護理2", "question": "心衰竭病人之心電圖持續出現明顯U波，在給予藥物時，應注意下列何種藥物可能有中毒的危險？", "options": ["利尿劑", "軟便劑", "血管擴張劑", "毛地黃製劑"], "answer": 3, "explanation": "本題正確答案為「毛地黃製劑」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit11-012", "unit": "單元11 心臟血管系統疾病與護理2", "question": "有關降低 議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-028", "unit": "單元12 心臟血管系統疾病與護理3", "question": "長期臥床不動病人容易出現靜脈血栓，主要原因為下列何者？", "options": ["靜脈血流鬱積", "血液凝集結塊", "血球異常增生", "靜脈管壁損傷"], "answer": 0, "explanation": "本題正確答案為「靜脈血流鬱積」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-029", "unit": "單元12 心臟血管系統疾病與護理3", "question": "針對下肢深部靜脈血栓炎病人出現紅、腫、熱、痛的徵象與症狀之護理措施，下列何者不適宜？", "options": ["適度抬高下肢減輕腫脹", "按摩患處，以促進血液循環", "患肢應避免注射或其他侵入性治療", "每日評估並記錄患肢的腫脹情形"], "answer": 1, "explanation": "本題正確答案為「按摩患處，以促進血液循環」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-030", "unit": "單元12 心臟血管系統疾病與護理3", "question": "病人下肢出現腫脹、發紅、溫熱感且霍曼氏徵象(Homan’s sign)呈陽性反應，下列何者為其最有可能的診斷？", "options": ["靜脈曲張", "周邊動脈阻塞", "深部靜脈栓塞", "右心衰竭"], "answer": 2, "explanation": "本題正確答案為「深部靜脈栓塞」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-031", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關評估交通靜脈與隱靜脈瓣功能之檢查，下列何者正確？", "options": ["逆流填充測驗(Retrograde filling test)", "霍曼氏徵象測驗(Homans’ sign test)", "墨菲氏徵象測驗(Murphy’s sign test)", "灌注測驗(Perfusion test)"], "answer": 0, "explanation": "本題正確答案為「逆流填充測驗(Retrograde filling test)」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-032", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關低血壓的治療，下列敘述何者錯誤？", "options": ["給與β1接受器拮抗劑可以增加心跳速率，提高心輸出量", "給與α1接受器促進劑可以增加周邊血管阻力，使血壓升高", "採頭低腳高的姿勢是為了增加前負荷，提高心輸出量", "使用中劑量Dopamine 可以同時增加心輸出量與增加周邊血管阻力"], "answer": 0, "explanation": "本題正確答案為「給與β1接受器拮抗劑可以增加心跳速率，提高心輸出量」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-033", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關深部血栓靜脈炎病人之護理措施，下列何者不適當？", "options": ["協助抬高患肢臥床休息", "教導穿彈性襪", "注意是否有肺栓塞徵候", "提供患肢按摩以緩解不適"], "answer": 3, "explanation": "本題正確答案為「提供患肢按摩以緩解不適」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-034", "unit": "單元12 心臟血管系統疾病與護理3", "question": "林空服員近日覺得小腿不適，護理師採取下列何項評估其深部靜脈栓塞？", "options": ["艾倫試驗(Allen test)", "霍曼氏徵象(Homan’s sign)", "抬腿試驗(leg raising test)", "克尼格氏徵象(Kernig’s sign)"], "answer": 1, "explanation": "本題正確答案為「霍曼氏徵象(Homan’s sign)」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-035", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關長時間靜脈注射抗生素引發靜脈炎的護理措施，下列何者錯誤？", "options": ["抬高患肢", "鼓勵活動", "立即拔除靜脈導管", "給予局部溫敷"], "answer": 1, "explanation": "本題正確答案為「鼓勵活動」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-036", "unit": "單元12 心臟血管系統疾病與護理3", "question": "預防靜脈曲張的護理指導，下列何者最適當？①避免外傷②下肢不宜抬高③不需特別控制體重④應規律運動：", "options": ["①③", "①④", "②③", "②④"], "answer": 1, "explanation": "本題正確答案為「①④」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-037", "unit": "單元12 心臟血管系統疾病與護理3", "question": "使用Warfarin(CoumadinⓇ)預防深部靜脈栓塞(deep vein thrombosis; DVT)之護理指導，下列何者正確？①需定期監測凝血酶原時間(PT)②鼓勵多攝取銀杏、當歸③若出現血尿是正常的現象不需理會④宜使用電動刮鬍刀：", "options": ["①③", "①④", "②③", "②④"], "answer": 1, "explanation": "本題正確答案為「①④」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-038", "unit": "單元12 心臟血管系統疾病與護理3", "question": "評估時請病人快速彎曲足背，如果出現小腿疼痛，表示為下列何種徵象？", "options": ["霍夫曼徵象(Hoffmann’s sign)", "霍克尼氏徵象(Hochne’s sign)", "霍伯氏徵象(Hope’s sign)", "霍曼氏徵象(Homan’s sign)"], "answer": 3, "explanation": "本題正確答案為「霍曼氏徵象(Homan’s sign)」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-039", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關下列狀況之病人，何者最不需服用抗凝血劑治療？", "options": ["心房纖維顫動", "剝離性動脈瘤", "心肌梗塞", "二尖瓣置換術"], "answer": 1, "explanation": "本題正確答案為「剝離性動脈瘤」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-040", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關搭飛機長程旅行後常會出現深部靜脈栓塞的主要原因，下列何者正確？", "options": ["靜脈內皮細胞受損", "血液凝固性增加", "血液鬱積", "血管收縮"], "answer": 2, "explanation": "本題正確答案為「血液鬱積」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-041", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關靜脈曲張之護理指導，下列敘述何者正確？", "options": ["建議穿著緊身衣", "無需維持理想體重", "不宜運動以避免惡化", "睡前可抬高患肢"], "answer": 3, "explanation": "本題正確答案為「睡前可抬高患肢」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-042", "unit": "單元12 心臟血管系統疾病與護理3", "question": "靜脈注射不當造成血管紅、腫、痛是屬於下列何種血管問題？", "options": ["靜脈曲張", "血栓性靜脈炎", "靜脈功能不全", "靜脈鬱滯性潰瘍"], "answer": 1, "explanation": "本題正確答案為「血栓性靜脈炎」，建議回到題幹與選項關鍵字重新比對。"}, {"id": "unit12-043", "unit": "單元12 心臟血管系統疾病與護理3", "question": "有關下肢深部靜脈栓塞服用Warfarin病人之護理指導，下列何者正確？", "options": ["需監測活化部分凝血酶原時間(APTT)", "可以自行停用藥物", "避免大量食用深綠色蔬菜", "建議補充維生素K"], "answer": 2, "explanation": "本題正確答案為「避免大量食用深綠色蔬菜」，建議回到題幹與選項關鍵字重新比對。"}];
    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let answeredCurrent = false;

    const unitLabel = document.getElementById('unit-label');
    const sessionStatus = document.getElementById('session-status');
    const currentNumber = document.getElementById('current-number');
    const totalNumber = document.getElementById('total-number');
    const correctCountNode = document.getElementById('correct-count');
    const wrongCountNode = document.getElementById('wrong-count');
    const progressFill = document.getElementById('progress-fill');
    const questionText = document.getElementById('question-text');
    const options = document.getElementById('options');
    const explanation = document.getElementById('explanation');
    const explanationText = document.getElementById('explanation-text');
    const nextButton = document.getElementById('next-button');

    function updateProgress() {
      currentNumber.textContent = String(Math.min(currentIndex + 1, Math.max(questions.length, 1)));
      totalNumber.textContent = String(questions.length);
      correctCountNode.textContent = String(correctCount);
      wrongCountNode.textContent = String(wrongCount);
      const ratio = questions.length ? (currentIndex / questions.length) * 100 : 0;
      progressFill.style.width = `${ratio}%`;
      nextButton.disabled = !answeredCurrent;
      nextButton.classList.toggle('enabled', answeredCurrent);
    }

    function renderQuestion() {
      const item = questions[currentIndex];
      answeredCurrent = false;
      sessionStatus.textContent = '本輪進行中';
      unitLabel.textContent = item.unit;
      questionText.textContent = item.question;
      explanationText.textContent = item.explanation;
      explanation.classList.remove('show');
      options.innerHTML = '';
      item.options.forEach((label, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        button.textContent = `${String.fromCharCode(65 + index)}. ${label}`;
        button.addEventListener('click', () => handleAnswer(index));
        options.appendChild(button);
      });
      nextButton.textContent = '下一題';
      updateProgress();
    }

    function handleAnswer(selectedIndex) {
      if (answeredCurrent) return;
      answeredCurrent = true;
      const item = questions[currentIndex];
      const buttons = [...options.querySelectorAll('.option')];
      buttons.forEach((button) => {
        button.disabled = true;
      });
      if (selectedIndex === item.answer) {
        correctCount += 1;
        buttons[selectedIndex].classList.add('correct');
      } else {
        wrongCount += 1;
        buttons[selectedIndex].classList.add('wrong');
        buttons[item.answer].classList.add('correct');
      }
      explanation.classList.add('show');
      updateProgress();
    }

    function showCompletion() {
      sessionStatus.textContent = '本輪完成';
      unitLabel.textContent = '完成';
      questionText.textContent = `你已完成 ${questions.length} 題`;
      options.innerHTML = '';
      answeredCurrent = true;
      explanation.classList.add('show');
      explanationText.textContent = `答對 ${correctCount} 題，錯題 ${wrongCount} 題。按下方按鈕可重新開始。`;
      nextButton.textContent = '重新開始';
      nextButton.disabled = false;
      nextButton.classList.add('enabled');
      progressFill.style.width = '100%';
    }

    nextButton.addEventListener('click', () => {
      if (!answeredCurrent && questions.length) return;
      if (!questions.length) return;
      if (currentIndex === questions.length - 1 && nextButton.textContent === '下一題') {
        showCompletion();
        return;
      }
      if (nextButton.textContent === '重新開始') {
        currentIndex = 0;
        correctCount = 0;
        wrongCount = 0;
        renderQuestion();
        return;
      }
      currentIndex += 1;
      renderQuestion();
    });

    if (questions.length) {
      renderQuestion();
    } else {
      sessionStatus.textContent = '目前沒有題目';
      unitLabel.textContent = '題庫未載入';
      questionText.textContent = '請先確認題庫是否已成功匯入。';
      nextButton.style.display = 'none';
    }
  </script>
</body>
</html>
